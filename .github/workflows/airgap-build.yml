name: Airgap Build & Push

# Fork-only workflow. Builds and pushes the 4 airgap image variants
# (privileged + unprivileged, each multi-arch amd64 + arm64) to DockerHub.
#
# Designed in stages — future jobs will be appended below `build`:
#   - update-helm   (edits Chart.yaml + READMEs, commits, pushes)
#   - publish-helm  (helm package + helm push to OCI registry)
#   - merge-upstream (auto-merge from origin/main when safe)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which variant(s) to build
        type: choice
        options:
          - both
          - privileged
          - unprivileged
        default: both
      platforms:
        description: Which platform(s) to build
        type: choice
        options:
          - both
          - amd64
          - arm64
        default: both
      tag_override:
        description: >-
          Custom tag for testing (e.g. "test1"). When set, replaces the
          auto HASH-based tag and SKIPS the rolling :latest / :unprivileged
          tags so you can safely delete it later. Leave empty for normal builds.
        type: string
        default: ''

env:
  REPO: a0533057932/redis-docs

jobs:
  build:
    name: Build & push docker images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      hash: ${{ steps.meta.outputs.hash }}
      platforms: ${{ steps.meta.outputs.platforms }}
      priv_tags: ${{ steps.meta.outputs.priv_tags }}
      unpriv_tags: ${{ steps.meta.outputs.unpriv_tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Setup
      # ----------------------------------------------------------------------
      - name: Compute build params
        id: meta
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_OVERRIDE: ${{ inputs.tag_override }}
        run: |
          set -euo pipefail
          HASH=$(git rev-parse --short=9 HEAD)

          case "$INPUT_PLATFORMS" in
            both)  PLATFORMS=linux/amd64,linux/arm64 ;;
            amd64) PLATFORMS=linux/amd64 ;;
            arm64) PLATFORMS=linux/arm64 ;;
            *) echo "Unknown platforms: $INPUT_PLATFORMS" >&2; exit 1 ;;
          esac

          {
            echo "hash=$HASH"
            echo "platforms=$PLATFORMS"

            echo "priv_tags<<EOF"
            if [ -n "$INPUT_OVERRIDE" ]; then
              echo "$REPO:$INPUT_OVERRIDE"
            else
              echo "$REPO:$HASH"
              echo "$REPO:latest"
            fi
            echo "EOF"

            echo "unpriv_tags<<EOF"
            if [ -n "$INPUT_OVERRIDE" ]; then
              echo "$REPO:$INPUT_OVERRIDE-unprivileged"
            else
              echo "$REPO:$HASH-unprivileged"
              echo "$REPO:unprivileged"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "::notice title=Build params::commit=$HASH platforms=$PLATFORMS variant=$INPUT_VARIANT override=${INPUT_OVERRIDE:-none}"

      - name: Write build plan to run summary
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_OVERRIDE: ${{ inputs.tag_override }}
          HASH: ${{ steps.meta.outputs.hash }}
          PLATFORMS: ${{ steps.meta.outputs.platforms }}
          PRIV_TAGS: ${{ steps.meta.outputs.priv_tags }}
          UNPRIV_TAGS: ${{ steps.meta.outputs.unpriv_tags }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OVERRIDE_DISPLAY="${INPUT_OVERRIDE:-(none — auto HASH + rolling tags)}"

          {
            echo "## Build plan"
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Commit | \`$HASH\` |"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Variant | \`$INPUT_VARIANT\` |"
            echo "| Platforms | \`$PLATFORMS\` |"
            echo "| Tag override | \`$OVERRIDE_DISPLAY\` |"
            echo ""

            if [ "$INPUT_VARIANT" != "unprivileged" ]; then
              echo "### Privileged tags to push"
              echo '```'
              echo "$PRIV_TAGS"
              echo '```'
            fi

            if [ "$INPUT_VARIANT" != "privileged" ]; then
              echo "### Unprivileged tags to push"
              echo '```'
              echo "$UNPRIV_TAGS"
              echo '```'
            fi

            echo ""
            echo "## Progress"
            echo ""
            echo "| Stage | Status |"
            echo "|-------|--------|"
            echo "| 1/5: Install dependencies (apt + hugo + npm + pip) | ⏳ pending |"
            echo "| 2/5: Clone external components (make components) | ⏳ pending |"
            echo "| 3/5: Hugo multi-version build + gzip | ⏳ pending |"
            echo "| 4/5: Build & push privileged | ⏳ pending |"
            echo "| 5/5: Build & push unprivileged | ⏳ pending |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up QEMU (for arm64 runtime layer)
        if: inputs.platforms != 'amd64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # Stage 1/5: Install build dependencies
      # ----------------------------------------------------------------------
      - name: "Stage 1/5: Install build dependencies"
        id: stage1
        uses: docker/build-push-action@v7
        with:
          context: .
          target: deps
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
      - name: "Stage 1/5: summary"
        if: always() && steps.stage1.conclusion != 'skipped'
        env:
          STAGE_OUTCOME: ${{ steps.stage1.outcome }}
        run: |
          ICON="✅"
          [ "$STAGE_OUTCOME" != "success" ] && ICON="❌"
          echo "- $ICON **Stage 1/5**: Dependencies installed ($STAGE_OUTCOME)" >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------------
      # Stage 2/5: Clone external example repos
      # ----------------------------------------------------------------------
      - name: "Stage 2/5: Clone external components"
        id: stage2
        uses: docker/build-push-action@v7
        with:
          context: .
          target: components
          secrets: |
            PRIVATE_ACCESS_TOKEN=${{ secrets.PRIVATE_ACCESS_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
      - name: "Stage 2/5: summary"
        if: always() && steps.stage2.conclusion != 'skipped'
        env:
          STAGE_OUTCOME: ${{ steps.stage2.outcome }}
        run: |
          ICON="✅"
          [ "$STAGE_OUTCOME" != "success" ] && ICON="❌"
          echo "- $ICON **Stage 2/5**: External components cloned ($STAGE_OUTCOME)" >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------------
      # Stage 3/5: Hugo multi-version build (the long one, ~30 min on GHA
      # for a fully-cold build, much less when the per-version cache mount
      # has entries from previous runs).
      # ----------------------------------------------------------------------
      - name: "Stage 3/5: Hugo multi-version build + gzip"
        id: stage3
        uses: docker/build-push-action@v7
        with:
          context: .
          target: builder
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
      - name: "Stage 3/5: summary"
        if: always() && steps.stage3.conclusion != 'skipped'
        env:
          STAGE_OUTCOME: ${{ steps.stage3.outcome }}
        run: |
          ICON="✅"
          [ "$STAGE_OUTCOME" != "success" ] && ICON="❌"
          echo "- $ICON **Stage 3/5**: Hugo multi-build + gzip complete ($STAGE_OUTCOME)" >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------------
      # Stage 4/5: Build & push privileged. Builder layers come from cache;
      # only the runtime stage (COPY + LABEL) actually runs, then push.
      # ----------------------------------------------------------------------
      - name: "Stage 4/5: Build & push privileged"
        id: stage4
        if: inputs.variant != 'unprivileged'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ steps.meta.outputs.platforms }}
          target: final
          build-args: |
            VARIANT=privileged
          secrets: |
            PRIVATE_ACCESS_TOKEN=${{ secrets.PRIVATE_ACCESS_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.priv_tags }}
          push: true
      - name: "Stage 4/5: summary"
        if: always() && steps.stage4.conclusion != 'skipped'
        env:
          STAGE_OUTCOME: ${{ steps.stage4.outcome }}
        run: |
          ICON="✅"
          [ "$STAGE_OUTCOME" != "success" ] && ICON="❌"
          echo "- $ICON **Stage 4/5**: Privileged pushed to DockerHub ($STAGE_OUTCOME)" >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------------
      # Stage 5/5: Build & push unprivileged
      # ----------------------------------------------------------------------
      - name: "Stage 5/5: Build & push unprivileged"
        id: stage5
        if: inputs.variant != 'privileged'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ steps.meta.outputs.platforms }}
          target: final
          build-args: |
            VARIANT=unprivileged
          secrets: |
            PRIVATE_ACCESS_TOKEN=${{ secrets.PRIVATE_ACCESS_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.unpriv_tags }}
          push: true
      - name: "Stage 5/5: summary"
        if: always() && steps.stage5.conclusion != 'skipped'
        env:
          STAGE_OUTCOME: ${{ steps.stage5.outcome }}
        run: |
          ICON="✅"
          [ "$STAGE_OUTCOME" != "success" ] && ICON="❌"
          echo "- $ICON **Stage 5/5**: Unprivileged pushed to DockerHub ($STAGE_OUTCOME)" >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------------
      # Final summary with pull/cleanup commands. Runs even on failure so
      # you see what was attempted.
      # ----------------------------------------------------------------------
      - name: Write final summary with pull / cleanup commands
        if: always()
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_OVERRIDE: ${{ inputs.tag_override }}
          STATUS: ${{ job.status }}
          PRIV_TAGS: ${{ steps.meta.outputs.priv_tags }}
          UNPRIV_TAGS: ${{ steps.meta.outputs.unpriv_tags }}
        run: |
          set -euo pipefail

          {
            echo ""
            echo "## Result: \`$STATUS\`"
            echo ""

            if [ "$STATUS" != "success" ]; then
              echo "Build did not complete successfully — see step logs above."
              exit 0
            fi

            echo "### Pull commands"
            echo ""

            if [ "$INPUT_VARIANT" != "unprivileged" ]; then
              echo "**Privileged (port 80):**"
              echo '```bash'
              while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                echo "docker pull $tag"
              done <<< "$PRIV_TAGS"
              echo '```'
            fi

            if [ "$INPUT_VARIANT" != "privileged" ]; then
              echo "**Unprivileged (port 8080, for k8s/OpenShift):**"
              echo '```bash'
              while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                echo "docker pull $tag"
              done <<< "$UNPRIV_TAGS"
              echo '```'
            fi

            echo ""
            echo "### Quick run (locally on your machine)"
            echo '```bash'
            if [ "$INPUT_VARIANT" != "privileged" ]; then
              FIRST_UNPRIV=$(printf '%s\n' "$UNPRIV_TAGS" | head -n1)
              echo "docker run --rm -p 8080:8080 $FIRST_UNPRIV"
              echo "# open http://localhost:8080"
            elif [ "$INPUT_VARIANT" != "unprivileged" ]; then
              FIRST_PRIV=$(printf '%s\n' "$PRIV_TAGS" | head -n1)
              echo "docker run --rm -p 80:80 $FIRST_PRIV"
              echo "# open http://localhost"
            fi
            echo '```'

            if [ -n "$INPUT_OVERRIDE" ]; then
              echo ""
              echo "### Cleanup (this was a test build with tag_override=\`$INPUT_OVERRIDE\`)"
              echo "Delete the test tags from DockerHub when done:"
              echo '```bash'
              echo "# DockerHub UI → repo → Tags → delete each:"
              if [ "$INPUT_VARIANT" != "unprivileged" ]; then
                while IFS= read -r t; do
                  [ -z "$t" ] && continue
                  echo "#   $t"
                done <<< "$PRIV_TAGS"
              fi
              if [ "$INPUT_VARIANT" != "privileged" ]; then
                while IFS= read -r t; do
                  [ -z "$t" ] && continue
                  echo "#   $t"
                done <<< "$UNPRIV_TAGS"
              fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # STAGE 2 (future) — Helm chart automation
  #
  # update-helm:
  #   needs: build
  #   permissions:
  #     contents: write   # to commit + push the bump
  #   steps:
  #     - edit helm/redis-docs/Chart.yaml (version + appVersion=${{ needs.build.outputs.hash }})
  #     - edit helm/redis-docs/README.md, README-he.md, values-openshift-airgapped.yaml
  #     - git commit + git push
  #
  # publish-helm:
  #   needs: update-helm
  #   steps:
  #     - install helm
  #     - helm registry login docker.io
  #     - helm package helm/redis-docs/
  #     - helm push redis-docs-<version>.tgz oci://registry-1.docker.io/a0533057932
  # ============================================================================

  # ============================================================================
  # STAGE 3 (future, exploratory) — auto-merge upstream when safe
  #
  # merge-upstream:
  #   # runs BEFORE build; only when pre-merge review checks (BUILD.md step 1)
  #   # pass cleanly with zero output
  # ============================================================================