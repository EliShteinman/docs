name: Airgap Build & Push

# Cloud equivalent of the local Dockerfile + airgap-multibuild.sh pipeline.
# Does the same multi-version Hugo build, but in parallel across GHA runners,
# with path-specific actions/cache keys so unchanged versions hit cache.
#
# Pipeline mirrors the local one phase-by-phase:
#   - Dockerfile builder phase A (apt + hugo + npm + pip)  → setup job, with caches on node_modules, venv
#   - Dockerfile builder phase B (make components)         → setup job, cache on examples/
#   - airgap-multibuild.sh pre-snapshot patches            → setup job, inline
#   - airgap-multibuild.sh build latest                    → build_latest job, cache on hugo-latest-<hash>
#   - airgap-multibuild.sh build per (product, version)    → build_versions job (matrix), cache on hugo-<product>-<version>-<hash>
#   - airgap-multibuild.sh assemble + ndjson + gzip        → assemble job
#   - Dockerfile runtime stages                            → docker job, Dockerfile.runtime
#
# Original Dockerfile and airgap-multibuild.sh are untouched and still work
# for local `docker buildx build .` from a developer machine.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which variant(s) to build
        type: choice
        options:
          - both
          - privileged
          - unprivileged
        default: both
      platforms:
        description: Which platform(s) to build (for the final nginx image)
        type: choice
        options:
          - both
          - amd64
          - arm64
        default: both
      tag_override:
        description: >-
          Custom tag for testing. When set, replaces the auto HASH-based tag
          and SKIPS the rolling :latest / :unprivileged tags. Leave empty for
          normal builds.
        type: string
        default: ''

env:
  REPO: a0533057932/redis-docs
  HUGO_VERSION: 0.143.1

jobs:
  # =========================================================================
  # Phase 1: setup — install deps, fetch components, apply pre-snapshot
  # patches, discover versions, package the workspace for matrix runners.
  # =========================================================================
  setup:
    name: 1. Setup workspace
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      hash: ${{ steps.meta.outputs.hash }}
      platforms: ${{ steps.meta.outputs.platforms }}
      priv_tags: ${{ steps.meta.outputs.priv_tags }}
      unpriv_tags: ${{ steps.meta.outputs.unpriv_tags }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout (full history for enableGitInfo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build params
        id: meta
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_OVERRIDE: ${{ inputs.tag_override }}
        run: |
          set -euo pipefail
          HASH=$(git rev-parse --short=9 HEAD)
          case "$INPUT_PLATFORMS" in
            both)  PLATFORMS=linux/amd64,linux/arm64 ;;
            amd64) PLATFORMS=linux/amd64 ;;
            arm64) PLATFORMS=linux/arm64 ;;
            *) echo "Bad platforms: $INPUT_PLATFORMS" >&2; exit 1 ;;
          esac
          {
            echo "hash=$HASH"
            echo "platforms=$PLATFORMS"
            echo "priv_tags<<EOF"
            if [ -n "$INPUT_OVERRIDE" ]; then
              echo "$REPO:$INPUT_OVERRIDE"
            else
              echo "$REPO:$HASH"
              echo "$REPO:latest"
            fi
            echo "EOF"
            echo "unpriv_tags<<EOF"
            if [ -n "$INPUT_OVERRIDE" ]; then
              echo "$REPO:$INPUT_OVERRIDE-unprivileged"
            else
              echo "$REPO:$HASH-unprivileged"
              echo "$REPO:unprivileged"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Hugo
        run: |
          wget -qO /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-venv rsync gawk jq

      # ---- npm cache + install ----
      - name: Restore node_modules cache
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: npm install
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      # ---- pip cache + install (venv at /opt/venv) ----
      - name: Restore python venv cache
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: /opt/venv
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: pip install into venv
        if: steps.cache-pip.outputs.cache-hit != 'true'
        run: |
          sudo python3 -m venv /opt/venv
          sudo chown -R "$USER" /opt/venv
          /opt/venv/bin/pip install --quiet -r requirements.txt

      - name: Fix venv ownership (cache restores as runner, no-op if already writable)
        run: |
          if [ ! -w /opt/venv ]; then
            sudo chown -R "$USER" /opt/venv
          fi

      # ---- examples/ cache + make components ----
      - name: Restore examples (make components output) cache
        id: cache-examples
        uses: actions/cache@v4
        with:
          path: examples
          key: components-${{ runner.os }}-${{ hashFiles('Makefile', 'build/**', 'data/components_local/index.json') }}

      - name: make components (fetch external client repos)
        if: steps.cache-examples.outputs.cache-hit != 'true'
        env:
          PRIVATE_ACCESS_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
        run: |
          export PATH="/opt/venv/bin:$PATH"
          make components

      # ---- Pre-snapshot airgap patches (deterministic, run every time) ----
      # These match airgap-multibuild.sh lines 24-50.
      - name: Apply airgap source patches
        run: |
          set -euo pipefail
          # 1. Relax version-selector regex so dropdown appears under any baseURL
          python3 <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("layouts/partials/scripts.html")
          text = p.read_text()
          text, n_op  = re.subn(r"new RegExp\('/docs/\(latest\|staging\\/\.\+\)/operate/(\w+)/\.\*'\)",
                                r"new RegExp('/operate/\1/')", text)
          text, n_dev = re.subn(r"new RegExp\('/docs/\(latest\|staging\\/\.\+\)/develop/ai/(\w+)/\.\*'\)",
                                r"new RegExp('/develop/ai/\1/')", text)
          p.write_text(text)
          assert n_op + n_dev == 3, f"expected 3 regex relaxations, got {n_op + n_dev}"
          print(f"airgap: relaxed {n_op + n_dev} version-selector regex(es)")
          PYEOF
          # 2. Strip hardcoded redis.io/docs/latest from content/*.md
          find content -type f -name '*.md' -print0 | xargs -0 sed -i \
            -e 's|https://redis.io/docs/latest/|/|g' \
            -e 's|redis\.io/docs/latest/|/|g'
          # 3. baseURL and Hugo per-partial timeout (matches Dockerfile lines 47, 51)
          sed -i 's#baseURL = "https://redis.io"#baseURL = "/"#g' config.toml
          sed -i 's/timeout="75"/timeout="600"/' config.toml

      # ---- Discover versions, write version-files, emit matrix JSON ----
      - name: Discover versions and emit matrix JSON
        id: matrix
        run: |
          set -euo pipefail
          discover() {
            local d=$1
            if [ -d "$d" ]; then
              find "$d" -mindepth 1 -maxdepth 1 -type d -regextype posix-extended -regex ".*/[0-9]+\.[0-9]+(\.[0-9]+)?$" \
                | awk -F/ '{print $NF}' | sort
            fi
          }
          K8S=$(discover content/operate/kubernetes)
          RS=$(discover content/operate/rs)
          REDISVL=$(discover content/develop/ai/redisvl)

          # Write version-files (consumed by docs-nav.html template).
          # These must be in workspace so latest + all matrix runners have them.
          echo "$K8S"     > kubernetes-versions
          echo "$RS"      > rs-versions
          echo "$REDISVL" > redisvl-versions
          : > rdi-versions

          {
            echo '['
            sep=''
            for v in $K8S; do
              echo "$sep{\"name\":\"k8s-$v\",\"product\":\"operate/kubernetes\",\"version\":\"$v\",\"product_label\":\"Redis for Kubernetes\",\"product_pascal\":\"Kubernetes\"}"
              sep=','
            done
            for v in $RS; do
              echo "$sep{\"name\":\"rs-$v\",\"product\":\"operate/rs\",\"version\":\"$v\",\"product_label\":\"Redis Software\",\"product_pascal\":\"Rs\"}"
              sep=','
            done
            for v in $REDISVL; do
              echo "$sep{\"name\":\"redisvl-$v\",\"product\":\"develop/ai/redisvl\",\"version\":\"$v\",\"product_label\":\"RedisVL\",\"product_pascal\":\"Redisvl\"}"
              sep=','
            done
            echo ']'
          } | jq -c . > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "Matrix entries: $(jq 'length' matrix.json)"
          jq -r '.[] | "  - \(.name)"' matrix.json

      # ---- Bundle the workspace for the matrix + latest runners ----
      # --anchored is required: without it, --exclude=public would also strip
      # node_modules/tailwindcss/lib/public/ and break postcss.
      # .git IS included because config.toml has enableGitInfo=true (Hugo runs
      # `git log` per page to populate lastmod).
      - name: Tar workspace
        run: |
          set -euo pipefail
          tar --anchored \
              --exclude='./public' \
              --exclude='./resources' \
              --exclude='./.hugo_build.lock' \
              --exclude='./PRIVATE_ACCESS_TOKEN' \
              --exclude='./.github' \
              --exclude='./helm' \
              -czf /tmp/workspace.tar.gz .
          ls -lh /tmp/workspace.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: /tmp/workspace.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Write build plan
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_OVERRIDE: ${{ inputs.tag_override }}
          HASH: ${{ steps.meta.outputs.hash }}
          PLATFORMS: ${{ steps.meta.outputs.platforms }}
          PRIV_TAGS: ${{ steps.meta.outputs.priv_tags }}
          UNPRIV_TAGS: ${{ steps.meta.outputs.unpriv_tags }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OVERRIDE_DISPLAY="${INPUT_OVERRIDE:-(none — auto HASH + rolling tags)}"
          COUNT=$(jq 'length' matrix.json)
          {
            echo "## Build plan"
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Commit | \`$HASH\` |"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Variant | \`$INPUT_VARIANT\` |"
            echo "| Platforms | \`$PLATFORMS\` |"
            echo "| Tag override | \`$OVERRIDE_DISPLAY\` |"
            echo "| Matrix size | $COUNT version builds + 1 latest |"
            echo ""
            if [ "$INPUT_VARIANT" != "unprivileged" ]; then
              echo "### Privileged tags"
              echo '```'
              echo "$PRIV_TAGS"
              echo '```'
            fi
            if [ "$INPUT_VARIANT" != "privileged" ]; then
              echo "### Unprivileged tags"
              echo '```'
              echo "$UNPRIV_TAGS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Phase 2a: build_latest — equivalent to airgap-multibuild.sh "build latest"
  # =========================================================================
  build_latest:
    name: 2a. Build latest
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Install Hugo
        run: |
          wget -qO /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - name: Install system deps
        run: sudo apt-get install -y --no-install-recommends rsync

      - uses: actions/download-artifact@v4
        with:
          name: workspace
          path: /tmp/

      - name: Extract workspace
        run: |
          mkdir -p site
          tar -xzf /tmp/workspace.tar.gz -C site

      # Hash key = all non-version content + layouts + config + workflow file.
      # Excludes content under /content/<section>/<product>/<X.Y[.Z]>/ because
      # those don't affect latest's output (we rm -rf them before Hugo).
      - name: Compute cache key
        id: key
        working-directory: site
        run: |
          set -euo pipefail
          {
            find content -type f \
              ! -regex '.*/content/operate/kubernetes/[0-9]+\.[0-9]+\(\.[0-9]+\)?/.*' \
              ! -regex '.*/content/operate/rs/[0-9]+\.[0-9]+\(\.[0-9]+\)?/.*' \
              ! -regex '.*/content/develop/ai/redisvl/[0-9]+\.[0-9]+\(\.[0-9]+\)?/.*' \
              -print0 | sort -z | xargs -0 sha256sum
            find layouts -type f -print0 | sort -z | xargs -0 sha256sum
            for f in config.toml postcss.config.js tailwind.config.js package-lock.json; do
              [ -f "$f" ] && sha256sum "$f"
            done
            cat kubernetes-versions rs-versions redisvl-versions rdi-versions
            sha256sum ../.github/workflows/airgap-build.yml 2>/dev/null || true
          } | sha256sum | awk '{print $1}' | cut -c1-16 > /tmp/key
          echo "key=$(cat /tmp/key)" >> "$GITHUB_OUTPUT"

      - name: Restore Hugo output cache
        id: cache
        uses: actions/cache@v4
        with:
          path: site/output
          key: hugo-latest-${{ steps.key.outputs.key }}

      - name: Build latest (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: site
        run: |
          set -euo pipefail
          export PATH="/opt/venv/bin:$PATH"
          # Remove all version dirs — latest = the site as it'd look if there
          # were no versions at all.
          for parent in content/operate/kubernetes content/operate/rs content/develop/ai/redisvl; do
            [ -d "$parent" ] || continue
            find "$parent" -mindepth 1 -maxdepth 1 -type d -regextype posix-extended \
              -regex ".*/[0-9]+\.[0-9]+(\.[0-9]+)?$" -exec rm -rf {} +
          done
          hugo --logLevel info -d output

      - name: Stage output as artifact
        working-directory: site
        run: tar -czf /tmp/out.tar.gz output

      - uses: actions/upload-artifact@v4
        with:
          name: build-latest
          path: /tmp/out.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Append progress
        env:
          HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = "true" ]; then
            echo "- ✅ Stage 2a: latest (cache HIT)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ✅ Stage 2a: latest (built fresh)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # =========================================================================
  # Phase 2b: build_versions — matrix of N parallel jobs, one per version
  # =========================================================================
  build_versions:
    name: "2b. Build ${{ matrix.name }}"
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Install Hugo
        run: |
          wget -qO /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - name: Install system deps
        run: sudo apt-get install -y --no-install-recommends rsync gawk

      - uses: actions/download-artifact@v4
        with:
          name: workspace
          path: /tmp/

      - name: Extract workspace
        run: |
          mkdir -p site
          tar -xzf /tmp/workspace.tar.gz -C site

      # Hash key = THIS version's content + shared layouts + config + workflow.
      # Independent of other versions' content (their hashes don't enter here).
      - name: Compute cache key
        id: key
        working-directory: site
        env:
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          {
            find "content/$PRODUCT/$VERSION" -type f -print0 | sort -z | xargs -0 sha256sum
            find layouts -type f -print0 | sort -z | xargs -0 sha256sum
            for f in config.toml postcss.config.js tailwind.config.js package-lock.json; do
              [ -f "$f" ] && sha256sum "$f"
            done
            cat kubernetes-versions rs-versions redisvl-versions rdi-versions
            sha256sum ../.github/workflows/airgap-build.yml 2>/dev/null || true
            printf 'product=%s version=%s\n' "$PRODUCT" "$VERSION"
          } | sha256sum | awk '{print $1}' | cut -c1-16 > /tmp/key
          echo "key=$(cat /tmp/key)" >> "$GITHUB_OUTPUT"

      - name: Restore Hugo output cache
        id: cache
        uses: actions/cache@v4
        with:
          path: site/output
          key: hugo-${{ matrix.name }}-${{ steps.key.outputs.key }}

      - name: Build version (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: site
        env:
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ matrix.version }}
          PRODUCT_LABEL: ${{ matrix.product_label }}
          PRODUCT_PASCAL: ${{ matrix.product_pascal }}
        run: |
          set -euo pipefail
          export PATH="/opt/venv/bin:$PATH"

          # Remove all OTHER versions of this product (matches airgap-multibuild.sh)
          VPARENT="content/$PRODUCT"
          find "$VPARENT" -mindepth 1 -maxdepth 1 -type d -regextype posix-extended \
            -regex ".*/[0-9]+\.[0-9]+(\.[0-9]+)?$" \
            | while read -r d; do
                if [ "$(basename "$d")" != "$VERSION" ]; then
                  rm -rf "$d"
                fi
              done

          # Strip the version prefix from relrefs in this version's content
          find "$VPARENT/$VERSION" -type f -name '*.md' | while read -r f; do
            awk -v pp="$PRODUCT" -v ver="$VERSION" '
              { gsub("\\(\\{\\{< ?relref \"/" pp "/" ver, "({{< relref \"/" pp); print }
            ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

          # rsync version content INTO parent (replaces latest-stub product content)
          rsync -a --delete-after "$VPARENT/$VERSION/" "$VPARENT/"

          # Restore parent linkTitle to product label
          sed -i "s/^linkTitle: $VERSION$/linkTitle: $PRODUCT_LABEL/" \
            "$VPARENT/_index.md" || true

          # Update nav-selector button label from "latest" to "v<version>"
          sed -i "s/id=\"versionSelector${PRODUCT_PASCAL}Value\" class=\"version-selector-control\">latest/id=\"versionSelector${PRODUCT_PASCAL}Value\" class=\"version-selector-control\">v${VERSION}/" \
            layouts/partials/docs-nav.html

          # Inject Edit-on-GitHub path rewrite
          PP_ESC="${PRODUCT//\//\\/}"
          sed -i "12i \\{{ \$gh_path = replaceRE \`^${PP_ESC}/\` \"${PP_ESC}/${VERSION}/\" \$gh_path }}" \
            layouts/partials/meta-links.html

          hugo --logLevel info -d output

          # Verify Hugo produced the expected version subtree
          if [ ! -d "output/$PRODUCT/$VERSION" ]; then
            echo "!!! ERROR: hugo did not produce output/$PRODUCT/$VERSION" >&2
            exit 1
          fi

      # Stage only the version subtree + css/scss for upload (smaller artifact)
      - name: Stage output as artifact
        working-directory: site
        env:
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage
          mkdir -p "/tmp/stage/output/$PRODUCT"
          cp -a "output/$PRODUCT/$VERSION" "/tmp/stage/output/$PRODUCT/$VERSION"
          for d in css scss; do
            [ -d "output/$d" ] && cp -a "output/$d" "/tmp/stage/output/$d"
          done
          tar -czf /tmp/out.tar.gz -C /tmp/stage output

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: /tmp/out.tar.gz
          retention-days: 1
          compression-level: 0

  # =========================================================================
  # Phase 3: assemble — merge all per-build outputs, ndjson, gzip
  # =========================================================================
  assemble:
    name: 3. Assemble & gzip
    needs: [setup, build_latest, build_versions]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get install -y --no-install-recommends rsync python3-venv

      - name: Setup Python venv for ndjson
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/builds
          pattern: build-*

      - name: Merge artifacts into final public/
        run: |
          set -euo pipefail
          mkdir -p public

          # 1. Latest establishes the base tree
          mkdir -p /tmp/extract-latest
          tar -xzf /tmp/builds/build-latest/out.tar.gz -C /tmp/extract-latest
          cp -a /tmp/extract-latest/output/. ./public/

          # 2. Each version overlays its subtree + adds CSS/SCSS additively.
          # rm -rf the dest before cp -a to prevent alias-induced nesting
          # (latest may emit redirect HTMLs inside version paths via aliases).
          for art_dir in /tmp/builds/build-*; do
            name=$(basename "$art_dir" | sed 's/^build-//')
            [ "$name" = "latest" ] && continue
            rm -rf /tmp/extract
            mkdir -p /tmp/extract
            tar -xzf "$art_dir/out.tar.gz" -C /tmp/extract

            # Find version subtrees (depth 3 = operate/X/Y.Z, depth 4 = develop/ai/X/Y.Z)
            while IFS= read -r vdir; do
              relpath=${vdir#/tmp/extract/output/}
              rm -rf "./public/$relpath"
              mkdir -p "$(dirname "./public/$relpath")"
              cp -a "$vdir" "./public/$relpath"
            done < <(find /tmp/extract/output -mindepth 3 -maxdepth 4 -type d \
              -regextype posix-extended -regex ".*/[0-9]+\.[0-9]+(\.[0-9]+)?$")

            # Additive css/scss
            for d in css scss; do
              if [ -d "/tmp/extract/output/$d" ]; then
                mkdir -p "./public/$d"
                cp -an "/tmp/extract/output/$d/." "./public/$d/" || true
              fi
            done
          done

      - name: Generate ndjson
        run: |
          /tmp/venv/bin/python3 build/generate_ndjson.py
          gzip -kf public/docs.ndjson

      - name: Pre-compress static assets (skip .json/.md — sub_filter at runtime)
        run: |
          find public -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.xml" -o -name "*.svg" -o -name "*.txt" \) \
            -exec gzip -9 -k {} \;

      - name: Tar public/
        run: |
          tar -czf /tmp/public.tar.gz public
          ls -lh /tmp/public.tar.gz
          echo "Files: $(find public -type f | wc -l)"

      - uses: actions/upload-artifact@v4
        with:
          name: public
          path: /tmp/public.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Append progress
        run: |
          echo "- ✅ Stage 3: Assembled $(find public -type f | wc -l) files ($(du -sh public | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Phase 4: docker — build minimal nginx images, push to DockerHub
  # =========================================================================
  docker:
    name: 4. Build & push images
    needs: [setup, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dockerfile.runtime
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: public
          path: /tmp/

      - name: Extract public/ into build context
        run: |
          tar -xzf /tmp/public.tar.gz -C .
          ls -lh public/ | head -5

      - name: Set up QEMU
        if: inputs.platforms != 'amd64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push privileged
        id: push_priv
        if: inputs.variant != 'unprivileged'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runtime
          platforms: ${{ needs.setup.outputs.platforms }}
          target: final
          build-args: |
            VARIANT=privileged
            GIT_COMMIT=${{ needs.setup.outputs.hash }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: ${{ needs.setup.outputs.priv_tags }}
          push: true

      - name: Build & push unprivileged
        id: push_unpriv
        if: inputs.variant != 'privileged'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runtime
          platforms: ${{ needs.setup.outputs.platforms }}
          target: final
          build-args: |
            VARIANT=unprivileged
            GIT_COMMIT=${{ needs.setup.outputs.hash }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: ${{ needs.setup.outputs.unpriv_tags }}
          push: true

      - name: Write final summary
        if: always()
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_OVERRIDE: ${{ inputs.tag_override }}
          STATUS: ${{ job.status }}
          PRIV_TAGS: ${{ needs.setup.outputs.priv_tags }}
          UNPRIV_TAGS: ${{ needs.setup.outputs.unpriv_tags }}
          PRIV_OUTCOME: ${{ steps.push_priv.outcome }}
          UNPRIV_OUTCOME: ${{ steps.push_unpriv.outcome }}
        run: |
          set -euo pipefail
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              *)       echo "❓" ;;
            esac
          }
          {
            echo ""
            echo "## Result: \`$STATUS\`"
            echo ""
            echo "| Variant | Outcome |"
            echo "|---------|---------|"
            echo "| privileged | $(icon "${PRIV_OUTCOME:-skipped}") $PRIV_OUTCOME |"
            echo "| unprivileged | $(icon "${UNPRIV_OUTCOME:-skipped}") $UNPRIV_OUTCOME |"
            echo ""

            if [ "$STATUS" != "success" ]; then
              echo "Build did not complete — see step logs above."
              exit 0
            fi

            echo "### Pull commands"
            if [ "$PRIV_OUTCOME" = "success" ]; then
              echo "**Privileged (port 80):**"
              echo '```bash'
              while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                echo "docker pull $tag"
              done <<< "$PRIV_TAGS"
              echo '```'
            fi
            if [ "$UNPRIV_OUTCOME" = "success" ]; then
              echo "**Unprivileged (port 8080):**"
              echo '```bash'
              while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                echo "docker pull $tag"
              done <<< "$UNPRIV_TAGS"
              echo '```'
            fi

            echo ""
            echo "### Quick run"
            echo '```bash'
            if [ "$UNPRIV_OUTCOME" = "success" ]; then
              FIRST=$(printf '%s\n' "$UNPRIV_TAGS" | head -n1)
              echo "docker run --rm -p 8080:8080 $FIRST"
              echo "# open http://localhost:8080"
            elif [ "$PRIV_OUTCOME" = "success" ]; then
              FIRST=$(printf '%s\n' "$PRIV_TAGS" | head -n1)
              echo "docker run --rm -p 80:80 $FIRST"
              echo "# open http://localhost"
            fi
            echo '```'

            if [ -n "$INPUT_OVERRIDE" ]; then
              echo ""
              echo "### Cleanup (test build with tag_override=\`$INPUT_OVERRIDE\`)"
              echo "Delete these tags from DockerHub when done:"
              echo '```'
              [ "$PRIV_OUTCOME" = "success" ] && printf '%s\n' "$PRIV_TAGS"
              [ "$UNPRIV_OUTCOME" = "success" ] && printf '%s\n' "$UNPRIV_TAGS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
