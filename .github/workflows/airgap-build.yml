name: Airgap Build & Push

# Matrix-based parallel build:
#   setup    → install deps, fetch components, snapshot workspace, discover versions
#   build    → matrix of N+1 jobs (latest + each version), each does ONE hugo run
#   assemble → download all artifacts, merge into single public/, gzip
#   docker   → 2 conditional steps (priv/unpriv), build minimal nginx image, push

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which variant(s) to build
        type: choice
        options:
          - both
          - privileged
          - unprivileged
        default: both
      platforms:
        description: Which platform(s) to build (for the final nginx image)
        type: choice
        options:
          - both
          - amd64
          - arm64
        default: both
      tag_override:
        description: >-
          Custom tag for testing (e.g. "test1"). When set, replaces the
          auto HASH-based tag and SKIPS the rolling :latest / :unprivileged
          tags so you can safely delete it later. Leave empty for normal builds.
        type: string
        default: ''

env:
  REPO: a0533057932/redis-docs
  HUGO_VERSION: 0.143.1

jobs:
  # =========================================================================
  # Phase 1: setup — prepare workspace, discover versions, emit build matrix
  # =========================================================================
  setup:
    name: 1. Setup workspace
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      hash: ${{ steps.meta.outputs.hash }}
      platforms: ${{ steps.meta.outputs.platforms }}
      priv_tags: ${{ steps.meta.outputs.priv_tags }}
      unpriv_tags: ${{ steps.meta.outputs.unpriv_tags }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute build params
        id: meta
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_OVERRIDE: ${{ inputs.tag_override }}
        run: |
          set -euo pipefail
          HASH=$(git rev-parse --short=9 HEAD)
          case "$INPUT_PLATFORMS" in
            both)  PLATFORMS=linux/amd64,linux/arm64 ;;
            amd64) PLATFORMS=linux/amd64 ;;
            arm64) PLATFORMS=linux/arm64 ;;
            *) echo "Bad platforms: $INPUT_PLATFORMS" >&2; exit 1 ;;
          esac
          {
            echo "hash=$HASH"
            echo "platforms=$PLATFORMS"
            echo "priv_tags<<EOF"
            if [ -n "$INPUT_OVERRIDE" ]; then
              echo "$REPO:$INPUT_OVERRIDE"
            else
              echo "$REPO:$HASH"
              echo "$REPO:latest"
            fi
            echo "EOF"
            echo "unpriv_tags<<EOF"
            if [ -n "$INPUT_OVERRIDE" ]; then
              echo "$REPO:$INPUT_OVERRIDE-unprivileged"
            else
              echo "$REPO:$HASH-unprivileged"
              echo "$REPO:unprivileged"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Hugo
        run: |
          wget -qO /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-venv rsync gawk jq

      - name: Setup Python venv + install deps
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -r requirements.txt

      - name: Setup Node deps
        run: npm install --no-audit --no-fund

      - name: Fetch external components
        env:
          PRIVATE_ACCESS_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
        run: |
          export PATH="/tmp/venv/bin:$PATH"
          make components

      - name: Apply airgap source patches (pre-snapshot)
        run: |
          set -euo pipefail
          # 1. Relax version-selector regex so dropdown appears under any baseURL
          python3 <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("layouts/partials/scripts.html")
          text = p.read_text()
          text, n_op  = re.subn(r"new RegExp\('/docs/\(latest\|staging\\/\.\+\)/operate/(\w+)/\.\*'\)",
                                r"new RegExp('/operate/\1/')", text)
          text, n_dev = re.subn(r"new RegExp\('/docs/\(latest\|staging\\/\.\+\)/develop/ai/(\w+)/\.\*'\)",
                                r"new RegExp('/develop/ai/\1/')", text)
          p.write_text(text)
          assert n_op + n_dev == 3, f"expected 3 regex relaxations, got {n_op + n_dev}"
          print(f"airgap: relaxed {n_op + n_dev} version-selector regex(es)")
          PYEOF
          # 2. Strip hardcoded redis.io/docs/latest from content/*.md
          find content -type f -name '*.md' -print0 | xargs -0 sed -i \
            -e 's|https://redis.io/docs/latest/|/|g' \
            -e 's|redis\.io/docs/latest/|/|g'
          # 3. baseURL and Hugo per-partial timeout
          sed -i 's#baseURL = "https://redis.io"#baseURL = "/"#g' config.toml
          sed -i 's/timeout="75"/timeout="600"/' config.toml

      - name: Discover versions & emit matrix JSON
        id: matrix
        run: |
          set -euo pipefail
          discover() {
            local d=$1
            if [ -d "$d" ]; then
              ls -1 "$d" | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || true
            fi
          }
          K8S=$(discover content/operate/kubernetes)
          RS=$(discover content/operate/rs)
          REDISVL=$(discover content/develop/ai/redisvl)

          # Write version lists into workspace (consumed by templates)
          echo "$K8S"     > kubernetes-versions
          echo "$RS"      > rs-versions
          echo "$REDISVL" > redisvl-versions
          : > rdi-versions

          # Emit JSON matrix: 1 latest + N versions
          {
            echo '['
            echo '{"kind":"latest","name":"latest","product":"","version":"","product_label":"","product_pascal":""}'
            for v in $K8S; do
              echo ",{\"kind\":\"version\",\"name\":\"k8s-$v\",\"product\":\"operate/kubernetes\",\"version\":\"$v\",\"product_label\":\"Redis for Kubernetes\",\"product_pascal\":\"Kubernetes\"}"
            done
            for v in $RS; do
              echo ",{\"kind\":\"version\",\"name\":\"rs-$v\",\"product\":\"operate/rs\",\"version\":\"$v\",\"product_label\":\"Redis Software\",\"product_pascal\":\"Rs\"}"
            done
            for v in $REDISVL; do
              echo ",{\"kind\":\"version\",\"name\":\"redisvl-$v\",\"product\":\"develop/ai/redisvl\",\"version\":\"$v\",\"product_label\":\"RedisVL\",\"product_pascal\":\"Redisvl\"}"
            done
            echo ']'
          } | jq -c . > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "Matrix entries: $(jq 'length' matrix.json)"
          jq -r '.[] | "  - \(.name)"' matrix.json

      - name: Tar workspace (with node_modules + venv for matrix runners)
        run: |
          set -euo pipefail
          cp -a /tmp/venv ./venv
          tar --exclude=.git --exclude=public --exclude=resources \
              --exclude=.hugo_build.lock --exclude=PRIVATE_ACCESS_TOKEN \
              --exclude=.github --exclude=helm \
              -czf /tmp/workspace.tar.gz .
          ls -lh /tmp/workspace.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: /tmp/workspace.tar.gz
          retention-days: 1
          compression-level: 0  # already gzipped

      - name: Write build plan
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_OVERRIDE: ${{ inputs.tag_override }}
          HASH: ${{ steps.meta.outputs.hash }}
          PLATFORMS: ${{ steps.meta.outputs.platforms }}
          PRIV_TAGS: ${{ steps.meta.outputs.priv_tags }}
          UNPRIV_TAGS: ${{ steps.meta.outputs.unpriv_tags }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OVERRIDE_DISPLAY="${INPUT_OVERRIDE:-(none — auto HASH + rolling tags)}"
          MATRIX_COUNT=$(jq 'length' matrix.json)
          {
            echo "## Build plan"
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Commit | \`$HASH\` |"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Variant | \`$INPUT_VARIANT\` |"
            echo "| Platforms | \`$PLATFORMS\` |"
            echo "| Tag override | \`$OVERRIDE_DISPLAY\` |"
            echo "| Matrix size | ${MATRIX_COUNT} parallel Hugo builds |"
            echo ""
            if [ "$INPUT_VARIANT" != "unprivileged" ]; then
              echo "### Privileged tags"
              echo '```'
              echo "$PRIV_TAGS"
              echo '```'
            fi
            if [ "$INPUT_VARIANT" != "privileged" ]; then
              echo "### Unprivileged tags"
              echo '```'
              echo "$UNPRIV_TAGS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Phase 2: build matrix — one runner per (kind, product, version)
  # =========================================================================
  build:
    name: "2. Build ${{ matrix.name }}"
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Install Hugo
        run: |
          wget -qO /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - name: Install system deps
        run: |
          sudo apt-get install -y --no-install-recommends rsync gawk

      - uses: actions/download-artifact@v4
        with:
          name: workspace
          path: /tmp/

      - name: Extract workspace
        run: |
          sudo mkdir -p /site
          sudo chown "$USER" /site
          tar -xzf /tmp/workspace.tar.gz -C /site

      - name: Build (latest or per-version)
        working-directory: /site
        env:
          KIND: ${{ matrix.kind }}
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ matrix.version }}
          PRODUCT_LABEL: ${{ matrix.product_label }}
          PRODUCT_PASCAL: ${{ matrix.product_pascal }}
        run: |
          set -euo pipefail
          export PATH="/site/venv/bin:$PATH"

          if [ "$KIND" = "latest" ]; then
            echo ">>> Building latest (removing all version dirs)"
            # Find any X.Y or X.Y.Z dirs under known version-bearing paths and remove
            for parent in content/operate/kubernetes content/operate/rs content/develop/ai/redisvl; do
              [ -d "$parent" ] || continue
              find "$parent" -mindepth 1 -maxdepth 1 -type d -regextype posix-extended -regex ".*/[0-9]+\.[0-9]+(\.[0-9]+)?$" -exec rm -rf {} +
            done
          else
            echo ">>> Building $PRODUCT v$VERSION"
            # Remove all OTHER versions of this product
            VPARENT="content/$PRODUCT"
            find "$VPARENT" -mindepth 1 -maxdepth 1 -type d -regextype posix-extended -regex ".*/[0-9]+\.[0-9]+(\.[0-9]+)?$" \
              | while read -r d; do
                  case "$d" in
                    "$VPARENT/$VERSION") ;;
                    *) rm -rf "$d" ;;
                  esac
                done

            # Strip the version prefix from relrefs in the version's own content
            find "$VPARENT/$VERSION" -type f -name '*.md' | while read -r f; do
              awk -v pp="$PRODUCT" -v ver="$VERSION" '
                { gsub("\\(\\{\\{< ?relref \"/" pp "/" ver, "({{< relref \"/" pp); print }
              ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            done

            # rsync version content INTO parent, replacing the latest-stub product content
            rsync -a --delete-after "$VPARENT/$VERSION/" "$VPARENT/"

            # Restore parent linkTitle to product label (rsync brought in "X.Y.Z")
            sed -i "s/^linkTitle: $VERSION$/linkTitle: $PRODUCT_LABEL/" \
              "$VPARENT/_index.md" || true

            # Update nav-selector button label from "latest" to "v<version>"
            sed -i "s/id=\"versionSelector${PRODUCT_PASCAL}Value\" class=\"version-selector-control\">latest/id=\"versionSelector${PRODUCT_PASCAL}Value\" class=\"version-selector-control\">v${VERSION}/" \
              layouts/partials/docs-nav.html

            # Inject Edit-on-GitHub path rewrite (sed 12i)
            PP_ESC="${PRODUCT//\//\\/}"
            sed -i "12i \\{{ \$gh_path = replaceRE \`^${PP_ESC}/\` \"${PP_ESC}/${VERSION}/\" \$gh_path }}" \
              layouts/partials/meta-links.html
          fi

          hugo --logLevel info

      - name: Stage output for upload
        working-directory: /site
        env:
          KIND: ${{ matrix.kind }}
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          if [ "$KIND" = "latest" ]; then
            # Latest: ship the entire public/ tree
            cp -a public /tmp/out/public
          else
            # Version: ship only the version subtree + css/scss (additive merge in assemble)
            mkdir -p "/tmp/out/public/$PRODUCT"
            if [ ! -d "public/$PRODUCT/$VERSION" ]; then
              echo "!!! ERROR: hugo did not produce public/$PRODUCT/$VERSION" >&2
              exit 1
            fi
            cp -a "public/$PRODUCT/$VERSION" "/tmp/out/public/$PRODUCT/$VERSION"
            for d in css scss; do
              [ -d "public/$d" ] && cp -a "public/$d" "/tmp/out/public/$d"
            done
          fi
          tar -czf /tmp/out.tar.gz -C /tmp/out public

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: /tmp/out.tar.gz
          retention-days: 1
          compression-level: 0

  # =========================================================================
  # Phase 3: assemble — merge all per-version outputs into a single public/
  # =========================================================================
  assemble:
    name: 3. Assemble & gzip
    needs: [setup, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      hash: ${{ needs.setup.outputs.hash }}
    steps:
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rsync python3-venv

      - uses: actions/checkout@v4

      - name: Setup Python venv (for ndjson)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/builds
          pattern: build-*

      - name: Merge artifacts into final public/
        run: |
          set -euo pipefail
          mkdir -p public

          # 1. Latest first — establishes the base tree
          mkdir -p /tmp/extract-latest
          tar -xzf /tmp/builds/build-latest/out.tar.gz -C /tmp/extract-latest
          cp -a /tmp/extract-latest/public/. ./public/

          # 2. Versions on top. Each artifact contains public/<product>/<version>/ plus public/css and public/scss.
          for art_dir in /tmp/builds/build-*; do
            name=$(basename "$art_dir" | sed 's/^build-//')
            [ "$name" = "latest" ] && continue
            artifact="$art_dir/out.tar.gz"
            rm -rf /tmp/extract
            mkdir -p /tmp/extract
            tar -xzf "$artifact" -C /tmp/extract

            # Replace version subtrees (avoids alias-induced nesting from latest)
            while IFS= read -r vdir; do
              relpath=${vdir#/tmp/extract/public/}
              rm -rf "./public/$relpath"
              mkdir -p "$(dirname "./public/$relpath")"
              cp -a "$vdir" "./public/$relpath"
            done < <(find /tmp/extract/public -mindepth 3 -maxdepth 4 -type d -regextype posix-extended -regex ".*/[0-9]+\.[0-9]+(\.[0-9]+)?$")

            # Additively merge css/scss (per-version hashes coexist)
            for d in css scss; do
              if [ -d "/tmp/extract/public/$d" ]; then
                mkdir -p "./public/$d"
                cp -an "/tmp/extract/public/$d/." "./public/$d/" || true
              fi
            done
          done

      - name: Generate ndjson
        run: |
          /tmp/venv/bin/python3 build/generate_ndjson.py
          gzip -kf public/docs.ndjson

      - name: Pre-compress static assets (skipping .json/.md — sub_filter at runtime)
        run: |
          find public -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.xml" -o -name "*.svg" -o -name "*.txt" \) \
            -exec gzip -9 -k {} \;

      - name: Tar public/
        run: |
          tar -czf /tmp/public.tar.gz public
          ls -lh /tmp/public.tar.gz
          echo "Files: $(find public -type f | wc -l)"

      - uses: actions/upload-artifact@v4
        with:
          name: public
          path: /tmp/public.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Append assemble summary
        run: |
          echo "- ✅ Assembled $(find public -type f | wc -l) files into public/ ($(du -sh public | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Phase 4: docker — build minimal nginx images, push to DockerHub
  # =========================================================================
  docker:
    name: 4. Build & push images
    needs: [setup, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Dockerfile.runtime
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: public
          path: /tmp/

      - name: Extract public/ into build context
        run: |
          tar -xzf /tmp/public.tar.gz -C .
          ls -lh public/ | head -5

      - name: Set up QEMU
        if: inputs.platforms != 'amd64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push privileged
        id: push_priv
        if: inputs.variant != 'unprivileged'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runtime
          platforms: ${{ needs.setup.outputs.platforms }}
          target: final
          build-args: |
            VARIANT=privileged
            GIT_COMMIT=${{ needs.setup.outputs.hash }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: ${{ needs.setup.outputs.priv_tags }}
          push: true

      - name: Build & push unprivileged
        id: push_unpriv
        if: inputs.variant != 'privileged'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runtime
          platforms: ${{ needs.setup.outputs.platforms }}
          target: final
          build-args: |
            VARIANT=unprivileged
            GIT_COMMIT=${{ needs.setup.outputs.hash }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: ${{ needs.setup.outputs.unpriv_tags }}
          push: true

      - name: Write final summary
        if: always()
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_OVERRIDE: ${{ inputs.tag_override }}
          STATUS: ${{ job.status }}
          PRIV_TAGS: ${{ needs.setup.outputs.priv_tags }}
          UNPRIV_TAGS: ${{ needs.setup.outputs.unpriv_tags }}
          PRIV_OUTCOME: ${{ steps.push_priv.outcome }}
          UNPRIV_OUTCOME: ${{ steps.push_unpriv.outcome }}
        run: |
          set -euo pipefail
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              *)       echo "❓" ;;
            esac
          }
          {
            echo ""
            echo "## Result: \`$STATUS\`"
            echo ""
            echo "| Variant | Outcome |"
            echo "|---------|---------|"
            echo "| privileged | $(icon "${PRIV_OUTCOME:-skipped}") $PRIV_OUTCOME |"
            echo "| unprivileged | $(icon "${UNPRIV_OUTCOME:-skipped}") $UNPRIV_OUTCOME |"
            echo ""

            if [ "$STATUS" != "success" ]; then
              echo "Build did not complete successfully — see step logs above."
              exit 0
            fi

            echo "### Pull commands"
            if [ "$PRIV_OUTCOME" = "success" ]; then
              echo "**Privileged (port 80):**"
              echo '```bash'
              while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                echo "docker pull $tag"
              done <<< "$PRIV_TAGS"
              echo '```'
            fi
            if [ "$UNPRIV_OUTCOME" = "success" ]; then
              echo "**Unprivileged (port 8080):**"
              echo '```bash'
              while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                echo "docker pull $tag"
              done <<< "$UNPRIV_TAGS"
              echo '```'
            fi

            echo ""
            echo "### Quick run"
            echo '```bash'
            if [ "$UNPRIV_OUTCOME" = "success" ]; then
              FIRST=$(printf '%s\n' "$UNPRIV_TAGS" | head -n1)
              echo "docker run --rm -p 8080:8080 $FIRST"
              echo "# open http://localhost:8080"
            elif [ "$PRIV_OUTCOME" = "success" ]; then
              FIRST=$(printf '%s\n' "$PRIV_TAGS" | head -n1)
              echo "docker run --rm -p 80:80 $FIRST"
              echo "# open http://localhost"
            fi
            echo '```'

            if [ -n "$INPUT_OVERRIDE" ]; then
              echo ""
              echo "### Cleanup (test build with tag_override=\`$INPUT_OVERRIDE\`)"
              echo "Delete these tags from DockerHub when done:"
              echo '```'
              [ "$PRIV_OUTCOME" = "success" ] && printf '%s\n' "$PRIV_TAGS"
              [ "$UNPRIV_OUTCOME" = "success" ] && printf '%s\n' "$UNPRIV_TAGS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
