name: Airgap Build & Push

# Cloud equivalent of the local Dockerfile + airgap-multibuild.sh pipeline.
# Each runner does its own fresh checkout (no workspace tar shuffling), like
# upstream redis/docs main.yml. Caches and invalidation are keyed only on
# files that actually affect Hugo's output — fork-only files (Dockerfile,
# helm/, BUILD.md, airgap-multibuild.sh) do not enter any cache key.
#
# Phases:
#   1. setup           discover versions, emit matrix JSON, compute meta
#   2a. build_latest   one Hugo run with all version dirs removed
#   2b. build_versions matrix of N jobs (one per <product, version>)
#   3. assemble        merge per-build artifacts, ndjson, gzip
#   4. docker          minimal nginx image, push to DockerHub
#   4b. cli_image      CLI proxy image, built and pushed only when
#                      helm/cli-proxy changed (runs beside phases 1-4)
#   4c. tests          the fork's own test suites (same)
#   4d. dockerhub_description  the image pages' text, release branch only
#   4e. mirror_drift   how far behind redis.io the mirrored sections are
#   4f. mirror_image   the mirrored sections as an image of their own
#   5. publish_chart   opt-in: bump and publish the Helm chart
#
# Dockerfile and airgap-multibuild.sh are unchanged — local builds still work.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which variant(s) to build
        type: choice
        options:
          - both
          - privileged
          - unprivileged
        default: both
      platforms:
        description: Which platform(s) to build (final nginx image)
        type: choice
        options:
          - both
          - amd64
          - arm64
        default: both
      tag_override:
        description: >-
          Custom tag for testing. When set, replaces the auto HASH-based tag
          and SKIPS the rolling :latest / :unprivileged tags. Leave empty for
          normal builds.
        type: string
        default: ''
      publish_chart:
        description: >-
          After the image push, also auto-bump the Helm chart patch version,
          commit the update back to this branch, and publish the chart as an
          OCI artifact. Skipped automatically on partial builds and override
          tags. For non-patch bumps build the chart manually per BUILD.md.
        type: boolean
        default: false

env:
  REPO: a0533057932/redis-docs
  CLI_REPO: a0533057932/redis-docs-cli
  HUGO_VERSION: 0.143.1

jobs:
  # =========================================================================
  # Phase 1: setup — discover versions, compute meta. No build work here.
  # =========================================================================
  setup:
    name: 1. Setup (discover versions)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      hash: ${{ steps.meta.outputs.hash }}
      platforms: ${{ steps.meta.outputs.platforms }}
      priv_tags: ${{ steps.meta.outputs.priv_tags }}
      unpriv_tags: ${{ steps.meta.outputs.unpriv_tags }}
      mirror_priv_tags: ${{ steps.meta.outputs.mirror_priv_tags }}
      mirror_unpriv_tags: ${{ steps.meta.outputs.mirror_unpriv_tags }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      k8s_versions: ${{ steps.matrix.outputs.k8s }}
      rs_versions: ${{ steps.matrix.outputs.rs }}
      redisvl_versions: ${{ steps.matrix.outputs.redisvl }}
      rdi_versions: ${{ steps.matrix.outputs.rdi }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Compute build params
        id: meta
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_OVERRIDE: ${{ inputs.tag_override }}
        run: |
          set -euo pipefail
          HASH=$(git rev-parse --short=9 HEAD)
          case "$INPUT_PLATFORMS" in
            both)  PLATFORMS=linux/amd64,linux/arm64 ;;
            amd64) PLATFORMS=linux/amd64 ;;
            arm64) PLATFORMS=linux/arm64 ;;
            *) echo "Bad platforms: $INPUT_PLATFORMS" >&2; exit 1 ;;
          esac
          {
            echo "hash=$HASH"
            echo "platforms=$PLATFORMS"
            echo "priv_tags<<EOF"
            if [ -n "$INPUT_OVERRIDE" ]; then
              echo "$REPO:$INPUT_OVERRIDE"
            else
              echo "$REPO:$HASH"
              echo "$REPO:latest"
            fi
            echo "EOF"
            echo "unpriv_tags<<EOF"
            if [ -n "$INPUT_OVERRIDE" ]; then
              echo "$REPO:$INPUT_OVERRIDE-unprivileged"
            else
              echo "$REPO:$HASH-unprivileged"
              echo "$REPO:unprivileged"
            fi
            echo "EOF"
            # The mirrored sections, in the same repository under their own
            # tags: same build, same commit, a different half of the tree.
            echo "mirror_priv_tags<<EOF"
            if [ -n "$INPUT_OVERRIDE" ]; then
              echo "$REPO:$INPUT_OVERRIDE-mirror"
            else
              echo "$REPO:$HASH-mirror"
              echo "$REPO:mirror"
            fi
            echo "EOF"
            echo "mirror_unpriv_tags<<EOF"
            if [ -n "$INPUT_OVERRIDE" ]; then
              echo "$REPO:$INPUT_OVERRIDE-mirror-unprivileged"
            else
              echo "$REPO:$HASH-mirror-unprivileged"
              echo "$REPO:mirror-unprivileged"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Discover versions and emit matrix JSON
        id: matrix
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends jq >/dev/null

          discover() {
            local d=$1
            if [ -d "$d" ]; then
              find "$d" -mindepth 1 -maxdepth 1 -type d -regextype posix-extended -regex ".*/[0-9]+\.[0-9]+(\.[0-9]+)?$" \
                | awk -F/ '{print $NF}' | sort
            fi
          }
          K8S=$(discover content/operate/kubernetes)
          RS=$(discover content/operate/rs)
          REDISVL=$(discover content/develop/ai/redisvl)
          RDI=$(discover content/integrate/redis-data-integration)

          # Output version lists as newline-separated for each runner to write locally
          {
            echo "k8s<<EOF"
            echo "$K8S"
            echo "EOF"
            echo "rs<<EOF"
            echo "$RS"
            echo "EOF"
            echo "redisvl<<EOF"
            echo "$REDISVL"
            echo "EOF"
            echo "rdi<<EOF"
            echo "$RDI"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # Emit matrix JSON (per-version build configs)
          {
            echo '['
            sep=''
            for v in $K8S; do
              echo "$sep{\"name\":\"k8s-$v\",\"product\":\"operate/kubernetes\",\"version\":\"$v\",\"product_label\":\"Redis for Kubernetes\",\"product_pascal\":\"Kubernetes\"}"
              sep=','
            done
            for v in $RS; do
              echo "$sep{\"name\":\"rs-$v\",\"product\":\"operate/rs\",\"version\":\"$v\",\"product_label\":\"Redis Software\",\"product_pascal\":\"Rs\"}"
              sep=','
            done
            for v in $REDISVL; do
              echo "$sep{\"name\":\"redisvl-$v\",\"product\":\"develop/ai/redisvl\",\"version\":\"$v\",\"product_label\":\"RedisVL\",\"product_pascal\":\"Redisvl\"}"
              sep=','
            done
            for v in $RDI; do
              echo "$sep{\"name\":\"rdi-$v\",\"product\":\"integrate/redis-data-integration\",\"version\":\"$v\",\"product_label\":\"Redis Data Integration\",\"product_pascal\":\"Redis-Data-Integration\"}"
              sep=','
            done
            echo ']'
          } | jq -c . > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "Matrix entries: $(jq 'length' matrix.json)"
          jq -r '.[] | "  - \(.name)"' matrix.json

      - name: Write build plan
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_OVERRIDE: ${{ inputs.tag_override }}
          HASH: ${{ steps.meta.outputs.hash }}
          PLATFORMS: ${{ steps.meta.outputs.platforms }}
          PRIV_TAGS: ${{ steps.meta.outputs.priv_tags }}
          UNPRIV_TAGS: ${{ steps.meta.outputs.unpriv_tags }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OVERRIDE_DISPLAY="${INPUT_OVERRIDE:-(none — auto HASH + rolling tags)}"
          COUNT=$(jq 'length' matrix.json)
          {
            echo "## Build plan"
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Commit | \`$HASH\` |"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Variant | \`$INPUT_VARIANT\` |"
            echo "| Platforms | \`$PLATFORMS\` |"
            echo "| Tag override | \`$OVERRIDE_DISPLAY\` |"
            echo "| Matrix size | $COUNT version builds + 1 latest |"
            echo ""
            if [ "$INPUT_VARIANT" != "unprivileged" ]; then
              echo "### Privileged tags"
              echo '```'
              echo "$PRIV_TAGS"
              echo '```'
            fi
            if [ "$INPUT_VARIANT" != "privileged" ]; then
              echo "### Unprivileged tags"
              echo '```'
              echo "$UNPRIV_TAGS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Reusable "build one Hugo target" via a shared composite — we inline the
  # logic in both build_latest and build_versions since GHA reusable workflows
  # add complexity. Each job below does its own checkout + cache restore +
  # Hugo invocation.
  # =========================================================================

  # =========================================================================
  # Phase 2a: build_latest
  # =========================================================================
  build_latest:
    name: 2a. Build latest
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0   # full history for Hugo's enableGitInfo

      - name: Install Hugo
        run: |
          wget -qO /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - name: Install system deps
        run: sudo apt-get install -y --no-install-recommends python3-venv rsync gawk

      - name: Restore node_modules
        id: cache-npm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: npm install (cache miss)
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - name: Restore python venv
        id: cache-pip
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ./venv
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: pip install (cache miss)
        if: steps.cache-pip.outputs.cache-hit != 'true'
        run: |
          python3 -m venv ./venv
          ./venv/bin/pip install --quiet -r requirements.txt

      # make components builds data/examples.json from the client repos named
      # in data/components/*.json, from local_examples/, and from the
      # clients-example blocks in content/, using the tooling in build/. The key
      # covers all of them but content/. Without local_examples/ in it, a PR
      # that only changed local examples restored an examples.json without its
      # new steps, and their tabs silently did not render: a missing example is
      # a warnf, so the build still passed. The client repos are cloned at their latest
      # release, which no hash here can see; a new release lands the next time
      # the key changes.
      - name: Restore examples + data/examples.json
        id: cache-examples
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            examples
            data/examples.json
          key: components-${{ runner.os }}-${{ hashFiles('Makefile', 'build/**', 'data/components/**', 'local_examples/**') }}

      - name: make components (cache miss)
        if: steps.cache-examples.outputs.cache-hit != 'true'
        env:
          PRIVATE_ACCESS_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
        run: |
          export PATH="$PWD/venv/bin:$PATH"
          make components

      # The markdown is the one input left out of the key: nearly every merge
      # touches content/, so keying on it would turn every run into a miss.
      # Its step is local and cheap, and it overwrites each example's
      # steps_commands rather than appending, so it reruns over the restored
      # file and the commands foldout follows the current pages.
      - name: Refresh example CLI commands from markdown (cache hit)
        if: steps.cache-examples.outputs.cache-hit == 'true'
        run: |
          export PATH="$PWD/venv/bin:$PATH"
          python3 build/enrich_examples_from_markdown.py

      - name: Write version-files
        env:
          K8S: ${{ needs.setup.outputs.k8s_versions }}
          RS: ${{ needs.setup.outputs.rs_versions }}
          REDISVL: ${{ needs.setup.outputs.redisvl_versions }}
          RDI: ${{ needs.setup.outputs.rdi_versions }}
        run: |
          printf '%s\n' "$K8S"     > kubernetes-versions
          printf '%s\n' "$RS"      > rs-versions
          printf '%s\n' "$REDISVL" > redisvl-versions
          printf '%s\n' "$RDI"     > rdi-versions

      - name: Apply airgap pre-snapshot patches
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("layouts/partials/scripts.html")
          text = p.read_text()
          text, n_op  = re.subn(r"new RegExp\('/docs/\(latest\|staging\\/\.\+\)/operate/(\w+)/\.\*'\)",
                                r"new RegExp('/operate/\1/')", text)
          text, n_dev = re.subn(r"new RegExp\('/docs/\(latest\|staging\\/\.\+\)/develop/ai/(\w+)/\.\*'\)",
                                r"new RegExp('/develop/ai/\1/')", text)
          text, n_int = re.subn(r"new RegExp\('/docs/\(latest\|staging\\/\.\+\)/integrate/([\w-]+)/\.\*'\)",
                                r"new RegExp('/integrate/\1/')", text)
          p.write_text(text)
          assert n_op + n_dev + n_int == 4, f"expected 4 regex relaxations, got {n_op + n_dev + n_int}"
          PYEOF
          find content -type f -name '*.md' -print0 | xargs -0 sed -i \
            -e 's|https://redis.io/docs/latest/|/|g' \
            -e 's|redis\.io/docs/latest/|/|g'
          # Point the documentation's blog links at the mirrored blog in this
          # image (content/blog, written by build/site_mirror). Mirrors the
          # same step in airgap-multibuild.sh. Four domains, not one: of the
          # 184 blog links, 83 use the legacy redis.com and 16 use
          # redislabs.com.
          find content -type f -name '*.md' -print0 | xargs -0 sed -i -E \
            -e 's#https?://(www\.)?(redis\.io|redis\.com|redislabs\.com)(/en)?/blog#/blog#g' \
            -e 's#https?://(www\.)?redis\.io/(tutorials|glossary|compare|solutions|customers|technology|resources/architecture-diagrams)#/\2#g'
          # Short-form command links: the docs link commands both as
          # redis.io/docs/latest/commands/<x> (handled above) and as
          # redis.io/commands/<x>, which that rule does not touch -- 435 links
          # to pages already in this image. Lowercased because some are written
          # in capitals while Hugo publishes them lowercase. Mirrors the same
          # step in airgap-multibuild.sh.
          find content -type f -name '*.md' -print0 | xargs -0 sed -i -E \
            -e 's#https?://(www\.)?redis\.io/commands/([A-Za-z0-9_.-]+)/?#/commands/\L\2/#g' \
            -e 's#https?://(www\.)?redis\.io/commands/?#/commands/#g'
          # The links no rule can straighten out: legacy documentation paths
          # (/docs/<old structure>/, /topics/<page>) that moved twice, where
          # only redis.io knows the target. build/site_mirror/doc_links.json
          # records where each lands, observed once with the internet and
          # committed, so this needs no network. Inside mirrored pages a
          # leftover redis.io link becomes the words it was written as.
          # Mirrors the same step in airgap-multibuild.sh.
          python3 -m build.site_mirror.doc_links
          sed -i 's#baseURL = "https://redis.io"#baseURL = "/"#g' config.toml
          sed -i 's/timeout="75"/timeout="600"/' config.toml

      # Cache key for latest: hash all Hugo-relevant files EXCEPT version dirs.
      # Excludes fork-only files (helm/, Dockerfile, BUILD.md, .github/ except
      # this workflow file). Hugo-only inputs invalidate the cache.
      - name: Compute cache key
        id: key
        run: |
          set -euo pipefail
          {
            find content -type f \
              ! -regex '.*/content/operate/kubernetes/[0-9]+\.[0-9]+\(\.[0-9]+\)?/.*' \
              ! -regex '.*/content/operate/rs/[0-9]+\.[0-9]+\(\.[0-9]+\)?/.*' \
              ! -regex '.*/content/develop/ai/redisvl/[0-9]+\.[0-9]+\(\.[0-9]+\)?/.*' \
              ! -regex '.*/content/integrate/redis-data-integration/[0-9]+\.[0-9]+\(\.[0-9]+\)?/.*' \
              -print0 | sort -z | xargs -0 sha256sum
            for d in layouts assets data static i18n; do
              [ -d "$d" ] && find "$d" -type f -print0 | sort -z | xargs -0 sha256sum
            done
            for f in config.toml postcss.config.js tailwind.config.js package-lock.json; do
              [ -f "$f" ] && sha256sum "$f"
            done
            cat kubernetes-versions rs-versions redisvl-versions rdi-versions
            sha256sum .github/workflows/airgap-build.yml
          } | sha256sum | awk '{print $1}' | cut -c1-16 > /tmp/key
          echo "key=$(cat /tmp/key)" >> "$GITHUB_OUTPUT"

      - name: Restore Hugo output cache
        id: cache-hugo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: output
          key: hugo-latest-${{ steps.key.outputs.key }}

      - name: Build latest (cache miss)
        if: steps.cache-hugo.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export PATH="$PWD/venv/bin:$PATH"
          # Latest = site with ALL version dirs removed
          for parent in content/operate/kubernetes content/operate/rs content/develop/ai/redisvl content/integrate/redis-data-integration; do
            [ -d "$parent" ] || continue
            find "$parent" -mindepth 1 -maxdepth 1 -type d -regextype posix-extended \
              -regex ".*/[0-9]+\.[0-9]+(\.[0-9]+)?$" -exec rm -rf {} +
          done
          # Dates the redirect map's entries from git history (DOC-6951), same as
          # upstream's `make hugo` -> `page_moves` prereq. Run directly, matching
          # how the other build/*.py scripts here are called outside make. This
          # job already checks out with fetch-depth: 0 above (for enableGitInfo),
          # so the full history this script needs is already present.
          python3 build/generate_page_moves.py
          hugo --logLevel info -d output

      - name: Stage output as artifact
        run: tar -czf /tmp/out.tar.gz output

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-latest
          path: /tmp/out.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Append progress
        env:
          HIT: ${{ steps.cache-hugo.outputs.cache-hit }}
        run: |
          if [ "$HIT" = "true" ]; then
            echo "- ✅ Stage 2a: latest (cache HIT)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ✅ Stage 2a: latest (built fresh)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # =========================================================================
  # Phase 2b: build_versions — matrix of N parallel jobs, one per version.
  # =========================================================================
  build_versions:
    name: "2b. Build ${{ matrix.name }}"
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -qO /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - name: Install system deps
        run: sudo apt-get install -y --no-install-recommends python3-venv rsync gawk

      - name: Restore node_modules
        id: cache-npm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: npm install (cache miss)
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - name: Restore python venv
        id: cache-pip
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ./venv
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: pip install (cache miss)
        if: steps.cache-pip.outputs.cache-hit != 'true'
        run: |
          python3 -m venv ./venv
          ./venv/bin/pip install --quiet -r requirements.txt

      # make components builds data/examples.json from the client repos named
      # in data/components/*.json, from local_examples/, and from the
      # clients-example blocks in content/, using the tooling in build/. The key
      # covers all of them but content/. Without local_examples/ in it, a PR
      # that only changed local examples restored an examples.json without its
      # new steps, and their tabs silently did not render: a missing example is
      # a warnf, so the build still passed. The client repos are cloned at their latest
      # release, which no hash here can see; a new release lands the next time
      # the key changes.
      - name: Restore examples + data/examples.json
        id: cache-examples
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            examples
            data/examples.json
          key: components-${{ runner.os }}-${{ hashFiles('Makefile', 'build/**', 'data/components/**', 'local_examples/**') }}

      - name: make components (cache miss)
        if: steps.cache-examples.outputs.cache-hit != 'true'
        env:
          PRIVATE_ACCESS_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}
        run: |
          export PATH="$PWD/venv/bin:$PATH"
          make components

      # The markdown is the one input left out of the key: nearly every merge
      # touches content/, so keying on it would turn every run into a miss.
      # Its step is local and cheap, and it overwrites each example's
      # steps_commands rather than appending, so it reruns over the restored
      # file and the commands foldout follows the current pages.
      - name: Refresh example CLI commands from markdown (cache hit)
        if: steps.cache-examples.outputs.cache-hit == 'true'
        run: |
          export PATH="$PWD/venv/bin:$PATH"
          python3 build/enrich_examples_from_markdown.py

      - name: Write version-files
        env:
          K8S: ${{ needs.setup.outputs.k8s_versions }}
          RS: ${{ needs.setup.outputs.rs_versions }}
          REDISVL: ${{ needs.setup.outputs.redisvl_versions }}
          RDI: ${{ needs.setup.outputs.rdi_versions }}
        run: |
          printf '%s\n' "$K8S"     > kubernetes-versions
          printf '%s\n' "$RS"      > rs-versions
          printf '%s\n' "$REDISVL" > redisvl-versions
          printf '%s\n' "$RDI"     > rdi-versions

      - name: Apply airgap pre-snapshot patches
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("layouts/partials/scripts.html")
          text = p.read_text()
          text, n_op  = re.subn(r"new RegExp\('/docs/\(latest\|staging\\/\.\+\)/operate/(\w+)/\.\*'\)",
                                r"new RegExp('/operate/\1/')", text)
          text, n_dev = re.subn(r"new RegExp\('/docs/\(latest\|staging\\/\.\+\)/develop/ai/(\w+)/\.\*'\)",
                                r"new RegExp('/develop/ai/\1/')", text)
          text, n_int = re.subn(r"new RegExp\('/docs/\(latest\|staging\\/\.\+\)/integrate/([\w-]+)/\.\*'\)",
                                r"new RegExp('/integrate/\1/')", text)
          p.write_text(text)
          assert n_op + n_dev + n_int == 4, f"expected 4 regex relaxations, got {n_op + n_dev + n_int}"
          PYEOF
          find content -type f -name '*.md' -print0 | xargs -0 sed -i \
            -e 's|https://redis.io/docs/latest/|/|g' \
            -e 's|redis\.io/docs/latest/|/|g'
          # Point the documentation's blog links at the mirrored blog in this
          # image (content/blog, written by build/site_mirror). Mirrors the
          # same step in airgap-multibuild.sh. Four domains, not one: of the
          # 184 blog links, 83 use the legacy redis.com and 16 use
          # redislabs.com.
          find content -type f -name '*.md' -print0 | xargs -0 sed -i -E \
            -e 's#https?://(www\.)?(redis\.io|redis\.com|redislabs\.com)(/en)?/blog#/blog#g' \
            -e 's#https?://(www\.)?redis\.io/(tutorials|glossary|compare|solutions|customers|technology|resources/architecture-diagrams)#/\2#g'
          # Short-form command links: the docs link commands both as
          # redis.io/docs/latest/commands/<x> (handled above) and as
          # redis.io/commands/<x>, which that rule does not touch -- 435 links
          # to pages already in this image. Lowercased because some are written
          # in capitals while Hugo publishes them lowercase. Mirrors the same
          # step in airgap-multibuild.sh.
          find content -type f -name '*.md' -print0 | xargs -0 sed -i -E \
            -e 's#https?://(www\.)?redis\.io/commands/([A-Za-z0-9_.-]+)/?#/commands/\L\2/#g' \
            -e 's#https?://(www\.)?redis\.io/commands/?#/commands/#g'
          # The links no rule can straighten out: legacy documentation paths
          # (/docs/<old structure>/, /topics/<page>) that moved twice, where
          # only redis.io knows the target. build/site_mirror/doc_links.json
          # records where each lands, observed once with the internet and
          # committed, so this needs no network. Inside mirrored pages a
          # leftover redis.io link becomes the words it was written as.
          # Mirrors the same step in airgap-multibuild.sh.
          python3 -m build.site_mirror.doc_links
          sed -i 's#baseURL = "https://redis.io"#baseURL = "/"#g' config.toml
          sed -i 's/timeout="75"/timeout="600"/' config.toml

      # Cache key for this version: hash THIS version's content + shared Hugo
      # inputs + workflow file. Other versions' content does NOT enter the key.
      - name: Compute cache key
        id: key
        env:
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          {
            find "content/$PRODUCT/$VERSION" -type f -print0 | sort -z | xargs -0 sha256sum
            for d in layouts assets data static i18n; do
              # static/images/site-mirror is excluded: it holds ~2,700 mirrored
              # images, and a version build keeps only public/<product>/<version>,
              # which never contains them. Hashing them would mean every mirror
              # sync invalidated all 29 version caches and rebuilt the whole
              # matrix for pictures none of those pages can show.
              [ -d "$d" ] && find "$d" -type f -not -path "static/images/site-mirror/*" -print0 \
                | sort -z | xargs -0 sha256sum
            done
            for f in config.toml postcss.config.js tailwind.config.js package-lock.json; do
              [ -f "$f" ] && sha256sum "$f"
            done
            cat kubernetes-versions rs-versions redisvl-versions rdi-versions
            sha256sum .github/workflows/airgap-build.yml
            printf 'product=%s version=%s\n' "$PRODUCT" "$VERSION"
          } | sha256sum | awk '{print $1}' | cut -c1-16 > /tmp/key
          echo "key=$(cat /tmp/key)" >> "$GITHUB_OUTPUT"

      - name: Restore Hugo output cache
        id: cache-hugo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: output
          key: hugo-${{ matrix.name }}-${{ steps.key.outputs.key }}

      - name: Build version (cache miss)
        if: steps.cache-hugo.outputs.cache-hit != 'true'
        env:
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ matrix.version }}
          PRODUCT_LABEL: ${{ matrix.product_label }}
          PRODUCT_PASCAL: ${{ matrix.product_pascal }}
        run: |
          set -euo pipefail
          export PATH="$PWD/venv/bin:$PATH"

          # The mirrored content belongs to the "latest" tree only. This job
          # keeps nothing but public/<product>/<version>/, so rendering ~1,400
          # mirrored documents here is work thrown away. Mirrors the same step
          # in airgap-multibuild.sh.
          #
          # Every mirrored section and nothing else. content/glossary is NOT on
          # this list: it is the documentation's own glossary, and 28 versioned
          # pages link to it with relref -- removing it does not fail the build
          # (refLinksErrorLevel = "WARNING") but every one of those links then
          # resolves somewhere wrong in the shipped image.
          rm -rf content/blog content/blog-categories content/technology content/tutorials content/tutorial-categories content/compare content/solutions content/customers content/architecture-diagrams content/redis-glossary

          # Remove all OTHER versions of this product
          VPARENT="content/$PRODUCT"
          find "$VPARENT" -mindepth 1 -maxdepth 1 -type d -regextype posix-extended \
            -regex ".*/[0-9]+\.[0-9]+(\.[0-9]+)?$" \
            | while read -r d; do
                if [ "$(basename "$d")" != "$VERSION" ]; then
                  rm -rf "$d"
                fi
              done

          # Strip the version prefix from relrefs in this version's content
          find "$VPARENT/$VERSION" -type f -name '*.md' | while read -r f; do
            awk -v pp="$PRODUCT" -v ver="$VERSION" '
              { gsub("\\(\\{\\{< ?relref \"/" pp "/" ver, "({{< relref \"/" pp); print }
            ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

          # rsync version content INTO parent
          rsync -a --delete-after "$VPARENT/$VERSION/" "$VPARENT/"

          # Restore parent linkTitle
          sed -i "s/^linkTitle: $VERSION$/linkTitle: $PRODUCT_LABEL/" \
            "$VPARENT/_index.md" || true

          # Update nav-selector button label
          sed -i "s/id=\"versionSelector${PRODUCT_PASCAL}Value\" class=\"version-selector-control\">latest/id=\"versionSelector${PRODUCT_PASCAL}Value\" class=\"version-selector-control\">v${VERSION}/" \
            layouts/partials/docs-nav.html

          # Inject Edit-on-GitHub path rewrite
          PP_ESC="${PRODUCT//\//\\/}"
          sed -i "12i \\{{ \$gh_path = replaceRE \`^${PP_ESC}/\` \"${PP_ESC}/${VERSION}/\" \$gh_path }}" \
            layouts/partials/meta-links.html

          # No generate_page_moves.py call here: this job's /redirects.json (home
          # output) is never staged below -- only $PRODUCT/$VERSION + css/scss
          # are -- so dating it here would be pure waste. Matches upstream's own
          # main.yml, which only runs this for the latest-equivalent job.
          hugo --logLevel info -d output

          if [ ! -d "output/$PRODUCT/$VERSION" ]; then
            echo "!!! ERROR: hugo did not produce output/$PRODUCT/$VERSION" >&2
            exit 1
          fi

      # Runs unconditionally (not gated on cache-miss): output/sitemap.xml is
      # present either way, since the whole `output` dir is what gets cached.
      # Mirrors upstream's generate_version_sitemap.py (DOC-6979 / #3818) --
      # same script, ported here because it isn't wired into this workflow.
      - name: Generate version sitemap subtree
        env:
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          python3 build/generate_version_sitemap.py \
            --sitemap output/sitemap.xml \
            --subtree "$PRODUCT/$VERSION" \
            --output /tmp/version-sitemap/sitemap.xml

      # Stage this version's subtree + css/scss (served tree) plus its filtered
      # sitemap.xml (NOT part of the served tree -- assemble merges it into the
      # published sitemap.xml, it never lands under public/$PRODUCT/$VERSION/).
      - name: Stage output as artifact
        env:
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage/output/$PRODUCT
          cp -a "output/$PRODUCT/$VERSION" "/tmp/stage/output/$PRODUCT/$VERSION"
          for d in css scss; do
            [ -d "output/$d" ] && cp -a "output/$d" "/tmp/stage/output/$d"
          done
          mkdir -p /tmp/stage/sitemap
          cp /tmp/version-sitemap/sitemap.xml /tmp/stage/sitemap/sitemap.xml
          tar -czf /tmp/out.tar.gz -C /tmp/stage output sitemap

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-${{ matrix.name }}
          path: /tmp/out.tar.gz
          retention-days: 1
          compression-level: 0

  # =========================================================================
  # Phase 3: assemble — merge all per-build outputs, ndjson, gzip
  # =========================================================================
  assemble:
    name: 3. Assemble & gzip
    needs: [setup, build_latest, build_versions]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install system deps
        run: sudo apt-get install -y --no-install-recommends rsync python3-venv

      - name: Setup Python venv for ndjson
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -r requirements.txt

      # Node + tsx run transform_json_sections.ts over the merged tree, mirroring
      # the local Dockerfile/airgap-multibuild.sh feed pipeline. node_modules is
      # restored from the cache the build jobs populated (same key); npm install
      # is the cache-miss fallback. Node itself is preinstalled on the runner.
      - name: Restore node_modules
        id: cache-npm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: npm install (cache miss)
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/builds
          pattern: build-*

      - name: Merge artifacts into public/
        run: |
          set -euo pipefail
          mkdir -p public /tmp/sitemaps

          # 1. Latest establishes the base tree, and contributes its own
          #    (unversioned) sitemap.xml as one input to the merge below.
          mkdir -p /tmp/extract-latest
          tar -xzf /tmp/builds/build-latest/out.tar.gz -C /tmp/extract-latest
          cp -a /tmp/extract-latest/output/. ./public/
          mkdir -p /tmp/sitemaps/latest
          cp /tmp/extract-latest/output/sitemap.xml /tmp/sitemaps/latest/sitemap.xml

          # 2. Each version overlays its subtree + adds CSS/SCSS additively,
          #    and contributes its filtered sitemap.xml (staged outside
          #    output/ by build_versions -- see Stage output as artifact).
          for art_dir in /tmp/builds/build-*; do
            name=$(basename "$art_dir" | sed 's/^build-//')
            [ "$name" = "latest" ] && continue
            rm -rf /tmp/extract
            mkdir -p /tmp/extract
            tar -xzf "$art_dir/out.tar.gz" -C /tmp/extract

            while IFS= read -r vdir; do
              relpath=${vdir#/tmp/extract/output/}
              rm -rf "./public/$relpath"
              mkdir -p "$(dirname "./public/$relpath")"
              cp -a "$vdir" "./public/$relpath"
            done < <(find /tmp/extract/output -mindepth 3 -maxdepth 4 -type d \
              -regextype posix-extended -regex ".*/[0-9]+\.[0-9]+(\.[0-9]+)?$")

            for d in css scss; do
              if [ -d "/tmp/extract/output/$d" ]; then
                mkdir -p "./public/$d"
                cp -an "/tmp/extract/output/$d/." "./public/$d/" || true
              fi
            done

            mkdir -p "/tmp/sitemaps/$name"
            cp /tmp/extract/sitemap/sitemap.xml "/tmp/sitemaps/$name/sitemap.xml"
          done

      # Union of latest's sitemap + every version's filtered sitemap, replacing
      # the one `cp -a` above copied from latest alone. Ports upstream's
      # merge_sitemaps.py (DOC-6979 / #3818) into this pipeline.
      #
      # --expect is computed from needs.setup.outputs.matrix (the version list
      # discovered up front), NOT from counting downloaded artifacts -- doing
      # the latter would make the check tautological, since a build_versions
      # job that failed and never uploaded its artifact just wouldn't be there
      # to count either way. Independent expectation is the whole point: it's
      # upstream's own guard against a failed matrix job silently shipping a
      # sitemap with that version's pages missing.
      - name: Merge per-build sitemaps into public/sitemap.xml
        env:
          MATRIX: ${{ needs.setup.outputs.matrix }}
        run: |
          set -euo pipefail
          EXPECT=$(( $(jq 'length' <<<"$MATRIX") + 1 ))
          echo "Expecting $EXPECT sitemaps (versions + latest)"
          python3 build/merge_sitemaps.py /tmp/sitemaps --output public/sitemap.xml --expect "$EXPECT"

      - name: Generate versioned RAG feed (transform → ndjson → version tags)
        run: |
          # Mirror the local airgap-multibuild.sh step-4 pipeline exactly so the
          # shipped image's feed matches: enrich per-page JSON with heading
          # sections, concatenate to NDJSON, tag every record with the version
          # parsed from its URL. Shipped UNCOMPRESSED (placeholders intact): nginx
          # serves /docs.ndjson via runtime sub_filter + dynamic gzip. The static
          # docs.ndjson.gz is baked at deploy time by the Helm initContainer when
          # a fixed canonicalURL is set (see deployment.yaml) — not here.
          npx tsx build/transform_json_sections.ts
          /tmp/venv/bin/python3 build/generate_ndjson.py
          /tmp/venv/bin/python3 build/tag_ndjson_versions.py

      # The documentation stays in public/, the mirrored sections and their
      # pictures move to public-mirror/, and phase 4 wraps each in an image of
      # its own. A deployment that does not want 1,400 mirrored pages and
      # 238 MB of pictures does not have to carry them. Mirrors the same step
      # in the local Dockerfile.
      - name: Split the mirrored sections out of the site tree
        run: |
          python3 build/split_mirror.py --site public --mirror public-mirror \
            --assets public-mirror-assets

      - name: Pre-compress static assets (skip .json/.md — sub_filter at runtime)
        run: |
          find public public-mirror public-mirror-assets -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.xml" -o -name "*.svg" -o -name "*.txt" \) \
            -exec gzip -9 -k {} \;

      - name: Tar public/
        run: |
          tar -czf /tmp/public.tar.gz public
          tar -czf /tmp/public-mirror.tar.gz public-mirror public-mirror-assets
          echo "Documentation: $(find public -type f | wc -l) files, $(du -sh public | cut -f1)"
          echo "Mirror pages: $(find public-mirror -type f | wc -l) files, $(du -sh public-mirror | cut -f1)"
          echo "Mirror pictures: $(find public-mirror-assets -type f | wc -l) files, $(du -sh public-mirror-assets | cut -f1)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: public
          path: /tmp/public.tar.gz
          retention-days: 1
          compression-level: 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: public-mirror
          path: /tmp/public-mirror.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Append progress
        run: |
          echo "- ✅ Stage 3: Assembled $(find public -type f | wc -l) files ($(du -sh public | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Phase 4: docker — build minimal nginx images, push to DockerHub
  # =========================================================================
  docker:
    name: 4. Build & push images
    needs: [setup, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          sparse-checkout: |
            Dockerfile.runtime
            build/make_doc_bundles.py
            data/doc_bundles.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: public
          path: /tmp/

      - name: Extract public/ into build context
        run: tar -xzf /tmp/public.tar.gz -C .

      - name: Set up QEMU
        if: inputs.platforms != 'amd64'
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push privileged
        id: push_priv
        if: inputs.variant != 'unprivileged'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: Dockerfile.runtime
          platforms: ${{ needs.setup.outputs.platforms }}
          target: final
          build-args: |
            VARIANT=privileged
            GIT_COMMIT=${{ needs.setup.outputs.hash }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: ${{ needs.setup.outputs.priv_tags }}
          push: true

      - name: Build & push unprivileged
        id: push_unpriv
        if: inputs.variant != 'privileged'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: Dockerfile.runtime
          platforms: ${{ needs.setup.outputs.platforms }}
          target: final
          build-args: |
            VARIANT=unprivileged
            GIT_COMMIT=${{ needs.setup.outputs.hash }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: ${{ needs.setup.outputs.unpriv_tags }}
          push: true

      - name: Write final summary
        if: always()
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_OVERRIDE: ${{ inputs.tag_override }}
          STATUS: ${{ job.status }}
          PRIV_TAGS: ${{ needs.setup.outputs.priv_tags }}
          UNPRIV_TAGS: ${{ needs.setup.outputs.unpriv_tags }}
          PRIV_OUTCOME: ${{ steps.push_priv.outcome }}
          UNPRIV_OUTCOME: ${{ steps.push_unpriv.outcome }}
        run: |
          set -euo pipefail
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              *)       echo "❓" ;;
            esac
          }
          {
            echo ""
            echo "## Result: \`$STATUS\`"
            echo ""
            echo "| Variant | Outcome |"
            echo "|---------|---------|"
            echo "| privileged | $(icon "${PRIV_OUTCOME:-skipped}") $PRIV_OUTCOME |"
            echo "| unprivileged | $(icon "${UNPRIV_OUTCOME:-skipped}") $UNPRIV_OUTCOME |"
            echo ""

            if [ "$STATUS" != "success" ]; then
              echo "Build did not complete — see step logs above."
              exit 0
            fi

            echo "### Pull commands"
            if [ "$PRIV_OUTCOME" = "success" ]; then
              echo "**Privileged (port 80):**"
              echo '```bash'
              while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                echo "docker pull $tag"
              done <<< "$PRIV_TAGS"
              echo '```'
            fi
            if [ "$UNPRIV_OUTCOME" = "success" ]; then
              echo "**Unprivileged (port 8080):**"
              echo '```bash'
              while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                echo "docker pull $tag"
              done <<< "$UNPRIV_TAGS"
              echo '```'
            fi

            echo ""
            echo "### Quick run"
            echo '```bash'
            if [ "$UNPRIV_OUTCOME" = "success" ]; then
              FIRST=$(printf '%s\n' "$UNPRIV_TAGS" | head -n1)
              echo "docker run --rm -p 8080:8080 $FIRST"
              echo "# open http://localhost:8080"
            elif [ "$PRIV_OUTCOME" = "success" ]; then
              FIRST=$(printf '%s\n' "$PRIV_TAGS" | head -n1)
              echo "docker run --rm -p 80:80 $FIRST"
              echo "# open http://localhost"
            fi
            echo '```'

            if [ -n "$INPUT_OVERRIDE" ]; then
              echo ""
              echo "### Cleanup (test build with tag_override=\`$INPUT_OVERRIDE\`)"
              echo '```'
              [ "$PRIV_OUTCOME" = "success" ] && printf '%s\n' "$PRIV_TAGS"
              [ "$UNPRIV_OUTCOME" = "success" ] && printf '%s\n' "$UNPRIV_TAGS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Phase 4c: tests — the fork's own suites, over the whole checkout.
  #
  # cli_image runs a subset of these, and only when it builds. This job is the
  # one that sees an upstream *content* change breaking a fork test: DOC-7059
  # turned a note into a blockquote and test_acl.py read "Save this key" as the
  # command SAVE, which no file-level check could have caught. It does not hold
  # up either image, so a failure here still leaves something to deploy, but
  # the chart is not published over it.
  # =========================================================================
  tests:
    name: 4c. Fork tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt -r helm/cli-proxy/requirements.txt pytest==9.1.1

      # These need docker for a real Redis with the bundled modules, which the
      # runner has, and the full content/ tree the checkout above provides.
      - name: Run the CLI proxy, search and ACL tests
        run: python -m pytest helm/cli-proxy -q

      # build/jupyterize is left out: it imports nbformat, which no
      # requirements file in this repo declares. test_every_product_is_offered
      # is left out because Redis Radar is missing from data/doc_bundles.json
      # upstream — it fails on redis/docs main too, and is not ours to fix.
      - name: Run the build tooling tests
        run: |
          python -m pytest build -q \
            --ignore=build/jupyterize \
            --deselect build/test_make_doc_bundles.py::test_every_product_is_offered

  # =========================================================================
  # Phase 4f: mirror_image — the sections split out of the site tree.
  #
  # The same build as the site image and the same commit, wrapped separately so
  # a deployment can take the documentation without 1,400 mirrored pages and
  # 238 MB of pictures. The chart proxies their paths to this pod when
  # mirror.enabled is on, and serves neither when it is off.
  # =========================================================================
  mirror_image:
    name: 4f. Build & push the mirror image
    needs: [setup, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          sparse-checkout: Dockerfile.runtime
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: public-mirror
          path: /tmp/

      # Both trees: the pages and, separately, the pictures they reference. The
      # image copies them as two layers, so an unchanged 243 MB of pictures is
      # not pushed again for a stylesheet change.
      - name: Extract the mirror trees into the build context
        run: tar -xzf /tmp/public-mirror.tar.gz -C .

      - name: Set up QEMU
        if: inputs.platforms != 'amd64'
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push privileged
        id: push_priv
        if: inputs.variant != 'unprivileged'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: Dockerfile.runtime
          platforms: ${{ needs.setup.outputs.platforms }}
          target: mirror-privileged
          build-args: |
            GIT_COMMIT=${{ needs.setup.outputs.hash }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: ${{ needs.setup.outputs.mirror_priv_tags }}
          push: true

      - name: Build & push unprivileged
        id: push_unpriv
        if: inputs.variant != 'privileged'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: Dockerfile.runtime
          platforms: ${{ needs.setup.outputs.platforms }}
          target: mirror-unprivileged
          build-args: |
            GIT_COMMIT=${{ needs.setup.outputs.hash }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: ${{ needs.setup.outputs.mirror_unpriv_tags }}
          push: true

      - name: Write mirror summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          PRIV_TAGS: ${{ needs.setup.outputs.mirror_priv_tags }}
          UNPRIV_TAGS: ${{ needs.setup.outputs.mirror_unpriv_tags }}
          PRIV_OUTCOME: ${{ steps.push_priv.outcome }}
          UNPRIV_OUTCOME: ${{ steps.push_unpriv.outcome }}
        run: |
          {
            echo ""
            echo "## Mirror image: \`$STATUS\`"
            echo ""
            if [ "$PRIV_OUTCOME" = "success" ] || [ "$UNPRIV_OUTCOME" = "success" ]; then
              echo '```'
              [ "$PRIV_OUTCOME" = "success" ] && printf '%s\n' "$PRIV_TAGS"
              [ "$UNPRIV_OUTCOME" = "success" ] && printf '%s\n' "$UNPRIV_TAGS"
              echo '```'
            else
              echo "Nothing pushed — see the step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Phase 4b: cli_image — the CLI proxy image, which also carries the docs
  # search service. Nothing here reads the site, so it runs beside the site
  # build rather than after it.
  #
  # Built only when helm/cli-proxy changed. Every image carries a label with
  # the hash of its source, so the published images themselves say what code
  # they hold and no record of past builds is kept anywhere. Starting from the
  # tag the chart pins, the job walks up the patch numbers: a tag holding this
  # code is reused, a tag holding other code is skipped, and the first free
  # tag is built. A published tag is therefore never overwritten, and a run
  # that pushed an image without publishing the chart leaves nothing to redo:
  # the next run finds that tag and points the chart at it.
  # =========================================================================
  cli_image:
    name: 4b. CLI image (build if changed)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pinned: ${{ steps.resolve.outputs.pinned }}
      tag: ${{ steps.resolve.outputs.tag }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          sparse-checkout: helm/

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The source hash covers every tracked file under helm/cli-proxy except
      # the tests, which never enter the image: a change to a test alone does
      # not publish a new image.
      - name: Resolve the CLI image tag
        id: resolve
        env:
          INPUT_OVERRIDE: ${{ inputs.tag_override }}
        run: |
          set -euo pipefail
          SOURCE_HASH=$(git ls-files -s helm/cli-proxy | grep -vE '/test_[^/]*\.py$' \
            | sha256sum | cut -c1-16)

          # values.yaml pins the image twice, for the playground and for
          # search, and both must name the same tag: it is one image.
          PINNED=$(python3 - <<'PYEOF'
          import pathlib, re
          values = pathlib.Path("helm/redis-docs/values.yaml").read_text()
          tags = set(re.findall(r'^[ \t]+name: redis-docs-cli\n[ \t]+tag: "([^"]*)"', values, re.M))
          print(" ".join(sorted(tags)))
          PYEOF
          )
          if [[ ! "$PINNED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cli.image.tag and search.image.tag must be one plain X.Y.Z, found '$PINNED'."
            exit 1
          fi

          exists() {
            local code
            code=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' \
              "https://hub.docker.com/v2/repositories/$CLI_REPO/tags/$1")
            case "$code" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::error::Docker Hub answered $code for $CLI_REPO:$1, so it is unknown whether the tag exists. Nothing was built."
                 exit 1 ;;
            esac
          }
          source_hash_of() {
            docker buildx imagetools inspect "$CLI_REPO:$1" --format '{{json .Image}}' \
              | jq -r '(.["linux/amd64"] // .) | .config.Labels["redis-docs.cli.source-hash"] // ""'
          }

          TAG=$PINNED
          BUILD=true
          while exists "$TAG"; do
            # Read into a variable, not inside the `if`: there a failed inspect
            # would compare as a different hash and publish this code under a
            # new tag instead of failing the job.
            PUBLISHED_HASH=$(source_hash_of "$TAG")
            if [ "$PUBLISHED_HASH" = "$SOURCE_HASH" ]; then
              BUILD=false
              break
            fi
            IFS=. read -r MAJ MIN PATCH <<<"$TAG"
            TAG="$MAJ.$MIN.$((PATCH + 1))"
          done

          # A test run pushes under its override tag only, like the site
          # image, and leaves both the version sequence and :latest alone.
          if [ -n "$INPUT_OVERRIDE" ]; then
            PUSHED_TAG=$INPUT_OVERRIDE
            PUSH_TAGS="$CLI_REPO:$PUSHED_TAG"
          else
            PUSHED_TAG=$TAG
            PUSH_TAGS="$CLI_REPO:$PUSHED_TAG"$'\n'"$CLI_REPO:latest"
          fi

          {
            echo "source_hash=$SOURCE_HASH"
            echo "pinned=$PINNED"
            echo "tag=$TAG"
            echo "pushed_tag=$PUSHED_TAG"
            echo "build=$BUILD"
            echo "push_tags<<EOF"
            echo "$PUSH_TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.resolve.outputs.build == 'true'
        with:
          python-version: '3.14'

      # test_acl.py is left out: it checks the chart's ACL file against every
      # command in the docs, which this checkout does not have, and nothing it
      # covers is in the image.
      - name: Test the CLI proxy and search service
        if: steps.resolve.outputs.build == 'true'
        run: |
          python -m pip install --quiet -r helm/cli-proxy/requirements.txt pytest==9.1.1
          python -m pytest helm/cli-proxy -q --ignore=helm/cli-proxy/test_acl.py

      - name: Set up QEMU
        if: steps.resolve.outputs.build == 'true'
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        if: steps.resolve.outputs.build == 'true'

      # Both platforms whatever the platforms input says: the next run reuses
      # this tag without rebuilding it, so it has to be complete the first time.
      - name: Build & push the CLI image
        if: steps.resolve.outputs.build == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: helm/cli-proxy
          platforms: linux/amd64,linux/arm64
          labels: |
            redis-docs.cli.source-hash=${{ steps.resolve.outputs.source_hash }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.resolve.outputs.push_tags }}
          push: true

      # The Dockerfile copies a named list of files, so a module added to
      # helm/cli-proxy but not to that list builds cleanly and fails on import
      # in the cluster. The tests above run from the checkout rather than from
      # the image and cannot see it. Both platforms, which also proves the
      # published manifest carries them.
      - name: Check the pushed image runs both services
        if: steps.resolve.outputs.build == 'true'
        env:
          PUSHED: ${{ steps.resolve.outputs.pushed_tag }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" "$CLI_REPO:$PUSHED" \
              python -c "import main, search.main"
          done

      - name: Write CLI image summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          PINNED: ${{ steps.resolve.outputs.pinned }}
          TAG: ${{ steps.resolve.outputs.tag }}
          BUILD: ${{ steps.resolve.outputs.build }}
          PUSH_TAGS: ${{ steps.resolve.outputs.push_tags }}
        run: |
          {
            echo ""
            echo "## CLI image: \`$STATUS\`"
            echo ""
            if [ "$STATUS" != "success" ]; then
              echo "Nothing was pushed unless the build step shows success — see step logs."
            elif [ "$BUILD" = "true" ]; then
              echo "helm/cli-proxy changed since \`$PINNED\`. Built and pushed:"
              echo '```'
              echo "$PUSH_TAGS"
              echo '```'
            else
              echo "\`$CLI_REPO:$TAG\` already holds this code — nothing built."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Phase 4e: mirror_drift — how far behind redis.io the mirrored sections are.
  #
  # The mirror is run by hand and its output is committed, so nothing otherwise
  # says that redis.io has published since. One count query per tree does.
  #
  # It reports and never gates: a post published this morning is news, not a
  # reason to fail a build that has nothing to do with it. Nothing depends on
  # this job, and a source that cannot be reached leaves the summary saying so.
  # =========================================================================
  mirror_drift:
    name: 4e. Mirror drift report
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Compare the mirrored sections against their source
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -m build.site_mirror --check 2>&1 | tee /tmp/drift.txt
          {
            echo "## Mirror drift"
            echo ""
            echo '```'
            sed -E 's/^[0-9-]+ [0-9:,]+ [A-Z]+ site_mirror //' /tmp/drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Phase 4d: dockerhub_description — the text on each image's Docker Hub
  # page, kept in .github/dockerhub/.
  #
  # Only from the release branch, feature/docker-support, named in the `if`
  # below because a job-level condition cannot read env. Both branches push to
  # the same two repositories
  # but do not hold the same site, and the description belongs to the
  # repository rather than to a tag, so it describes the release branch and is
  # written only from there. It is compared before it is written: an unchanged
  # description is left alone, and the text only moves when someone edits the
  # file.
  #
  # Nothing depends on this job. A Docker Hub account whose token cannot write
  # descriptions fails here and nowhere else.
  # =========================================================================
  dockerhub_description:
    name: 4d. Docker Hub descriptions
    if: github.ref_name == 'feature/docker-support' && inputs.tag_override == ''
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          sparse-checkout: .github/dockerhub/

      - name: Sync the descriptions that changed
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          API=https://hub.docker.com/v2

          # The API takes a JWT, which the same credentials the image push uses
          # can obtain. A personal access token needs write scope to set a
          # description; without it the PATCH below answers 401 or 403.
          JWT=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" \
                  '{username: $u, password: $p}' \
                | curl -sS --fail-with-body -X POST "$API/users/login/" \
                    -H 'Content-Type: application/json' -d @- \
                | jq -r .token)

          for repo in $REPO $CLI_REPO; do
            file=".github/dockerhub/${repo##*/}.md"
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing — every pushed repository needs its description."
              exit 1
            fi

            # First line carries the one-line summary Docker Hub shows in
            # search results; the rest is the page itself.
            SHORT=$(sed -nE '1s/^<!-- short: (.*) -->$/\1/p' "$file")
            if [ -z "$SHORT" ]; then
              echo "::error::$file must open with <!-- short: ... -->."
              exit 1
            fi
            FULL=$(tail -n +2 "$file")

            CURRENT=$(curl -sS --fail-with-body "$API/repositories/$repo/" \
              -H "Authorization: JWT $JWT")
            if [ "$(jq -r '.description // ""' <<<"$CURRENT")" = "$SHORT" ] \
               && [ "$(jq -r '.full_description // ""' <<<"$CURRENT")" = "$FULL" ]; then
              echo "$repo: description already matches $file."
              continue
            fi

            jq -n --arg d "$SHORT" --arg f "$FULL" '{description: $d, full_description: $f}' \
              | curl -sS --fail-with-body -o /dev/null -X PATCH "$API/repositories/$repo/" \
                  -H "Authorization: JWT $JWT" -H 'Content-Type: application/json' -d @-
            echo "$repo: description updated from $file."
            echo "- updated \`$repo\` from \`$file\`" >> "$GITHUB_STEP_SUMMARY"
          done

  # =========================================================================
  # Phase 5: publish_chart — opt-in.
  # Order: bump files -> git commit & push -> helm publish to OCI.
  # If helm publish fails the bump is already in git; rerun helm push by hand.
  # Waits for cli_image as well and takes the CLI tag from it, so the chart
  # never names a CLI image that was not pushed, and for the fork's tests, so
  # a published chart is never one whose tests were failing.
  # Skipped on partial builds (variant/platforms != both, or tag_override set).
  # =========================================================================
  publish_chart:
    name: 5. Publish Helm chart (opt-in)
    needs: [setup, docker, cli_image, tests]
    if: >-
      inputs.publish_chart &&
      inputs.variant == 'both' &&
      inputs.platforms == 'both' &&
      inputs.tag_override == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Default ref (github.ref) and persist-credentials (true) are what we
      # need: git-auto-commit-action reuses the auth header to push back to
      # this branch.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Bump chart files
        id: bump
        env:
          NEW_HASH: ${{ needs.setup.outputs.hash }}
          OLD_CLI_TAG: ${{ needs.cli_image.outputs.pinned }}
          NEW_CLI_TAG: ${{ needs.cli_image.outputs.tag }}
        run: |
          set -euo pipefail
          CHART=helm/redis-docs/Chart.yaml

          # NEW_HASH is interpolated into sed below, so it must match the
          # setup phase's convention exactly (git rev-parse --short=9). A
          # malformed hash here would corrupt every targeted line.
          if [[ ! "$NEW_HASH" =~ ^[a-f0-9]{9}$ ]]; then
            echo "::error::NEW_HASH '$NEW_HASH' is not 9-char lowercase hex. Setup phase produced an unexpected value."
            exit 1
          fi

          OLD_VERSION=$(grep '^version:' "$CHART" | awk '{print $2}')
          OLD_HASH=$(sed -nE 's/^appVersion:[[:space:]]*"([^"]+)".*/\1/p' "$CHART")

          # OLD_VERSION drives the patch increment ($((PATCH + 1))), so any
          # non-X.Y.Z form crashes the arithmetic mid-bump. Reject early.
          if [[ ! "$OLD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$OLD_VERSION' is not plain X.Y.Z. Pre-release / build-meta suffixes are not auto-bumped — bump manually per BUILD.md step 5."
            exit 1
          fi

          # OLD_HASH is used only for the same-hash skip check; it is no
          # longer interpolated into sed, so loose validation suffices.
          if [ -z "$OLD_HASH" ]; then
            echo "::error::Could not read appVersion from $CHART. Format may have changed."
            exit 1
          fi

          # Validated by cli_image, but interpolated below all the same.
          if [[ ! "$NEW_CLI_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CLI tag '$NEW_CLI_TAG' from cli_image is not plain X.Y.Z."
            exit 1
          fi

          {
            echo "old_version=$OLD_VERSION"
            echo "old_hash=$OLD_HASH"
            echo "old_cli_tag=$OLD_CLI_TAG"
          } >> "$GITHUB_OUTPUT"

          if [ "$OLD_HASH" = "$NEW_HASH" ] && [ "$OLD_CLI_TAG" = "$NEW_CLI_TAG" ]; then
            echo "appVersion already $NEW_HASH and CLI image already $NEW_CLI_TAG — nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every place the chart names the CLI image. values.yaml pins it
          # twice (playground and search: one image), the airgapped example
          # once; the READMEs name it in their tables and air-gap commands.
          if [ "$OLD_CLI_TAG" != "$NEW_CLI_TAG" ]; then
            python3 <<'PYEOF'
          import os, pathlib, re
          new_tag = os.environ["NEW_CLI_TAG"]
          cli_repo = os.environ["CLI_REPO"]
          def point_at_new_tag(path, pattern, expected=None):
              p = pathlib.Path(path)
              text, n = re.subn(pattern, lambda m: m.group(1) + new_tag, p.read_text(), flags=re.M)
              if expected is not None:
                  assert n == expected, f"{path}: expected {expected} CLI tag(s), found {n}"
              assert n, f"{path}: no CLI tag found to update"
              p.write_text(text)
          pinned_tag = r'(^[ \t]+name: redis-docs-cli\n[ \t]+tag: ")[^"]*'
          point_at_new_tag("helm/redis-docs/values.yaml", pinned_tag, expected=2)
          point_at_new_tag("helm/redis-docs/examples/values-openshift-airgapped.yaml", pinned_tag, expected=1)
          named_tag = (r"(redis-docs-cli:|cli\.image\.tag=|`" + re.escape(cli_repo) + r"` \| `"
                       r"|`(?:cli|search)\.image\.tag` \| `)[0-9]+\.[0-9]+\.[0-9]+")
          point_at_new_tag("helm/redis-docs/README.md", named_tag)
          point_at_new_tag("helm/redis-docs/README-he.md", named_tag)
          PYEOF
          fi

          IFS=. read -r MAJ MIN PATCH <<<"$OLD_VERSION"
          NEW_VERSION="$MAJ.$MIN.$((PATCH + 1))"

          # Context-aware replacements. Each pattern matches exactly the
          # lines BUILD.md step 5 lists, so a stray hex string elsewhere in
          # these files (release notes, examples, etc.) can't be corrupted.
          sed -i -E "s/^appVersion:[[:space:]]*\"[a-f0-9]+\"/appVersion: \"${NEW_HASH}\"/" "$CHART"
          # The mirror's tag first: `[a-f0-9]+-unprivileged` cannot match
          # `<hash>-mirror-unprivileged` (the word "mirror" is not hex), so
          # without its own pattern that tag would quietly go stale.
          sed -i -E "s/[a-f0-9]+-mirror-unprivileged/${NEW_HASH}-mirror-unprivileged/g" \
            helm/redis-docs/examples/values-openshift-airgapped.yaml \
            helm/redis-docs/README.md \
            helm/redis-docs/README-he.md
          sed -i -E "s/[a-f0-9]+-unprivileged/${NEW_HASH}-unprivileged/g" \
            helm/redis-docs/examples/values-openshift-airgapped.yaml \
            helm/redis-docs/README.md \
            helm/redis-docs/README-he.md
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" "$CHART"
          # The READMEs install from the packaged chart by file name.
          sed -i -E "s/redis-docs-[0-9]+\.[0-9]+\.[0-9]+\.tgz/redis-docs-${NEW_VERSION}.tgz/g" \
            helm/redis-docs/README.md \
            helm/redis-docs/README-he.md
          # The Docker Hub pages pull the chart by version. They are published
          # by dockerhub_description, which runs before this job, so the text
          # on Docker Hub names the version from the run before — a version
          # that exists, one patch behind.
          sed -i -E "s/--version [0-9]+\.[0-9]+\.[0-9]+/--version ${NEW_VERSION}/g" \
            .github/dockerhub/redis-docs.md \
            .github/dockerhub/redis-docs-cli.md

          if [ "$OLD_CLI_TAG" != "$NEW_CLI_TAG" ]; then
            CLI_NOTE=", CLI image $NEW_CLI_TAG"
          else
            CLI_NOTE=""
          fi

          {
            echo "new_version=$NEW_VERSION"
            echo "new_hash=$NEW_HASH"
            echo "new_cli_tag=$NEW_CLI_TAG"
            echo "cli_note=$CLI_NOTE"
            echo "changed=true"
          } >> "$GITHUB_OUTPUT"

      # Skip when the bump step short-circuited (changed=false because the
      # appVersion was already current). GHA implicitly ANDs success() with
      # any step-level `if:` that does not contain a status function — no
      # need to repeat it here.
      - name: Commit bump
        if: steps.bump.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9  # v7.1.0
        with:
          commit_message: "chore(helm): bump chart ${{ steps.bump.outputs.new_version }}, appVersion ${{ steps.bump.outputs.new_hash }}${{ steps.bump.outputs.cli_note }}"
          file_pattern: helm/redis-docs/ .github/dockerhub/

      - name: Publish chart to OCI
        if: steps.bump.outputs.changed == 'true'
        uses: appany/helm-oci-chart-releaser@d94988c92bed2e09c6113981f15f8bb495d10943  # v0.5.0
        with:
          name: redis-docs
          repository: ${{ vars.DOCKERHUB_USERNAME }}
          tag: ${{ steps.bump.outputs.new_version }}
          path: helm/redis-docs
          registry: registry-1.docker.io
          registry_username: ${{ vars.DOCKERHUB_USERNAME }}
          registry_password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write chart summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          CHANGED: ${{ steps.bump.outputs.changed }}
          OLD_VERSION: ${{ steps.bump.outputs.old_version }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          NEW_HASH: ${{ steps.bump.outputs.new_hash }}
          OLD_CLI_TAG: ${{ steps.bump.outputs.old_cli_tag }}
          NEW_CLI_TAG: ${{ steps.bump.outputs.new_cli_tag }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          {
            echo ""
            echo "## Helm chart publish: \`$STATUS\`"
            echo ""
            if [ "$STATUS" = "success" ] && [ "$CHANGED" = "true" ]; then
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| version | \`$OLD_VERSION\` → \`$NEW_VERSION\` |"
              echo "| appVersion | \`$NEW_HASH\` |"
              if [ "$OLD_CLI_TAG" != "$NEW_CLI_TAG" ]; then
                echo "| CLI image | \`$OLD_CLI_TAG\` → \`$NEW_CLI_TAG\` |"
              else
                echo "| CLI image | \`$NEW_CLI_TAG\` (unchanged) |"
              fi
              echo "| OCI ref | \`oci://registry-1.docker.io/$DOCKERHUB_USERNAME/redis-docs:$NEW_VERSION\` |"
            elif [ "$STATUS" = "success" ]; then
              echo "Chart appVersion already up to date — nothing pushed."
            elif [ "$CHANGED" = "true" ]; then
              echo "⚠️ Bump committed (or attempted) but a later step failed."
              echo ""
              echo "If \`Commit bump\` succeeded but \`Publish chart\` failed, run manually:"
              echo '```bash'
              echo "helm package helm/redis-docs/ -d /tmp/"
              echo "helm push /tmp/redis-docs-${NEW_VERSION}.tgz oci://registry-1.docker.io/$DOCKERHUB_USERNAME"
              echo '```'
            else
              echo "❌ Bump step failed (validation or sed) — nothing committed, nothing published. See step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
