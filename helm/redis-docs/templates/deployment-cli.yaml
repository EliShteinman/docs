{{- if .Values.cli.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redis-docs.fullname" . }}-cli
  labels:
    {{- include "redis-docs.labels" . | nindent 4 }}
    app.kubernetes.io/component: cli
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "redis-docs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cli
  template:
    metadata:
      labels:
        {{- include "redis-docs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cli
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cli-proxy
          image: {{ include "redis-docs.cliImage" . }}
          imagePullPolicy: {{ .Values.cli.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: REDIS_HOST
              value: "localhost"
            - name: REDIS_PORT
              value: "6379"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.cli.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
        - name: redis
          image: {{ include "redis-docs.cliRedisImage" . }}
          imagePullPolicy: {{ .Values.cli.redis.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.cli.redis.resources | nindent 12 }}
        {{- if .Values.cli.jupyter.enabled }}
        - name: jupyter
          image: {{ include "redis-docs.cliJupyterImage" . }}
          imagePullPolicy: {{ .Values.cli.jupyter.image.pullPolicy }}
          ports:
            - name: jupyter
              containerPort: 8888
              protocol: TCP
          env:
            - name: REDIS_HOST
              value: "localhost"
            - name: REDIS_PORT
              value: "6379"
          command: ["jupyter"]
          args:
            - "notebook"
            - "--ip=0.0.0.0"
            - "--port=8888"
            - "--no-browser"
            - "--NotebookApp.token=''"
            - "--NotebookApp.password=''"
            - "--NotebookApp.allow_origin='*'"
            - "--NotebookApp.disable_check_xsrf=True"
          livenessProbe:
            httpGet:
              path: /api/status
              port: jupyter
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/status
              port: jupyter
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.cli.jupyter.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
        {{- end }}
{{- end }}
