apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis-docs.fullname" . }}-nginx
  labels:
    {{- include "redis-docs.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;

    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections {{ .Values.nginx.workerConnections }};
        multi_accept on;
    }

    http {
        proxy_temp_path /tmp/proxy_temp;
        client_body_temp_path /tmp/client_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" $request_time $gzip_ratio';

        access_log /var/log/nginx/access.log main buffer=16k flush=5s;

        {{- if and .Values.search.enabled .Values.search.rateLimit.enabled }}
        # The search endpoint is the one path here that costs more than reading
        # a file off disk, and the only one a caller that is not a browser is
        # likely to drive in a loop. Keyed on the client address; see
        # search.rateLimit in values.yaml for why it is off by default.
        limit_req_zone $binary_remote_addr zone=search:{{ .Values.search.rateLimit.zoneSize }} rate={{ .Values.search.rateLimit.rate }};
        {{- end }}

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        keepalive_timeout {{ .Values.nginx.keepaliveTimeout }};
        keepalive_requests 1000;

        open_file_cache max=10000 inactive=60s;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 2;

        gzip_static on;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 256;
        gzip_types
            text/plain
            text/markdown
            text/css
            text/xml
            text/javascript
            application/json
            application/x-ndjson
            application/javascript
            application/xml
            application/rss+xml
            image/svg+xml;

        include /etc/nginx/conf.d/*.conf;
    }
  default.conf: |
    server {
        listen {{ .Values.containerPort }};
        {{- if and .Values.tls.enabled .Values.tls.nginxTermination }}
        listen {{ .Values.tls.httpsPort }} ssl;
        ssl_certificate /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        {{- end }}
        server_name _;

        absolute_redirect off;
        port_in_redirect off;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }

        location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico|mp4)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # AI / RAG outputs (.md, .json, .ndjson): substitute the __DOCS_BASE_URL__
        # placeholder produced at build time by process-markdown-content.html
        # with the canonical URL of this deployment, so consumers that ingest
        # the markdown without HTML context still see fully-qualified links.
        #
        # gzip_static is disabled for these locations because sub_filter cannot
        # operate on already-compressed bodies; dynamic `gzip on` (with
        # text/markdown + application/json in gzip_types) re-compresses the
        # modified response on the way out.
        location ~* \.(md|json|ndjson)$ {
            gzip_static off;
            types {
                text/markdown md;
                application/json json;
                application/x-ndjson ndjson;
            }
            {{- if .Values.canonicalURL }}
            sub_filter '__DOCS_BASE_URL__' '{{ .Values.canonicalURL | trimSuffix "/" }}';
            {{- else }}
            sub_filter '__DOCS_BASE_URL__' '$scheme://$http_host';
            {{- end }}
            sub_filter_types text/markdown application/json application/x-ndjson;
            sub_filter_once off;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location = /stub_status {
            stub_status on;
            allow 127.0.0.1;
            deny all;
            access_log off;
        }

        {{- if .Values.search.enabled }}
        # The path search-modal.html already calls, spelled exactly as
        # config.toml's `searchService` builds it. An exact-match location
        # outranks every regex location above it, so this is reached before the
        # static-asset rules ever see the request. Without this block the
        # request falls through to `location /`, 404s, and the modal opens
        # empty — which is the behaviour when search is disabled.
        location = /convai/api/search-service {
            {{- if .Values.search.rateLimit.enabled }}
            # 429 rather than nginx's default 503: a client that is being asked
            # to slow down has not hit a broken service, and the service says
            # 503 itself when it cannot reach its index.
            limit_req zone=search burst={{ .Values.search.rateLimit.burst }} nodelay;
            limit_req_status 429;
            {{- end }}
            {{- if .Values.search.cors.enabled }}
            add_header Access-Control-Allow-Origin {{ .Values.search.cors.allowOrigin | quote }} always;
            add_header Vary Origin always;
            # A plain GET needs no preflight, but a caller that sends a header
            # of its own turns the same request into one. Answered here rather
            # than in the service, which would otherwise see an OPTIONS it has
            # no route for.
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            if ($request_method = OPTIONS) {
                return 204;
            }
            {{- end }}
            proxy_pass http://{{ include "redis-docs.fullname" . }}-search:8091/search;
        }
        {{- end }}

        {{- if .Values.mirror.enabled }}
        # The mirrored sections live in an image of their own and are served by
        # their own pod.
        #
        # `^~`, not a plain prefix: a regex location beats a prefix one in
        # nginx, so the asset and .html rules above would otherwise catch
        # /images/site-mirror/x.webp and /blog/a-post/index.html and answer
        # them from this image, which no longer has either. `^~` stops the
        # regex round from happening at all.
        {{- range splitList " " (include "redis-docs.mirrorPaths" .) }}
        location ^~ /{{ . }}/ {
            proxy_pass http://{{ include "redis-docs.fullname" $ }}-mirror:8080;
        }
        {{- end }}

        # The mirrored pages' own sitemap. The site's /sitemap.xml lists the
        # documentation alone, because it is built whether or not this pod is
        # deployed and must not advertise addresses nothing answers.
        location = /sitemap-mirror.xml {
            proxy_pass http://{{ include "redis-docs.fullname" . }}-mirror:8080/sitemap.xml;
        }
        {{- end }}

        {{- if .Values.cli.enabled }}
        location = /cli {
            proxy_pass http://{{ include "redis-docs.fullname" . }}-cli:8090/cli;
            proxy_set_header Content-Type "application/json";
        }
        {{- end }}

        {{- if and .Values.cli.enabled .Values.cli.jupyter.enabled }}
        location /jupyter/ {
            proxy_pass http://{{ include "redis-docs.fullname" . }}-cli:8888/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
        {{- end }}

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }
