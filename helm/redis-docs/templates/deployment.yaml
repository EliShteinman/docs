apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redis-docs.fullname" . }}
  labels:
    {{- include "redis-docs.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "redis-docs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/runtime-config: {{ include (print $.Template.BasePath "/configmap-runtime.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "redis-docs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "redis-docs.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ include "redis-docs.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            {{- if and .Values.tls.enabled .Values.tls.nginxTermination }}
            - name: https
              containerPort: {{ .Values.tls.httpsPort }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
            - name: runtime-config
              mountPath: /usr/share/nginx/html/js/runtime-config.js
              subPath: runtime-config.js
              readOnly: true
            {{- if and .Values.tls.enabled .Values.tls.nginxTermination }}
            - name: tls-certs
              mountPath: /etc/nginx/ssl
              readOnly: true
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: logs
              mountPath: /var/log/nginx
            {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: "{{ include "redis-docs.metricsImage" . }}"
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          args:
            - -config-file
            - /etc/nginxlog-exporter/config.hcl
          ports:
            - name: metrics
              containerPort: 4040
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: logs
              mountPath: /var/log/nginx
              readOnly: true
            - name: metrics-config
              mountPath: /etc/nginxlog-exporter
              readOnly: true
        {{- end }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "redis-docs.fullname" . }}-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: runtime-config
          configMap:
            name: {{ include "redis-docs.fullname" . }}-runtime
        {{- if and .Values.tls.enabled .Values.tls.nginxTermination }}
        - name: tls-certs
          secret:
            secretName: {{ include "redis-docs.tlsSecretName" . }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: logs
          emptyDir: {}
        - name: metrics-config
          configMap:
            name: {{ include "redis-docs.fullname" . }}-metrics
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
