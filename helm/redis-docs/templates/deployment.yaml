apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redis-docs.fullname" . }}
  labels:
    {{- include "redis-docs.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "redis-docs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/runtime-config: {{ include (print $.Template.BasePath "/configmap-runtime.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "redis-docs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "redis-docs.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.canonicalURL }}
      # A fixed canonical URL is known at deploy time, so bake a correct,
      # pre-substituted docs.ndjson.gz for the advertised gzipped RAG download.
      # (Without canonicalURL the base URL varies per request via $http_host and a
      # static .gz cannot be pre-substituted — it is then simply not served, and
      # consumers use /docs.ndjson, which nginx substitutes + gzips per request.)
      initContainers:
        - name: bake-ndjson-gz
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ include "redis-docs.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              src=/usr/share/nginx/html/docs.ndjson
              tmp=/ndjson-gz/docs.ndjson.gz.tmp
              out=/ndjson-gz/docs.ndjson.gz
              # This is a secondary download — never let its failure block the pod
              # (and thus the whole docs site). On any problem, log and exit 0 so
              # nginx still starts; /docs.ndjson.gz then 404s, exactly like the
              # no-canonicalURL path. Write to a temp then rename so a failed/empty
              # bake never leaves a truncated .gz in place.
              if [ ! -s "$src" ]; then
                echo "WARN: $src missing/empty; skipping gz bake (/docs.ndjson.gz will 404)" >&2
                exit 0
              fi
              if sed "s|__DOCS_BASE_URL__|${DOCS_BASE_URL}|g" "$src" | gzip -9 > "$tmp" && [ -s "$tmp" ]; then
                mv -f "$tmp" "$out"
                echo "baked $out ($(wc -c < "$out") bytes)"
              else
                echo "WARN: gz bake failed; /docs.ndjson.gz will 404" >&2
                rm -f "$tmp"
              fi
          env:
            - name: DOCS_BASE_URL
              value: {{ .Values.canonicalURL | trimSuffix "/" | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: ndjson-gz
              mountPath: /ndjson-gz
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ include "redis-docs.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            {{- if and .Values.tls.enabled .Values.tls.nginxTermination }}
            - name: https
              containerPort: {{ .Values.tls.httpsPort }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
            - name: runtime-config
              mountPath: /usr/share/nginx/html/js/runtime-config.js
              subPath: runtime-config.js
              readOnly: true
            {{- if .Values.canonicalURL }}
            - name: ndjson-gz
              mountPath: /usr/share/nginx/html/docs.ndjson.gz
              subPath: docs.ndjson.gz
              readOnly: true
            {{- end }}
            {{- if and .Values.tls.enabled .Values.tls.nginxTermination }}
            - name: tls-certs
              mountPath: /etc/nginx/ssl
              readOnly: true
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: logs
              mountPath: /var/log/nginx
            {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: "{{ include "redis-docs.metricsImage" . }}"
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          args:
            - -config-file
            - /etc/nginxlog-exporter/config.hcl
          ports:
            - name: metrics
              containerPort: 4040
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: logs
              mountPath: /var/log/nginx
              readOnly: true
            - name: metrics-config
              mountPath: /etc/nginxlog-exporter
              readOnly: true
        {{- end }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "redis-docs.fullname" . }}-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: runtime-config
          configMap:
            name: {{ include "redis-docs.fullname" . }}-runtime
        {{- if .Values.canonicalURL }}
        - name: ndjson-gz
          emptyDir: {}
        {{- end }}
        {{- if and .Values.tls.enabled .Values.tls.nginxTermination }}
        - name: tls-certs
          secret:
            secretName: {{ include "redis-docs.tlsSecretName" . }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: logs
          emptyDir: {}
        - name: metrics-config
          configMap:
            name: {{ include "redis-docs.fullname" . }}-metrics
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
