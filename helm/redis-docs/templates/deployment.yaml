apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redis-docs.fullname" . }}
  labels:
    {{- include "redis-docs.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.progressDeadlineSeconds }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "redis-docs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/runtime-config: {{ include (print $.Template.BasePath "/configmap-runtime.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "redis-docs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "redis-docs.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.canonicalURL }}
      # A fixed canonical URL is known at deploy time, so bake a correct,
      # pre-substituted docs.ndjson.gz for the advertised gzipped RAG download.
      # (Without canonicalURL the base URL varies per request via $http_host and a
      # static .gz cannot be pre-substituted — it is then simply not served, and
      # consumers use /docs.ndjson, which nginx substitutes + gzips per request.)
      initContainers:
        - name: bake-ndjson-gz
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ include "redis-docs.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              src=/usr/share/nginx/html/docs.ndjson
              tmp=/ndjson-gz/docs.ndjson.gz.tmp
              out=/ndjson-gz/docs.ndjson.gz
              # This is a secondary download — never let its failure block the pod
              # (and thus the whole docs site). On any problem, log and exit 0 so
              # nginx still starts; /docs.ndjson.gz then 404s, exactly like the
              # no-canonicalURL path. Write to a temp then rename so a failed/empty
              # bake never leaves a truncated .gz in place.
              if [ ! -s "$src" ]; then
                echo "WARN: $src missing/empty; skipping gz bake (/docs.ndjson.gz will 404)" >&2
                exit 0
              fi
              if sed "s|__DOCS_BASE_URL__|${DOCS_BASE_URL}|g" "$src" | gzip -9 > "$tmp" && [ -s "$tmp" ]; then
                mv -f "$tmp" "$out"
                echo "baked $out ($(wc -c < "$out") bytes)"
              else
                echo "WARN: gz bake failed; /docs.ndjson.gz will 404" >&2
                rm -f "$tmp"
              fi
          env:
            - name: DOCS_BASE_URL
              value: {{ .Values.canonicalURL | trimSuffix "/" | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: ndjson-gz
              mountPath: /ndjson-gz
        {{- if include "redis-docs.downloadsActive" . }}
        # Pack the documentation download bundles. Same reasoning as the ndjson
        # bake above: the archives carry absolute links, so they can only be
        # built once the base URL is fixed — which happens here, not at image
        # build time. Rebuilt on every pod start; the emptyDir is per-pod.
        - name: pack-doc-bundles
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ include "redis-docs.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -u
              out=/downloads/bundles
              stage=/downloads/.staging

              # Downloads are a secondary feature, so no failure here may block
              # the docs site. Every step exits 0 on failure: nginx still starts
              # and the archives 404, exactly as when downloads are switched
              # off. Deliberately not `set -e` -- that would turn a failed rm or
              # mv into a crash-looping init container, taking the site with it.
              give_up() {
                echo "WARN: $1; documentation downloads will 404" >&2
                rm -rf "$stage"
                exit 0
              }

              # Stage then swap, so a partial run never leaves the widget
              # offering half a set of archives.
              rm -rf "$stage" || give_up "could not clear the staging directory"
              mkdir -p "$stage" || give_up "could not create the staging directory"

              # -u because packing runs for minutes and Python buffers stdout
              # when it is not a terminal: without it `oc logs` stays empty the
              # whole time and a working pod is indistinguishable from a hung one.
              echo "packing $BUNDLE_FORMATS for $DOCS_BASE_URL ..."
              python3 -u /opt/redis-docs/build/make_doc_bundles.py \
                --source /usr/share/nginx/html \
                --out "$stage" \
                --all-versions \
                --formats "$BUNDLE_FORMATS" \
                --url-base "$DOCS_BASE_URL" \
                --source-url "$DOCS_SOURCE_URL" || give_up "packing failed"

              rm -rf "$out" || give_up "could not remove the previous set"
              mv "$stage" "$out" || give_up "could not publish the packed set"
              echo "packed $(find "$out" -name '*.tar.gz' | wc -l) bundles ($(du -sh "$out" | cut -f1))"
          env:
            - name: DOCS_BASE_URL
              value: {{ .Values.canonicalURL | trimSuffix "/" | quote }}
            - name: BUNDLE_FORMATS
              value: {{ .Values.downloads.formats | quote }}
            - name: DOCS_SOURCE_URL
              value: {{ .Values.downloads.sourceURL | quote }}
          resources:
            {{- toYaml (.Values.downloads.resources | default .Values.resources) | nindent 12 }}
          volumeMounts:
            - name: doc-bundles
              mountPath: /downloads
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ include "redis-docs.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            {{- if and .Values.tls.enabled .Values.tls.nginxTermination }}
            - name: https
              containerPort: {{ .Values.tls.httpsPort }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
            - name: runtime-config
              mountPath: /usr/share/nginx/html/js/runtime-config.js
              subPath: runtime-config.js
              readOnly: true
            {{- if .Values.canonicalURL }}
            - name: ndjson-gz
              mountPath: /usr/share/nginx/html/docs.ndjson.gz
              subPath: docs.ndjson.gz
              readOnly: true
            {{- end }}
            {{- if include "redis-docs.downloadsActive" . }}
            - name: doc-bundles
              mountPath: /usr/share/nginx/html/downloads
              readOnly: true
            {{- end }}
            {{- if and .Values.tls.enabled .Values.tls.nginxTermination }}
            - name: tls-certs
              mountPath: /etc/nginx/ssl
              readOnly: true
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: logs
              mountPath: /var/log/nginx
            {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: "{{ include "redis-docs.metricsImage" . }}"
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          args:
            - -config-file
            - /etc/nginxlog-exporter/config.hcl
          ports:
            - name: metrics
              containerPort: 4040
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: logs
              mountPath: /var/log/nginx
              readOnly: true
            - name: metrics-config
              mountPath: /etc/nginxlog-exporter
              readOnly: true
        {{- end }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "redis-docs.fullname" . }}-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: runtime-config
          configMap:
            name: {{ include "redis-docs.fullname" . }}-runtime
        {{- if .Values.canonicalURL }}
        - name: ndjson-gz
          emptyDir: {}
        {{- end }}
        {{- if include "redis-docs.downloadsActive" . }}
        # Disk-backed on purpose: the packed set runs to a few hundred MB, which
        # counts against ephemeral-storage here and against the memory limit if
        # it were medium: Memory. nginx's page cache keeps the hot archives in
        # RAM anyway.
        - name: doc-bundles
          emptyDir: {}
        {{- end }}
        {{- if and .Values.tls.enabled .Values.tls.nginxTermination }}
        - name: tls-certs
          secret:
            secretName: {{ include "redis-docs.tlsSecretName" . }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: logs
          emptyDir: {}
        - name: metrics-config
          configMap:
            name: {{ include "redis-docs.fullname" . }}-metrics
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
