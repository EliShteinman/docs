{{- if and .Values.metrics.enabled .Values.metrics.route.enabled -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "redis-docs.fullname" . }}-metrics
  labels:
    {{- include "redis-docs.labels" . | nindent 4 }}
  {{- with .Values.metrics.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.metrics.route.host }}
  host: {{ .Values.metrics.route.host | quote }}
  {{- end }}
  path: /metrics
  to:
    kind: Service
    name: {{ include "redis-docs.fullname" . }}
    weight: 100
  port:
    targetPort: metrics
  {{- if .Values.metrics.route.tls.enabled }}
  tls:
    termination: {{ .Values.metrics.route.tls.termination }}
    {{- if .Values.metrics.route.tls.insecureEdgeTerminationPolicy }}
    insecureEdgeTerminationPolicy: {{ .Values.metrics.route.tls.insecureEdgeTerminationPolicy }}
    {{- end }}
  {{- end }}
  wildcardPolicy: None
{{- end }}
