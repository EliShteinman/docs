apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-docs.fullname" . }}
  labels:
    {{- include "redis-docs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.metrics.enabled }}
    - port: 9113
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "redis-docs.selectorLabels" . | nindent 4 }}
