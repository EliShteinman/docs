apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis-docs.fullname" . }}-runtime
  labels:
    {{- include "redis-docs.labels" . | nindent 4 }}
data:
  runtime-config.js: |
    window.RUNTIME_CONFIG = {
      aiServices: {
        litellm: {
          enabled: {{ .Values.aiServices.litellm.enabled }},
          url: "{{ .Values.aiServices.litellm.url }}",
          model: "{{ .Values.aiServices.litellm.model }}",
          apiKey: "{{ .Values.aiServices.litellm.apiKey }}"
        },
        binder: {
          url: "{{ .Values.aiServices.binder.url }}",
          jupyter: {
            enabled: {{ and .Values.cli.enabled .Values.cli.jupyter.enabled }},
            url: "/jupyter/"
          }
        }
      },
      externalLinks: {
        sandbox:    { enabled: {{ .Values.externalLinks.sandbox.enabled }},    url: "{{ .Values.externalLinks.sandbox.url }}" },
        tutorials:  { enabled: {{ .Values.externalLinks.tutorials.enabled }},  url: "{{ .Values.externalLinks.tutorials.url }}" },
        university: { enabled: {{ .Values.externalLinks.university.enabled }}, url: "{{ .Values.externalLinks.university.url }}" },
        blog:       { enabled: {{ .Values.externalLinks.blog.enabled }},       url: "{{ .Values.externalLinks.blog.url }}" },
        support:    { enabled: {{ .Values.externalLinks.support.enabled }},    url: "{{ .Values.externalLinks.support.url }}" },
        github:     { enabled: {{ .Values.externalLinks.github.enabled }},     url: "{{ .Values.externalLinks.github.url }}" },
        chatbot:    { enabled: {{ .Values.externalLinks.chatbot.enabled }},    url: "{{ .Values.externalLinks.chatbot.url }}" }
      }
    };
