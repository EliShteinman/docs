{{- /*
  Resolve the effective external-links map by walking the hierarchical
  catalog (helm/redis-docs/files/external-links.yaml) and composing five
  layers of configuration:

  Precedence for `enabled` (highest wins):
    1. .Values.externalLinks.overrides.<key>.enabled
    2. .Values.externalLinks.families.<fam>.sub-families.<sub>.enabled
    3. .Values.externalLinks.families.<fam>.enabled
    4. .Values.externalLinks.enabled                 (master kill-switch)
    5. catalog default                               (per-link `enabled: true`)

  Resolution for `url`:
    1. .Values.externalLinks.overrides.<key>.url
    2. catalog default

  An explicit values entry — even `false` — wins over lower layers. A missing
  values entry inherits from the next layer down. Per-link override wins
  absolutely, including the ability to re-enable a link inside a disabled
  sub-family or family.
*/ -}}
{{- $catalog := .Files.Get "files/external-links.yaml" | fromYaml -}}
{{- $globalSet := hasKey .Values.externalLinks "enabled" -}}
{{- $global := .Values.externalLinks.enabled -}}
{{- $valFamilies := .Values.externalLinks.families | default dict -}}
{{- $overrides := .Values.externalLinks.overrides | default dict -}}
{{- $valMirrors := .Values.externalLinks.gitMirrors | default dict -}}
{{- $valSites := .Values.externalLinks.siteMirrors | default dict -}}

{{- $effective := dict -}}
{{- range $famName, $famDef := $catalog.families -}}
  {{- $valFam := index $valFamilies $famName | default dict -}}
  {{- $famSet := hasKey $valFam "enabled" -}}
  {{- $famVal := false -}}
  {{- if $famSet }}{{- $famVal = $valFam.enabled -}}{{- end -}}

  {{- /* Direct links under the family (no sub-family) */ -}}
  {{- if hasKey $famDef "links" -}}
    {{- range $key, $entry := $famDef.links -}}
      {{- $resolved := dict -}}
      {{- $enabled := true -}}
      {{- if hasKey $entry "enabled" }}{{- $enabled = $entry.enabled -}}{{- end -}}
      {{- if and $globalSet (eq $global false) }}{{- $enabled = false -}}{{- end -}}
      {{- if $famSet }}{{- $enabled = $famVal -}}{{- end -}}
      {{- if hasKey $overrides $key -}}
        {{- $ov := index $overrides $key -}}
        {{- if hasKey $ov "enabled" }}{{- $enabled = $ov.enabled -}}{{- end -}}
      {{- end -}}
      {{- $_ := set $resolved "enabled" $enabled -}}
      {{- if hasKey $entry "url" }}{{- $_ := set $resolved "url" $entry.url -}}{{- end -}}
      {{- if hasKey $overrides $key -}}
        {{- $ov := index $overrides $key -}}
        {{- if hasKey $ov "url" }}{{- $_ := set $resolved "url" $ov.url -}}{{- end -}}
      {{- end -}}
      {{- $_ := set $effective $key $resolved -}}
    {{- end -}}
  {{- end -}}

  {{- /* Sub-families */ -}}
  {{- if hasKey $famDef "sub-families" -}}
    {{- $valSubFams := index $valFam "sub-families" | default dict -}}
    {{- range $subName, $subDef := index $famDef "sub-families" -}}
      {{- $valSub := index $valSubFams $subName | default dict -}}
      {{- $subSet := hasKey $valSub "enabled" -}}
      {{- $subVal := false -}}
      {{- if $subSet }}{{- $subVal = $valSub.enabled -}}{{- end -}}

      {{- range $key, $entry := $subDef.links -}}
        {{- $resolved := dict -}}
        {{- $enabled := true -}}
        {{- if hasKey $entry "enabled" }}{{- $enabled = $entry.enabled -}}{{- end -}}
        {{- if and $globalSet (eq $global false) }}{{- $enabled = false -}}{{- end -}}
        {{- if $famSet }}{{- $enabled = $famVal -}}{{- end -}}
        {{- if $subSet }}{{- $enabled = $subVal -}}{{- end -}}
        {{- if hasKey $overrides $key -}}
          {{- $ov := index $overrides $key -}}
          {{- if hasKey $ov "enabled" }}{{- $enabled = $ov.enabled -}}{{- end -}}
        {{- end -}}
        {{- $_ := set $resolved "enabled" $enabled -}}
        {{- if hasKey $entry "url" }}{{- $_ := set $resolved "url" $entry.url -}}{{- end -}}
        {{- if hasKey $overrides $key -}}
          {{- $ov := index $overrides $key -}}
          {{- if hasKey $ov "url" }}{{- $_ := set $resolved "url" $ov.url -}}{{- end -}}
        {{- end -}}
        {{- $_ := set $effective $key $resolved -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- /*
  The search button is one of the catalog's links (`nav-search`), so the
  airgap-first default -- externalLinks.enabled: false -- hides it along with
  everything else. That is right while nothing answers a search, and wrong the
  moment something does: enabling search.enabled and getting no visible button
  is a feature that silently does not exist.

  So a deployment that runs the search service gets the button back, unless it
  said otherwise. A per-link override still wins in both directions: an
  operator who sets overrides.nav-search.enabled: false keeps it hidden.
*/ -}}
{{- if .Values.search.enabled -}}
  {{- $searchOverride := index $overrides "nav-search" | default dict -}}
  {{- if not (hasKey $searchOverride "enabled") -}}
    {{- $navSearch := index $effective "nav-search" | default dict -}}
    {{- $_ := set $navSearch "enabled" true -}}
    {{- $_ := set $effective "nav-search" $navSearch -}}
  {{- end -}}
{{- end -}}

{{- /*
  Resolve git-mirrors. Each entry in the catalog has a fixed `from` (the
  upstream URL prefix — never overridable) and a default `enabled`/`to`
  pair that values.yaml can override. Only mirrors with both
  `enabled: true` AND a non-empty `to` make it into the final map; anything
  else is dropped so the runtime handler skips it without a guard.
*/ -}}
{{- $mirrors := dict -}}
{{- $catalogMirrors := index $catalog "git-mirrors" | default dict -}}
{{- range $name, $entry := $catalogMirrors -}}
  {{- $enabled := $entry.enabled | default false -}}
  {{- $to := $entry.to | default "" -}}
  {{- $valMirror := index $valMirrors $name | default dict -}}
  {{- if hasKey $valMirror "enabled" }}{{- $enabled = $valMirror.enabled -}}{{- end -}}
  {{- if hasKey $valMirror "to" }}{{- $to = $valMirror.to -}}{{- end -}}
  {{- if and $enabled (ne $to "") -}}
    {{- $resolved := dict "from" $entry.from "to" $to -}}
    {{- $_ := set $mirrors $name $resolved -}}
  {{- end -}}
{{- end -}}
{{- /*
  Resolve site-mirrors: whole sites carried inside this image, rather than Git
  repositories mirrored elsewhere. Each catalog entry lists every URL prefix
  the upstream site is spelled with (the blog answers to four domains) and one
  local `to` path. Unlike git-mirrors these default to enabled, because the
  destination ships in the image rather than being infrastructure a deployment
  has to stand up first.
*/ -}}
{{- $sites := dict -}}
{{- $catalogSites := index $catalog "site-mirrors" | default dict -}}
{{- range $name, $entry := $catalogSites -}}
  {{- $enabled := $entry.enabled | default false -}}
  {{- $to := $entry.to | default "" -}}
  {{- $valSite := index $valSites $name | default dict -}}
  {{- if hasKey $valSite "enabled" }}{{- $enabled = $valSite.enabled -}}{{- end -}}
  {{- if hasKey $valSite "to" }}{{- $to = $valSite.to -}}{{- end -}}
  {{- if and $enabled (ne $to "") -}}
    {{- $_ := set $sites $name (dict "from" $entry.from "to" $to) -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis-docs.fullname" . }}-runtime
  labels:
    {{- include "redis-docs.labels" . | nindent 4 }}
data:
  runtime-config.js: |
    window.RUNTIME_CONFIG = {
      cli: {
        enabled: {{ .Values.cli.enabled }},
        url: "/cli-playground/"
      },
      aiServices: {
        litellm: {
          enabled: {{ .Values.aiServices.litellm.enabled }},
          url: "{{ .Values.aiServices.litellm.url }}",
          model: "{{ .Values.aiServices.litellm.model }}",
          apiKey: "{{ .Values.aiServices.litellm.apiKey }}"
        },
        binder: {
          url: "{{ .Values.aiServices.binder.url }}",
          jupyter: {
            enabled: {{ and .Values.cli.enabled .Values.cli.jupyter.enabled }},
            url: "/jupyter/"
          }
        }
      },
      downloads: {
        enabled: {{ if include "redis-docs.downloadsActive" . }}true{{ else }}false{{ end }}
      },
      externalLinks: {{ $effective | toJson }},
      gitMirrors: {{ $mirrors | toJson }},
      siteMirrors: {{ $sites | toJson }}
    };

    // Documentation downloads: the widget's markup ships in every page, but the
    // archives it links to are packed by an init container that only runs when
    // downloads are enabled and a canonical URL is set. When they are not, drop
    // the triggers — a button that 404s is worse than no button.
    //
    // Handled here rather than in the layout so the widget's own partials stay
    // byte-identical to upstream.
    (function () {
      var cfg = window.RUNTIME_CONFIG && window.RUNTIME_CONFIG.downloads;
      if (cfg && cfg.enabled) return;

      function removeTriggers() {
        var nodes = document.querySelectorAll('[data-open-download], #download-docs-dialog');
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].parentNode.removeChild(nodes[i]);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', removeTriggers);
      } else {
        removeTriggers();
      }
    })();

    // Git-mirror rewriting: rewrite inline <a href> links that target an
    // upstream public Git host (e.g. GitHub) to an internal mirror (e.g.
    // GitLab). Translates GitHub-shaped paths (/blob, /tree, /raw, ...)
    // to GitLab-shaped paths (/-/blob, /-/tree, ...) on the way out.
    //
    // Driven entirely by window.RUNTIME_CONFIG.gitMirrors (populated above
    // from values.externalLinks.gitMirrors). Each mirror entry that is
    // both enabled and has a non-empty `to` triggers a prefix match + path
    // rewrite. Entries are dropped at template time when either condition
    // is missing, so the runtime loop has no work to do for them.
    (function () {
      var mirrors = (window.RUNTIME_CONFIG && window.RUNTIME_CONFIG.gitMirrors) || {};
      var entries = Object.keys(mirrors).map(function (name) { return mirrors[name]; });
      if (entries.length === 0) return;

      // GitHub → GitLab path-family rename. The leading slash plus one of
      // these tokens (followed by `/` or end-of-string) gets `/-/` inserted
      // before it. Tokens cover the common file/tree views used in docs;
      // pull → merge_requests is intentionally omitted (different name AND
      // structure on GitLab — content links should never be PRs anyway).
      // GitHub `/wiki/` maps to GitLab `/-/wikis/` (plural — GitLab's
      // convention) so that one family is rewritten via the function
      // replacer below; all other families keep their original token.
      var pathRewrite = /^\/(blob|tree|raw|blame|commits|commit|tags|releases|wiki|issues)(\/|$)/;
      function pathRewriter(_match, family, sep) {
        return '/-/' + (family === 'wiki' ? 'wikis' : family) + sep;
      }

      // GitHub's per-tag release URL `/releases/tag/<X>` has no 1:1 path
      // equivalent on GitLab. Mapping to `/-/tags/<X>` is the safest
      // choice — it always resolves for any existing tag; `/-/releases/<X>`
      // only exists when a GitLab Release object was explicitly created.
      // Must run BEFORE pathRewrite, otherwise the general rule would
      // produce the broken `/-/releases/tag/<X>` (no `/tag/` segment in
      // GitLab's path layout — that's a GitHub-only artifact).
      var releasesTagRewrite = /^\/releases\/tag(\/|$)/;

      function translateHref(href) {
        // GitHub treats owner/repo case-insensitively (RediSearch/RediSearch
        // and redisearch/redisearch resolve to the same repo). Match the
        // catalog `from` prefix case-insensitively so a single entry covers
        // every variant; keep the original href for slicing so case in the
        // remaining path (refs, file paths) is preserved verbatim.
        var hrefLower = href.toLowerCase();
        for (var i = 0; i < entries.length; i++) {
          var m = entries[i];
          if (!m.from || !m.to) continue;
          var fromLower = m.from.toLowerCase();

          // Standard match: <from>/<family>/<ref>/<path> on the github.com host.
          if (hrefLower.indexOf(fromLower) === 0) {
            var rest = href.slice(m.from.length);
            rest = rest.replace(releasesTagRewrite, '/-/tags$1');
            rest = rest.replace(pathRewrite, pathRewriter);
            return m.to + rest;
          }

          // Raw-host match: GitHub serves file contents at a separate host
          // (raw.githubusercontent.com/<owner>/<repo>/<ref>/<path>) with no
          // `/raw/` token in the path — the host itself is the family marker.
          // Auto-derive the raw prefix from any `from` that targets github.com
          // and inject `/-/raw` between `to` and the ref+path so the result
          // lands on the GitLab raw URL (<project>/-/raw/<ref>/<path>).
          var rawFromLower = fromLower.replace(/^https:\/\/github\.com\//, 'https://raw.githubusercontent.com/');
          if (rawFromLower !== fromLower && hrefLower.indexOf(rawFromLower) === 0) {
            return m.to + '/-/raw' + href.slice(rawFromLower.length);
          }
        }
        return null;
      }

      function rewriteAll(root) {
        var anchors = (root || document).querySelectorAll('a[href]');
        for (var i = 0; i < anchors.length; i++) {
          var a = anchors[i];
          var newHref = translateHref(a.getAttribute('href'));
          if (newHref !== null) a.setAttribute('href', newHref);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { rewriteAll(); });
      } else {
        rewriteAll();
      }
    })();

    // Site mirroring: rewrite links to a site this image carries a copy of.
    //
    // Unlike the git-mirror handler above, nothing about the path is
    // translated -- the mirror publishes the same slugs the upstream site
    // does, so the prefix is swapped and the rest is left alone.
    //
    // Matching ignores the scheme and the case of the host, because the
    // documentation links the blog as http and https, and across four domains
    // (redis.io, redis.com, redislabs.com, and an /en/ locale prefix). Matching
    // only the canonical spelling would miss more than half of them.
    (function () {
      var sites = (window.RUNTIME_CONFIG && window.RUNTIME_CONFIG.siteMirrors) || {};
      var names = Object.keys(sites);
      if (names.length === 0) return;

      var SCHEME = /^https?:\/\//i;

      function prefixesOf(entry) {
        var from = entry.from || [];
        return typeof from === 'string' ? [from] : from;
      }

      // A prefix must end at a path boundary: `redis.io/blog` matches
      // `/blog/x` and `/blog`, and must not match `/blogging-guidelines`.
      function endsAtBoundary(rest) {
        return rest === '' || rest.charAt(0) === '/' || rest.charAt(0) === '#' || rest.charAt(0) === '?';
      }

      function translateHref(href) {
        if (!href) return null;
        var scheme = (href.match(SCHEME) || [''])[0];
        if (!scheme) return null;
        var bare = href.slice(scheme.length).toLowerCase();
        for (var i = 0; i < names.length; i++) {
          var entry = sites[names[i]];
          if (!entry || !entry.to) continue;
          var prefixes = prefixesOf(entry);
          for (var j = 0; j < prefixes.length; j++) {
            var prefix = String(prefixes[j]).replace(SCHEME, '').toLowerCase();
            if (!prefix || bare.indexOf(prefix) !== 0) continue;
            var rest = href.slice(scheme.length + prefix.length);
            if (!endsAtBoundary(rest)) continue;
            // Hugo publishes each page as a directory, so a link without a
            // trailing slash costs a redirect before the page is served.
            if (rest && rest.charAt(0) === '/' && rest.indexOf('#') === -1 &&
                rest.indexOf('?') === -1 && rest.charAt(rest.length - 1) !== '/') {
              rest += '/';
            }
            return entry.to + (rest || '/');
          }
        }
        return null;
      }

      function rewriteAll(root) {
        var anchors = (root || document).querySelectorAll('a[href]');
        for (var i = 0; i < anchors.length; i++) {
          var anchor = anchors[i];
          var updated = translateHref(anchor.getAttribute('href'));
          if (updated !== null) anchor.setAttribute('href', updated);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { rewriteAll(); });
      } else {
        rewriteAll();
      }
    })();
