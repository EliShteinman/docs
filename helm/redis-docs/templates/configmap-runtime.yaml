{{- /*
  Build the effective external-links map by composing three layers:
    1. Defaults from files/external-links.yaml (all `enabled: true` upstream)
    2. Global kill-switch: .Values.externalLinks.enabled — if false, force every
       link's enabled to false (URL is preserved so an override can re-enable).
    3. Per-link overrides: .Values.externalLinks.overrides.<key> — wins over
       both layers above. May set `enabled`, `url`, or both.
*/ -}}
{{- $defaults := .Files.Get "files/external-links.yaml" | fromYaml -}}
{{- $globalEnabled := .Values.externalLinks.enabled -}}
{{- $overrides := .Values.externalLinks.overrides | default dict -}}
{{- $effective := dict -}}
{{- range $key, $entry := $defaults.links -}}
  {{- $resolved := dict "enabled" $entry.enabled -}}
  {{- if hasKey $entry "url" -}}
    {{- $_ := set $resolved "url" $entry.url -}}
  {{- end -}}
  {{- if eq $globalEnabled false -}}
    {{- $_ := set $resolved "enabled" false -}}
  {{- end -}}
  {{- if hasKey $overrides $key -}}
    {{- $override := index $overrides $key -}}
    {{- if hasKey $override "enabled" -}}
      {{- $_ := set $resolved "enabled" $override.enabled -}}
    {{- end -}}
    {{- if hasKey $override "url" -}}
      {{- $_ := set $resolved "url" $override.url -}}
    {{- end -}}
  {{- end -}}
  {{- $_ := set $effective $key $resolved -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis-docs.fullname" . }}-runtime
  labels:
    {{- include "redis-docs.labels" . | nindent 4 }}
data:
  runtime-config.js: |
    window.RUNTIME_CONFIG = {
      aiServices: {
        litellm: {
          enabled: {{ .Values.aiServices.litellm.enabled }},
          url: "{{ .Values.aiServices.litellm.url }}",
          model: "{{ .Values.aiServices.litellm.model }}",
          apiKey: "{{ .Values.aiServices.litellm.apiKey }}"
        },
        binder: {
          url: "{{ .Values.aiServices.binder.url }}",
          jupyter: {
            enabled: {{ and .Values.cli.enabled .Values.cli.jupyter.enabled }},
            url: "/jupyter/"
          }
        }
      },
      externalLinks: {{ $effective | toJson }}
    };
