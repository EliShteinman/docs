{{- /*
  Resolve the effective external-links map by walking the hierarchical
  catalog (helm/redis-docs/files/external-links.yaml) and composing five
  layers of configuration:

  Precedence for `enabled` (highest wins):
    1. .Values.externalLinks.overrides.<key>.enabled
    2. .Values.externalLinks.families.<fam>.sub-families.<sub>.enabled
    3. .Values.externalLinks.families.<fam>.enabled
    4. .Values.externalLinks.enabled                 (master kill-switch)
    5. catalog default                               (per-link `enabled: true`)

  Resolution for `url`:
    1. .Values.externalLinks.overrides.<key>.url
    2. catalog default

  An explicit values entry — even `false` — wins over lower layers. A missing
  values entry inherits from the next layer down. Per-link override wins
  absolutely, including the ability to re-enable a link inside a disabled
  sub-family or family.

  The master kill-switch cuts links that leave the site. A link whose resolved
  url is a path on this site (`/blog/`) goes nowhere external, so the switch
  does not hide it; families and overrides still do.
*/ -}}
{{- $catalog := .Files.Get "files/external-links.yaml" | fromYaml -}}
{{- $globalSet := hasKey .Values.externalLinks "enabled" -}}
{{- $global := .Values.externalLinks.enabled -}}
{{- $valFamilies := .Values.externalLinks.families | default dict -}}
{{- $overrides := .Values.externalLinks.overrides | default dict -}}
{{- $valMirrors := .Values.externalLinks.gitMirrors | default dict -}}

{{- $effective := dict -}}
{{- range $famName, $famDef := $catalog.families -}}
  {{- $valFam := index $valFamilies $famName | default dict -}}
  {{- $famSet := hasKey $valFam "enabled" -}}
  {{- $famVal := false -}}
  {{- if $famSet }}{{- $famVal = $valFam.enabled -}}{{- end -}}

  {{- /* Direct links under the family (no sub-family) */ -}}
  {{- if hasKey $famDef "links" -}}
    {{- range $key, $entry := $famDef.links -}}
      {{- $resolved := dict -}}
      {{- if hasKey $entry "url" }}{{- $_ := set $resolved "url" $entry.url -}}{{- end -}}
      {{- if hasKey $overrides $key -}}
        {{- $ov := index $overrides $key -}}
        {{- if hasKey $ov "url" }}{{- $_ := set $resolved "url" $ov.url -}}{{- end -}}
      {{- end -}}
      {{- $enabled := true -}}
      {{- if hasKey $entry "enabled" }}{{- $enabled = $entry.enabled -}}{{- end -}}
      {{- if and $globalSet (eq $global false) (not (include "redis-docs.isSiteLink" $resolved.url)) }}{{- $enabled = false -}}{{- end -}}
      {{- if $famSet }}{{- $enabled = $famVal -}}{{- end -}}
      {{- if hasKey $overrides $key -}}
        {{- $ov := index $overrides $key -}}
        {{- if hasKey $ov "enabled" }}{{- $enabled = $ov.enabled -}}{{- end -}}
      {{- end -}}
      {{- $_ := set $resolved "enabled" $enabled -}}
      {{- $_ := set $effective $key $resolved -}}
    {{- end -}}
  {{- end -}}

  {{- /* Sub-families */ -}}
  {{- if hasKey $famDef "sub-families" -}}
    {{- $valSubFams := index $valFam "sub-families" | default dict -}}
    {{- range $subName, $subDef := index $famDef "sub-families" -}}
      {{- $valSub := index $valSubFams $subName | default dict -}}
      {{- $subSet := hasKey $valSub "enabled" -}}
      {{- $subVal := false -}}
      {{- if $subSet }}{{- $subVal = $valSub.enabled -}}{{- end -}}

      {{- range $key, $entry := $subDef.links -}}
        {{- $resolved := dict -}}
        {{- if hasKey $entry "url" }}{{- $_ := set $resolved "url" $entry.url -}}{{- end -}}
        {{- if hasKey $overrides $key -}}
          {{- $ov := index $overrides $key -}}
          {{- if hasKey $ov "url" }}{{- $_ := set $resolved "url" $ov.url -}}{{- end -}}
        {{- end -}}
        {{- $enabled := true -}}
        {{- if hasKey $entry "enabled" }}{{- $enabled = $entry.enabled -}}{{- end -}}
        {{- if and $globalSet (eq $global false) (not (include "redis-docs.isSiteLink" $resolved.url)) }}{{- $enabled = false -}}{{- end -}}
        {{- if $famSet }}{{- $enabled = $famVal -}}{{- end -}}
        {{- if $subSet }}{{- $enabled = $subVal -}}{{- end -}}
        {{- if hasKey $overrides $key -}}
          {{- $ov := index $overrides $key -}}
          {{- if hasKey $ov "enabled" }}{{- $enabled = $ov.enabled -}}{{- end -}}
        {{- end -}}
        {{- $_ := set $resolved "enabled" $enabled -}}
        {{- $_ := set $effective $key $resolved -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- /*
  The search button is one of the catalog's links (`nav-search`), so the
  airgap-first default -- externalLinks.enabled: false -- hides it along with
  everything else. That is right while nothing answers a search, and wrong the
  moment something does: enabling search.enabled and getting no visible button
  is a feature that silently does not exist.

  So a deployment that runs the search service gets the button back, unless it
  said otherwise. This lifts only the master kill-switch: an explicit entry at
  any layer above it -- overrides.nav-search, the header family, or its search
  sub-family -- still decides, false included.
*/ -}}
{{- if .Values.search.enabled -}}
  {{- $searchOverride := index $overrides "nav-search" | default dict -}}
  {{- $headerValues := index $valFamilies "header" | default dict -}}
  {{- $searchValues := index (index $headerValues "sub-families" | default dict) "search" | default dict -}}
  {{- $searchDecided := or (hasKey $searchOverride "enabled") (hasKey $headerValues "enabled") (hasKey $searchValues "enabled") -}}
  {{- if not $searchDecided -}}
    {{- $navSearch := index $effective "nav-search" | default dict -}}
    {{- $_ := set $navSearch "enabled" true -}}
    {{- $_ := set $effective "nav-search" $navSearch -}}
  {{- end -}}
{{- end -}}

{{- /*
  Resolve git-mirrors into the list files/git-mirrors.js reads. An entry comes
  from the catalog, from values, or both; values win field by field. Only
  entries with `enabled: true` and a `to` reach the browser. An entry that
  values add without a catalog `repo` fails the render instead of being
  silently ignored.
*/ -}}
{{- $mirrors := list -}}
{{- $catalogMirrors := index $catalog "git-mirrors" | default dict -}}
{{- $mirrorNames := concat (keys $catalogMirrors) (keys $valMirrors) | uniq | sortAlpha -}}
{{- range $name := $mirrorNames -}}
  {{- $entry := index $catalogMirrors $name | default dict -}}
  {{- $valMirror := index $valMirrors $name | default dict -}}
  {{- $enabled := $entry.enabled | default false -}}
  {{- $to := $entry.to | default "" -}}
  {{- $repo := $entry.repo | default "" -}}
  {{- $aliases := $entry.aliases | default list -}}
  {{- if hasKey $valMirror "enabled" }}{{- $enabled = $valMirror.enabled -}}{{- end -}}
  {{- if hasKey $valMirror "to" }}{{- $to = $valMirror.to -}}{{- end -}}
  {{- if hasKey $valMirror "repo" }}{{- $repo = $valMirror.repo -}}{{- end -}}
  {{- if hasKey $valMirror "aliases" }}{{- $aliases = $valMirror.aliases -}}{{- end -}}
  {{- if and $enabled (ne $to "") -}}
    {{- if eq $repo "" -}}
      {{- fail (printf "externalLinks.gitMirrors.%s is not in files/external-links.yaml: give it repo: <owner>/<name>" $name) -}}
    {{- end -}}
    {{- $repos := list -}}
    {{- range $r := prepend $aliases $repo -}}{{- $repos = append $repos (lower $r) -}}{{- end -}}
    {{- $mirrors = append $mirrors (dict "name" $name "repos" $repos "to" (trimSuffix "/" $to)) -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis-docs.fullname" . }}-runtime
  labels:
    {{- include "redis-docs.labels" . | nindent 4 }}
data:
  runtime-config.js: |
    window.RUNTIME_CONFIG = {
      cli: {
        enabled: {{ .Values.cli.enabled }},
        url: "/cli-playground/"
      },
      aiServices: {
        litellm: {
          enabled: {{ .Values.aiServices.litellm.enabled }},
          url: "{{ .Values.aiServices.litellm.url }}",
          model: "{{ .Values.aiServices.litellm.model }}",
          apiKey: "{{ .Values.aiServices.litellm.apiKey }}"
        },
        binder: {
          url: "{{ .Values.aiServices.binder.url }}"
        }
      },
      downloads: {
        enabled: {{ if include "redis-docs.downloadsActive" . }}true{{ else }}false{{ end }}
      },
      mirror: {
        enabled: {{ .Values.mirror.enabled }},
        paths: {{ splitList " " (include "redis-docs.mirrorPaths" .) | toJson }}
      },
      externalLinks: {{ $effective | toJson }},
      gitMirrors: {{ $mirrors | toJson }}
    };

    // Documentation downloads: the widget's markup ships in every page, but the
    // archives it links to are packed by an init container that only runs when
    // downloads are enabled and a canonical URL is set. When they are not, drop
    // the triggers — a button that 404s is worse than no button.
    //
    // Handled here rather than in the layout so the widget's own partials stay
    // byte-identical to upstream.
    (function () {
      var cfg = window.RUNTIME_CONFIG && window.RUNTIME_CONFIG.downloads;
      if (cfg && cfg.enabled) return;

      function removeTriggers() {
        var nodes = document.querySelectorAll('[data-open-download], #download-docs-dialog');
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].parentNode.removeChild(nodes[i]);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', removeTriggers);
      } else {
        removeTriggers();
      }
    })();

    // The workbench's "Leave feedback" form (redis-workbench-feedback.js) sends
    // only from redis.io and needs Cloudflare Turnstile, which it fetches from
    // challenges.cloudflare.com when the form opens. Here it can never send, so
    // its button is hidden and the form, with its outside request, never opens.
    // A style rule, because the button is added after the page loads; the
    // upstream script and partial stay byte-identical.
    (function () {
      var style = document.createElement('style');
      style.textContent = '.rwbf-open, .rwbf-sep { display: none !important; }';
      document.head.appendChild(style);
    })();

    // The mirrored sections — the blog, the tutorials, the customer stories —
    // are an image of their own, and a deployment may not have deployed it.
    // The header menu into them and the links the documentation makes into
    // them are baked into every page either way.
    //
    // With the mirror deployed there is nothing to do. Without it, those links
    // lead to a 404, so they are unlinked here: the words stay and the link
    // goes.
    (function () {
      var cfg = (window.RUNTIME_CONFIG && window.RUNTIME_CONFIG.mirror) || {};
      if (cfg.enabled) return;
      var paths = cfg.paths || [];
      if (paths.length === 0) return;

      function mirrored(href) {
        for (var i = 0; i < paths.length; i++) {
          if (href === '/' + paths[i] || href.indexOf('/' + paths[i] + '/') === 0) return true;
        }
        return false;
      }

      function unlink() {
        // The header menu leads nowhere at all without the mirror, so it
        // goes rather than being unlinked into a stray heading.
        var box = document.querySelector('[data-mirrored-sections-menu]');
        if (box && box.parentNode) box.parentNode.removeChild(box);

        var links = document.querySelectorAll('a[href^="/"]');
        for (var i = 0; i < links.length; i++) {
          var link = links[i];
          if (!mirrored(link.getAttribute('href') || '')) continue;
          var text = document.createTextNode(link.textContent);
          link.parentNode.replaceChild(text, link);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', unlink);
      } else {
        unlink();
      }
    })();

{{ .Files.Get "files/git-mirrors.js" | indent 4 }}
