{{- if and .Values.route.enabled .Values.route.tls.enabled .Values.tls.enabled .Values.tls.pfx.data (not .Values.tls.certificate) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "redis-docs.fullname" . }}-pfx-converter
  labels:
    {{- include "redis-docs.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "redis-docs.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "redis-docs.fullname" . }}-pfx-converter
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pfx-converter
          image: {{ include "redis-docs.pfxConverterImage" . }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: ROUTE_NAME
              value: {{ include "redis-docs.fullname" . | quote }}
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- if .Values.tls.pfx.password }}
            - name: PFX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "redis-docs.tlsSecretName" . }}
                  key: pfx-password
            {{- end }}
          command:
            - /bin/sh
            - -ce
            - |
              PFX_FILE="/tls/keystore.pfx"
              PASS_ARG="-passin pass:${PFX_PASSWORD:-}"

              LEGACY=""
              openssl version | grep -q "^OpenSSL 3" && LEGACY="-legacy"

              openssl pkcs12 -in "$PFX_FILE" -clcerts -nokeys $PASS_ARG $LEGACY 2>/dev/null | \
                sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' > /tmp/cert.pem

              openssl pkcs12 -in "$PFX_FILE" -nocerts -nodes $PASS_ARG $LEGACY 2>/dev/null | \
                sed -n '/-----BEGIN/,/-----END/p' > /tmp/key.pem

              openssl pkcs12 -in "$PFX_FILE" -cacerts -nokeys $PASS_ARG $LEGACY 2>/dev/null | \
                sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' > /tmp/ca.pem || true

              [ -s /tmp/cert.pem ] || { echo "ERROR: Failed to extract certificate from PFX"; exit 1; }
              [ -s /tmp/key.pem ] || { echo "ERROR: Failed to extract private key from PFX"; exit 1; }

              json_escape() {
                sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' | awk '{printf "%s\\n", $0}' | sed 's/\\n$//'
              }

              CERT_JSON=$(cat /tmp/cert.pem | json_escape)
              KEY_JSON=$(cat /tmp/key.pem | json_escape)

              PATCH="{\"spec\":{\"tls\":{\"certificate\":\"${CERT_JSON}\",\"key\":\"${KEY_JSON}\""

              if [ -s /tmp/ca.pem ]; then
                CA_JSON=$(cat /tmp/ca.pem | json_escape)
                PATCH="${PATCH},\"caCertificate\":\"${CA_JSON}\""
              fi

              PATCH="${PATCH}}}}"

              kubectl patch route "$ROUTE_NAME" -n "$NAMESPACE" --type=merge -p "$PATCH"
              echo "Route $ROUTE_NAME patched with PEM certificates converted from PFX"
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: {{ include "redis-docs.tlsSecretName" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Mi
{{- end }}
