replicaCount: 1

global:
  registry: ""

image:
  registry: a0533057932
  name: redis-docs
  tag: unprivileged
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

containerPort: 8080

tls:
  enabled: false
  # Use an existing Kubernetes TLS secret instead of creating one
  existingSecret: ""
  # PEM format certificates (paste the text block as-is)
  certificate: ""
  privateKey: ""
  caCertificate: ""
  # Enable TLS termination at nginx level (passthrough mode)
  # When false, TLS terminates at ingress/route level
  nginxTermination: false
  httpsPort: 8443

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: redis-docs.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

route:
  enabled: false
  annotations: {}
  host: ""
  path: /
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

nginx:
  workerConnections: 2048
  keepaliveTimeout: 15

resources:
  requests:
    cpu: 250m
    memory: 256Mi
    ephemeral-storage: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
    ephemeral-storage: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

metrics:
  enabled: false
  image:
    registry: quay.io/martinhelmich
    name: prometheus-nginxlog-exporter
    tag: "v1.11.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
  route:
    enabled: false
    annotations: {}
    host: ""
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

cli:
  enabled: false
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  image:
    registry: a0533057932
    name: redis-docs-cli
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  redis:
    image:
      registry: docker.io
      name: redis
      tag: "8-alpine"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  jupyter:
    enabled: false
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    image:
      registry: quay.io
      name: jupyter/minimal-notebook
      tag: "2026-04-02"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

aiServices:
  litellm:
    enabled: false
    # URL of your LiteLLM / OpenAI-compatible endpoint
    url: "http://litellm.default.svc.cluster.local:4000/v1/chat/completions"
    model: "gpt-3.5-turbo"
    # API key managed server-side - user won't be asked for one
    apiKey: ""
  binder:
    # BinderHub / JupyterHub URL for interactive notebooks
    url: "https://redis.io/binder/"

# -- External links shown across the docs site (home page cards, top header
#    nav, dropdown menus). The full default list with descriptions and
#    upstream URLs lives in `files/external-links.yaml` inside the chart;
#    this section is for per-deployment customization only.
#
#    Precedence (highest wins):
#      1. overrides.<key>           — re-enable / disable / replace URL of a single link
#      2. enabled (global)          — kill-switch for the whole set
#      3. files/external-links.yaml — chart defaults (all `enabled: true`)
#
#    Default below is `enabled: false` (airgap-first): every external link is
#    hidden unless you explicitly opt in, either by flipping `enabled: true`
#    here or by re-enabling specific keys via `overrides`.
externalLinks:
  enabled: false
  overrides: {}
  # Examples:
  #   overrides:
  #     tutorials:
  #       enabled: true                                        # opt this one back in
  #     github:
  #       enabled: true
  #       url: "https://gitlab.internal.company.com/redis-docs"  # also replace the URL
  #     nav-search:
  #       enabled: false                                       # explicitly keep hidden
  #
  # See `helm/redis-docs/files/external-links.yaml` for the full list of keys
  # and their default URLs.

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

nodeSelector: {}

tolerations: []

affinity: {}
