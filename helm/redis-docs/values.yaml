replicaCount: 1

# -- Canonical public URL of this deployment (e.g. "https://docs.intranet.example.com").
# Used at HTTP response time by nginx sub_filter to replace `__DOCS_BASE_URL__`
# placeholders inside .md and .json outputs, so AI / RAG consumers that ingest
# the markdown directly receive fully-qualified links.
#
# Leave empty (default) to auto-detect from the request's Host header — useful
# when the same image is exposed at multiple internal hostnames; each request
# gets links for the host it came in through.
#
# Set to a fixed URL when you want every consumer to see the same canonical
# host regardless of how the request reached the pod.
canonicalURL: ""

global:
  registry: ""

image:
  registry: a0533057932
  name: redis-docs
  tag: unprivileged
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

containerPort: 8080

tls:
  enabled: false
  # Use an existing Kubernetes TLS secret instead of creating one
  existingSecret: ""
  # PEM format certificates (paste the text block as-is)
  certificate: ""
  privateKey: ""
  caCertificate: ""
  # Enable TLS termination at nginx level (passthrough mode)
  # When false, TLS terminates at ingress/route level
  nginxTermination: false
  httpsPort: 8443

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: redis-docs.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

route:
  enabled: false
  annotations: {}
  host: ""
  path: /
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

nginx:
  workerConnections: 2048
  keepaliveTimeout: 15

# How long a rollout may take before Kubernetes marks it failed. Kubernetes
# defaults to 600; packing the html download bundles can outrun that on a
# throttled node, which fails the rollout even though the pod is still working.
# Empty leaves the Kubernetes default — set it only if you keep html enabled.
progressDeadlineSeconds: 1800

# Documentation download bundles: the "Download documentation" widget offers each
# product as a .tar.gz in Markdown, HTML, or JSON.
#
# The archives are packed by an init container at pod start rather than baked
# into the image, because their contents carry this deployment's own base URL —
# known to Helm, not to the image build. They land in an emptyDir, so they cost
# ephemeral storage per pod and are rebuilt on every restart.
#
# Disabling this hides the widget instead of leaving a button that 404s.
downloads:
  enabled: true

  # Format ids from data/doc_bundles.json. `html` is the offline-browsable copy
  # and is ~89% of both the size and the packing time; drop it to trade the
  # offline site for a much smaller, much faster build:
  #   formats: "md,md-single,json"   # ~30 MB, seconds
  formats: "md,md-single,json,html"

  # Named in each bundle's README as where the documentation source lives.
  # Empty omits the line — an airgapped reader cannot reach github.com. Point it
  # at an internal mirror to give them something that resolves.
  sourceURL: ""

  # Packing is CPU-bound and one-off. Left empty it inherits `resources` below,
  # where the 1-core limit makes the html format take minutes.
  #
  # Raise `limits.cpu` here to speed packing up, and leave `requests.cpu` alone.
  # Kubernetes sets a pod's request to max(init containers, sum(containers)), so
  # a request set here inflates the whole pod's request for its entire life --
  # long after this container has exited -- and a rolling update then needs that
  # much twice over. A limit costs nothing until the container actually runs.
  #
  #   resources:
  #     limits:
  #       cpu: "4"
  resources: {}

# ephemeral-storage must hold the packed bundles (see `downloads` above): all
# four formats need roughly 300Mi, plus headroom for nginx's cache and logs.
# Dropping the html format, or downloads.enabled=false, frees ~250Mi of it.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
    ephemeral-storage: 512Mi
  limits:
    cpu: "1"
    memory: 512Mi
    ephemeral-storage: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

metrics:
  enabled: false
  image:
    registry: quay.io/martinhelmich
    name: prometheus-nginxlog-exporter
    tag: "v1.11.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
  route:
    enabled: false
    annotations: {}
    host: ""
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

cli:
  enabled: false
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  # The airgap-build workflow bumps this tag whenever helm/cli-proxy changes,
  # and search.image.tag with it: search runs from the same image.
  image:
    registry: a0533057932
    name: redis-docs-cli
    tag: "0.6.0"
    pullPolicy: IfNotPresent
  # How long a browser session lives in the proxy. A session holds a Redis
  # connection of its own so transactions survive between typed commands, so
  # these are what keep that from growing without limit.
  session:
    idleTtlSeconds: 1800
    max: 500
    sweepIntervalSeconds: 60
  # Each session gets its own slice of the shared keyspace: commands go out
  # under a per-session prefix and replies come back without it, so two readers
  # working through the same tutorial do not overwrite each other's keys.
  # Turning this off puts every reader back in one flat keyspace.
  namespace:
    enabled: true
    # Redis filters SCAN's MATCH after walking the table, so a small COUNT over
    # a large keyspace returns an empty page and the reader sees no keys at all.
    # Every scan is raised to at least this.
    scanMinCount: 10000
    # Delete a session's keys and indexes when it is reclaimed. Off leaves them
    # for whatever eviction policy the sidecar Redis has, which is none.
    cleanup:
      enabled: true
      batch: 500
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  redis:
    image:
      registry: docker.io
      name: redis
      tag: "8.10.0-alpine"
      pullPolicy: IfNotPresent
    # Runs every command a reader types as a restricted user, so the shared
    # sandbox survives someone typing FLUSHALL. The rules and the reasoning are
    # in files/sandbox.acl. Turning this off puts the proxy back on the default
    # user, with nothing between the browser and the whole keyspace.
    acl:
      enabled: true
      username: docsandbox
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  jupyter:
    enabled: false
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    image:
      registry: quay.io
      name: jupyter/minimal-notebook
      tag: "2026-04-02"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# -- Docs search. search-modal.html calls /convai/api/search-service, a service
#    that runs at redis.io; without something answering it here the search
#    button opens an empty modal. Turning this on deploys that answer: an index
#    of the site built from the docs.ndjson feed the image already ships, held
#    in a Redis of its own, and an nginx route to reach it. The search UI itself
#    needs no configuration — it is upstream markup and is left untouched.
#
#    Off by default, like `cli` above: it is another pod, and a deployment that
#    does not want it should not pay for it.
search:
  enabled: false
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  # The CLI proxy image. The search service ships inside it rather than in one
  # of its own, so there is no third image to build, mirror and carry in.
  # Always the same tag as cli.image.tag. A tag older than 0.6.0 has no
  # `search` module and the pod crash-loops.
  #
  # IfNotPresent is safe because the tag is pinned. Moving it back to the
  # mutable `latest` needs pullPolicy: Always with it, or a node that cached
  # `latest` before the search service existed keeps serving that copy.
  image:
    registry: a0533057932
    name: redis-docs-cli
    tag: "0.6.0"
    pullPolicy: IfNotPresent
  logLevel: INFO
  # gunicorn threads. A search is one round trip to a Redis in the same pod,
  # and the modal fires a request per keystroke, so this is about concurrent
  # readers rather than slow work.
  threads: 8
  index:
    name: docs
    # hierarchy[0] on every result, and the heading the modal groups results
    # under. redis.io sends the docs home page's heading, which is not the Hugo
    # site title, so it cannot be derived from the feed.
    rootCrumb: "Welcome to Redis Docs"
    # redis.io returns at most 30 hits and reports the full count separately.
    resultLimit: 30
    batch: 500
    # How much of its relevance a page from an older documentation version
    # keeps. The docs publish the same page once per version and 45% of a real
    # index is those copies, so without this they crowd out the current page:
    # measured on a full build, "rack zone awareness" answered with version
    # 7.22 first and "database" returned 27 versioned pages in a top 30. At 0.3
    # both answer with the current page and the old ones stay findable below
    # it. Raise it toward 1 to treat every version equally.
    versionWeight: 0.3
    # Index attempts before the pod gives up. The API container and its Redis
    # start together, so the first attempt often lands before Redis is
    # listening.
    attempts: 30
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  redis:
    image:
      registry: docker.io
      name: redis
      tag: "8.10.0-alpine"
      pullPolicy: IfNotPresent
    # Holds the whole index in memory. Measured at 141 MB resident after
    # indexing the full text of the 7,339 pages a full build produces
    # (5,674 documentation pages plus the mirrored sections); the indexer
    # itself peaked at 104 MB of the API container's 512Mi. A deployment that
    # adds more sources should raise it.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

aiServices:
  litellm:
    enabled: false
    # URL of your LiteLLM / OpenAI-compatible endpoint
    url: "http://litellm.default.svc.cluster.local:4000/v1/chat/completions"
    model: "gpt-3.5-turbo"
    # API key managed server-side - user won't be asked for one
    apiKey: ""
  binder:
    # BinderHub / JupyterHub URL for interactive notebooks
    url: "https://redis.io/binder/"

# -- External links shown across the docs site (home page cards, top header
#    nav, dropdown menus, footer). The full hierarchical catalog lives in
#    `files/external-links.yaml` inside the chart and groups every link into
#    a family (e.g. `home`, `header`, `footer`) and optionally a sub-family
#    (e.g. `header.cta`, `header.main-nav`). This section is for
#    per-deployment customization only.
#
#    Precedence for `enabled` (highest wins):
#      1. overrides.<key>.enabled                          — single link
#      2. families.<fam>.sub-families.<sub>.enabled        — sub-family
#      3. families.<fam>.enabled                           — family
#      4. enabled (master kill-switch)                     — whole set
#      5. catalog default in files/external-links.yaml     — always true
#
#    `url` resolution: catalog default unless overrides.<key>.url is set.
#
#    Default below is `enabled: false` (airgap-first): every external link
#    is hidden unless you explicitly opt back in at one of the layers above.
externalLinks:
  enabled: false

  # families: re-enable a whole family or sub-family at once. Leave a key
  # unset to inherit from the layer above (master kill-switch).
  families: {}
  # Example: re-enable just the home-page links and only the main-nav strip
  # of the top header (Redis for AI / Docs / Pricing), leave the rest off.
  #   families:
  #     home:
  #       enabled: true
  #     header:
  #       sub-families:
  #         main-nav:
  #           enabled: true

  # overrides: per-link tweaks. Wins over every layer above. Use to
  # re-enable a specific link inside a disabled family, replace its URL
  # with an internal mirror, or explicitly disable a link that would
  # otherwise be on.
  overrides: {}
  # Examples:
  #   overrides:
  #     university:
  #       enabled: true
  #     github:
  #       enabled: true
  #       url: "https://gitlab.internal.company.com/redis-docs"
  #     nav-search:
  #       enabled: false
  #
  # See `helm/redis-docs/files/external-links.yaml` for the full list of
  # keys, their families/sub-families, and default URLs.

  # gitMirrors: redirect inline `<a href>` links inside docs content
  # (rendered from markdown) to internal Git mirrors. Catalog of available
  # mirrors and the upstream URLs they target lives at
  # `files/external-links.yaml` under `git-mirrors`.
  #
  # For each mirror name, set:
  #   enabled: true                   (default false — leave OFF means: keep the original GitHub link)
  #   to: <full mirror project URL>   (empty by default; required when enabled)
  #
  # The `to` URL is treated as an opaque prefix and may include nested
  # GitLab groups, e.g.
  #   "https://gitlab.example.com/group/subgroup/redis-observability"
  # The runtime handler translates GitHub paths (`/blob/<ref>/<path>`,
  # `/tree/<ref>/<path>`, `/raw`, `/blame`, `/commits`, `/commit`, `/tags`,
  # `/releases`, `/wiki`, `/issues`) to their GitLab equivalents
  # (`/-/blob/...`, `/-/tree/...`, etc.) automatically — you only provide
  # the project URL. GitHub's per-tag release URL `/releases/tag/<X>` is
  # mapped to GitLab's `/-/tags/<X>` (the closest 1:1 — `/-/releases/<X>`
  # only exists if a GitLab Release object was explicitly created).
  #
  # Activation is purely Helm-driven: changing values here regenerates the
  # runtime ConfigMap (`runtime-config.js`) and triggers a rolling restart
  # via the `checksum/runtime-config` annotation on the deployment. No image
  # rebuild is required.
  gitMirrors: {}
  # Example: redirect inline `<a href>` links pointing to upstream
  # GitHub repos to an internal GitLab mirror. `to` may include nested
  # GitLab groups — it is treated as an opaque prefix.
  #   gitMirrors:
  #     observability:
  #       enabled: true
  #       to: "https://gitlab.internal.company.com/redis/observability/redis-enterprise-observability"
  #     k8s-docs:
  #       enabled: true
  #       to: "https://gitlab.internal.company.com/redis/k8s/redis-enterprise-k8s-docs"

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

nodeSelector: {}

tolerations: []

affinity: {}
