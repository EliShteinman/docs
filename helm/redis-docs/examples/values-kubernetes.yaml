# =============================================================================
# Redis Docs — Kubernetes Ingress deployment with metrics
# =============================================================================
#
# Installation:
#   helm install redis-docs ./helm/redis-docs -f helm/redis-docs/examples/values-kubernetes.yaml
#
# Before using, replace the following:
#   docs.company.internal  → your ingress hostname
#
# =============================================================================

replicaCount: 1

image:
  registry: a0533057932
  name: redis-docs
  tag: unprivileged

ingress:
  enabled: true
  hosts:
    - host: docs.company.internal
      paths:
        - path: /
          pathType: Prefix

metrics:
  enabled: true
