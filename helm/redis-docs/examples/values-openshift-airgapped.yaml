# =============================================================================
# Redis Docs — OpenShift air-gapped deployment with metrics
# =============================================================================
#
# Installation:
#   helm install redis-docs ./helm/redis-docs -f helm/redis-docs/examples/values-openshift-airgapped.yaml
#
# Before using, replace the following:
#   registry.internal.company.com  → your private registry address
#   79955fdb5-unprivileged         → your Docker image tag
#   regcred                        → your image pull secret name
#   gitlab.internal.company.com    → your internal Git URL
#   support.internal.company.com   → your internal support URL
#
# =============================================================================

replicaCount: 1

global:
  registry: registry.internal.company.com

imagePullSecrets:
  - name: regcred

image:
  name: redis-docs
  tag: "79955fdb5-unprivileged"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Automatic hostname + automatic TLS certificate from OpenShift
route:
  enabled: true
  tls:
    enabled: true
    termination: edge

metrics:
  enabled: true
  image:
    name: prometheus-nginxlog-exporter
    tag: "v1.11.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
  route:
    enabled: true

externalLinks:
  github:
    url: "https://gitlab.internal.company.com/infra/redis-docs"
  support:
    url: "https://support.internal.company.com"
  sandbox:
    enabled: false
  tutorials:
    enabled: false
  university:
    enabled: false
  blog:
    enabled: false
  chatbot:
    enabled: false
