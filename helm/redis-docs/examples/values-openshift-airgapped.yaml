# =============================================================================
# Redis Docs — OpenShift air-gapped deployment with metrics
# =============================================================================
#
# Installation:
#   helm install redis-docs ./helm/redis-docs -f helm/redis-docs/examples/values-openshift-airgapped.yaml
#
# Before using, replace the following:
#   registry.internal.company.com  → your private registry address
#   4dfba535c-unprivileged         → your Docker image tag
#   regcred                        → your image pull secret name
#   docs.intranet.company.com      → the public hostname of this deployment
#   gitlab.internal.company.com    → your internal Git URL
#   support.internal.company.com   → your internal support URL
#
# =============================================================================

replicaCount: 1

global:
  registry: registry.internal.company.com

imagePullSecrets:
  - name: regcred

image:
  name: redis-docs
  tag: "4dfba535c-unprivileged"
  pullPolicy: IfNotPresent

# ephemeral-storage has to hold the packed download bundles (see `downloads`
# below). Overriding `resources` without it silently drops the chart's own
# headroom and the pod can be evicted mid-pack.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
    ephemeral-storage: 512Mi
  limits:
    cpu: "1"
    memory: 512Mi
    ephemeral-storage: 1Gi

# Documentation download bundles, packed at pod start so every archive carries
# the canonicalURL set below. Needs canonicalURL; without it packing is skipped
# and the download button is removed from the page.
downloads:
  enabled: true
  # Dropping html takes the packed set from ~280 MB to ~30 MB and the pack from
  # minutes to seconds. Then ephemeral-storage above can go back to 128Mi/256Mi.
  formats: "md,md-single,json,html"
  # Named in each bundle's README. Empty omits the line rather than pointing an
  # airgapped reader at github.com.
  sourceURL: "https://gitlab.internal.company.com/redis-docs"
  # Packing is CPU-bound and one-off. Only the limit is raised: a pod's request
  # is max(init containers, sum(containers)), so a request here would inflate the
  # pod for its whole life and a rolling update would need it twice at once --
  # enough to exceed a namespace CPU quota and leave the new pod unschedulable.
  resources:
    limits:
      cpu: "2"
      memory: 1Gi
      ephemeral-storage: 1Gi

# Automatic hostname + automatic TLS certificate from OpenShift
route:
  enabled: true
  tls:
    enabled: true
    termination: edge

metrics:
  enabled: true
  image:
    name: prometheus-nginxlog-exporter
    tag: "v1.11.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
  route:
    enabled: true

# Canonical public URL of this deployment.
#
# Used at HTTP response time by nginx sub_filter to replace `__DOCS_BASE_URL__`
# placeholders in .md and .json outputs (the AI / RAG-facing formats), so
# consumers that ingest the markdown without HTML context still see
# fully-qualified links pointing at the right host.
#
# Leave empty (or comment out the line) to auto-detect from the request's
# Host header — useful when the same image is exposed at multiple hostnames.
canonicalURL: "https://docs.intranet.company.com"

# External links — controlled by a five-layer hierarchy:
#   overrides.<key>  →  families.<fam>.sub-families.<sub>  →  families.<fam>
#   →  externalLinks.enabled  →  catalog default (always true)
# Per-link override wins absolutely; an explicit value at any level beats
# its parents. The full link catalog ships at files/external-links.yaml.
externalLinks:
  enabled: false               # master kill-switch on (airgap default)

  # Uncomment to re-enable whole groups of links at once. Anything not
  # explicitly enabled here stays hidden by the master kill-switch above.
  #
  # families:
  #   home:
  #     enabled: true          # restore the home-page cards
  #   header:
  #     sub-families:
  #       main-nav:
  #         enabled: true      # restore the Redis-for-AI / Docs / Pricing strip
  #   footer:
  #     sub-families:
  #       legal:
  #         enabled: true      # restore Trust / Privacy / Terms / Legal notices

  # Per-link tweaks. Use to re-enable a single link inside a hidden family
  # or replace its target with an internal mirror. Wins over every layer
  # above it.
  overrides:
    github:
      enabled: true
      url: "https://gitlab.internal.company.com/infra/redis-docs"
    support:
      enabled: true
      url: "https://support.internal.company.com"

  # gitMirrors: redirect inline `<a href>` links from upstream public
  # GitHub repos to internal GitLab mirrors. The handler translates GitHub
  # `/blob`, `/tree`, ... paths to GitLab `/-/blob`, `/-/tree` automatically
  # — provide the full project URL only (nested groups are handled
  # transparently). `observability` covers the Prometheus/Grafana docs;
  # `k8s-docs` covers the Kubernetes/OpenShift install + upgrade docs.
  gitMirrors:
    observability:
      enabled: true
      to: "https://gitlab.internal.company.com/redis/observability/redis-enterprise-observability"
    k8s-docs:
      enabled: true
      to: "https://gitlab.internal.company.com/redis/k8s/redis-enterprise-k8s-docs"

# --- CLI playground (optional) ---
# An in-page Redis terminal and workbench, served by a second pod holding the
# proxy and a Redis sidecar. Off by default; everything below is the default
# once it is on, and is shown so the isolation is visible rather than implied.
cli:
  enabled: true
  image:
    registry: registry.intranet.company.com
    name: redis-docs-cli
    tag: "0.4.0"          # not `latest`: IfNotPresent will not re-pull a moved tag
  redis:
    image:
      registry: registry.intranet.company.com
      name: redis
      tag: "8.10.0-alpine"
    # Runs every command a reader types as a restricted user. Turning this off
    # leaves nothing between a typed FLUSHALL and every other visitor's data.
    acl:
      enabled: true
      username: docsandbox
  # Each session gets its own slice of the shared keyspace, so two readers
  # working through the same tutorial do not overwrite each other's keys.
  namespace:
    enabled: true
    scanMinCount: 10000
    cleanup:
      enabled: true
      batch: 500
  session:
    idleTtlSeconds: 1800
    max: 500
    sweepIntervalSeconds: 60
  # Jupyter kernel server for the notebook examples. Needs a BinderHub or
  # JupyterHub reachable from the cluster; see aiServices.binder.
  jupyter:
    enabled: false
