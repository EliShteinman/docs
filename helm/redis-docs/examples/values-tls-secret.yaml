# =============================================================================
# Redis Docs — TLS with existing Kubernetes Secret (OpenShift)
# =============================================================================
#
# Installation:
#   helm install redis-docs ./helm/redis-docs -f helm/redis-docs/examples/values-tls-secret.yaml
#
# Before using, replace the following:
#   my-tls-secret          → your Secret name (must contain tls.crt and tls.key)
#   docs.apps.example.com  → your Route hostname
#
# =============================================================================

tls:
  enabled: true
  existingSecret: "my-tls-secret"

route:
  enabled: true
  host: docs.apps.example.com
