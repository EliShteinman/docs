# =============================================================================
# Redis Docs — TLS with existing Kubernetes Secret (OpenShift)
# =============================================================================
# Usage:
#   helm install redis-docs redis-docs-0.11.0.tgz -f values-tls-secret.yaml
#
# The Secret must contain tls.crt and tls.key (type: kubernetes.io/tls).
# =============================================================================

tls:
  enabled: true
  existingSecret: "my-tls-secret"

route:
  enabled: true
  host: docs.apps.example.com
