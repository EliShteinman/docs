# External links — built-in catalog
#
# This file ships with the chart and contains every external link rendered by
# the docs site, organized into FAMILIES and SUB-FAMILIES.
#
# Hierarchy:
#   families:
#     <family-name>:
#       description: <human-readable purpose of the family>
#       enabled: true            # catalog default for the whole family
#       links: { ... }           # links that belong directly to the family
#       sub-families:            # OR group links into sub-families
#         <sub-family-name>:
#           description: <...>
#           enabled: true
#           links:
#             <key>:
#               description: <where this link lives in the UI>
#               url: <upstream URL>
#               enabled: true
#
# Per-deployment customization is done from values.yaml under externalLinks.
# DO NOT edit this file to customize a deployment — it is the upstream
# reference shipped with the chart.
#
# Precedence (highest wins) — the resolved `enabled` for each link is:
#   1. values.externalLinks.overrides.<key>.enabled
#   2. values.externalLinks.families.<fam>.sub-families.<sub>.enabled
#   3. values.externalLinks.families.<fam>.enabled
#   4. values.externalLinks.enabled                              (master kill-switch)
#   5. catalog default below                                      (always true)
#
# `url` resolution is simpler: catalog default unless overrides.<key>.url
# replaces it.
#
# Each `<key>` here corresponds to a `data-external-link="<key>"` attribute
# in the HTML layouts. The runtime JS reads window.RUNTIME_CONFIG
# .externalLinks[<key>] and either updates the element's href (if `url`)
# or hides it (if `enabled` is false).

