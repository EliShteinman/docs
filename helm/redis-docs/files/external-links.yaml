# External links — built-in catalog
#
# This file ships with the chart and contains every external link rendered by
# the docs site, organized into FAMILIES and SUB-FAMILIES.
#
# Hierarchy:
#   families:
#     <family-name>:
#       description: <human-readable purpose of the family>
#       enabled: true            # catalog default for the whole family
#       links: { ... }           # links that belong directly to the family
#       sub-families:            # OR group links into sub-families
#         <sub-family-name>:
#           description: <...>
#           enabled: true
#           links:
#             <key>:
#               description: <where this link lives in the UI>
#               url: <upstream URL>
#               enabled: true
#
# Per-deployment customization is done from values.yaml under externalLinks.
# DO NOT edit this file to customize a deployment — it is the upstream
# reference shipped with the chart.
#
# Precedence (highest wins) — the resolved `enabled` for each link is:
#   1. values.externalLinks.overrides.<key>.enabled
#   2. values.externalLinks.families.<fam>.sub-families.<sub>.enabled
#   3. values.externalLinks.families.<fam>.enabled
#   4. values.externalLinks.enabled                              (master kill-switch)
#   5. catalog default below                                      (always true)
#
# `url` resolution is simpler: catalog default unless overrides.<key>.url
# replaces it.
#
# Each `<key>` here corresponds to a `data-external-link="<key>"` attribute
# in the HTML layouts. The runtime JS reads window.RUNTIME_CONFIG
# .externalLinks[<key>] and either updates the element's href (if `url`)
# or hides it (if `enabled` is false).

families:

  # ───────────────────────────────────────────────────────────────────────
  # home — external links inside the home page body (layouts/home.html)
  # ───────────────────────────────────────────────────────────────────────
  home:
    description: "External cards, CTAs, and footer-of-content links on the home page body"
    enabled: true
    links:
      sandbox:
        description: "Home page: 'Try Redis Sandbox' link in the Get Redis tools card"
        url: "https://redis.io/try/sandbox/"
        enabled: true
      tutorials:
        description: "Home page: 'Tutorials' card in Explore additional resources"
        url: "https://redis.io/tutorials/"
        enabled: true
      university:
        description: "Home page: 'Redis University' card"
        url: "https://university.redis.io/academy"
        enabled: true
      blog:
        description: "Home page: 'Blog' card"
        url: "https://redis.io/blog/"
        enabled: true
      support:
        description: "Home page: 'Redis Knowledge Base' card"
        url: "https://support.redislabs.com/hc/en-us"
        enabled: true
      github:
        description: "Home page: 'Contribute on GitHub — View repository' link"
        url: "https://github.com/redis/docs/"
        enabled: true
      chatbot:
        description: "Home page: 'Improve our AI chatbot — Try the chatbot' link"
        url: "https://redis.io/chat"
        enabled: true

  # ───────────────────────────────────────────────────────────────────────
  # header — top sticky header (layouts/partials/header.html), present on every page
  # ───────────────────────────────────────────────────────────────────────
  header:
    description: "Top sticky header bar present on every page"
    enabled: true
    sub-families:

      main-nav:
        description: "Primary nav buttons in the top bar (Redis for AI, Docs, Pricing)"
        enabled: true
        links:
          nav-redis-for-ai:
            description: "Top header: 'Redis for AI' button (with star animation)"
            url: "https://redis.io/redis-for-ai/"
            enabled: true
          nav-docs:
            description: "Top header: 'Docs' link (points to redis.io/docs/ — redundant in airgap since this site IS the docs)"
            url: "https://redis.io/docs/"
            enabled: true
          nav-pricing:
            description: "Top header: 'Pricing' link"
            url: "https://redis.io/pricing/"
            enabled: true

      cta:
        description: "Right-side call-to-action buttons (Login, Book a meeting, Try Redis)"
        enabled: true
        links:
          nav-login:
            description: "Top header: 'Login' button (Redis Cloud login)"
            url: "https://cloud.redis.io/"
            enabled: true
          nav-meeting:
            description: "Top header: 'Book a meeting' link"
            url: "https://redis.io/meeting/"
            enabled: true
          nav-try-redis:
            description: "Top header: 'Try Redis' red CTA button"
            url: "https://redis.io/try-free/"
            enabled: true

      search:
        description: "Top header: search button (the search backend is not deployed in airgap mode — clicking the button opens an empty modal)"
        enabled: true
        links:
          nav-search:
            description: "Search button (desktop and mobile share the same key)"
            enabled: true

      products-dropdown:
        description: "Products ▼ dropdown trigger and menu in the top header"
        enabled: true
        links:
          nav-products-dropdown:
            description: "The Products dropdown wrapper (hides the trigger and the menu together)"
            enabled: true

      resources-dropdown:
        description: "Resources ▼ dropdown trigger and menu in the top header"
        enabled: true
        links:
          nav-resources-dropdown:
            description: "The Resources dropdown wrapper (hides the trigger and the menu together)"
            enabled: true

      mobile:
        description: "Mobile-only header elements (hamburger button + slide-down nav drawer)"
        enabled: true
        links:
          nav-mobile-menu:
            description: "Mobile hamburger button + the entire <nav> drawer it opens"
            enabled: true
