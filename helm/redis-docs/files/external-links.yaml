# External links — built-in catalog
#
# This file ships with the chart and contains every external link rendered by
# the docs site, organized into FAMILIES and SUB-FAMILIES.
#
# Hierarchy:
#   families:
#     <family-name>:
#       description: <human-readable purpose of the family>
#       enabled: true            # catalog default for the whole family
#       links: { ... }           # links that belong directly to the family
#       sub-families:            # OR group links into sub-families
#         <sub-family-name>:
#           description: <...>
#           enabled: true
#           links:
#             <key>:
#               description: <where this link lives in the UI>
#               url: <upstream URL>
#               enabled: true
#
# Per-deployment customization is done from values.yaml under externalLinks.
# DO NOT edit this file to customize a deployment — it is the upstream
# reference shipped with the chart.
#
# Precedence (highest wins) — the resolved `enabled` for each link is:
#   1. values.externalLinks.overrides.<key>.enabled
#   2. values.externalLinks.families.<fam>.sub-families.<sub>.enabled
#   3. values.externalLinks.families.<fam>.enabled
#   4. values.externalLinks.enabled                              (master kill-switch)
#   5. catalog default below                                      (always true)
#
# The master kill-switch skips a link whose resolved url is a path on this site
# (`/blog/`): it cuts links that leave the site, and that one does not.
#
# `url` resolution is simpler: catalog default unless overrides.<key>.url
# replaces it.
#
# Each `<key>` here corresponds to a `data-external-link="<key>"` attribute
# in the HTML layouts. The runtime JS reads window.RUNTIME_CONFIG
# .externalLinks[<key>] and either updates the element's href (if `url`)
# or hides it (if `enabled` is false).

families:

  # ───────────────────────────────────────────────────────────────────────
  # home — external links inside the home page body (layouts/home.html)
  # ───────────────────────────────────────────────────────────────────────
  home:
    description: "External cards, CTAs, and footer-of-content links on the home page body"
    enabled: true
    links:
      sandbox:
        description: "Home page: 'Try Redis Sandbox' link in the Get Redis tools card"
        url: "https://redis.io/try/sandbox/"
        enabled: true
      tutorials:
        description: "Home page: 'Tutorials' card in Explore additional resources. Points at the mirrored tutorials inside this image (build/marketing_mirror), not at redis.io — override the url to send readers to the public tutorials instead."
        url: "/tutorials/"
        enabled: true
      university:
        description: "Home page: 'Redis University' card"
        url: "https://university.redis.io/academy"
        enabled: true
      blog:
        description: "Home page: 'Blog' card. Points at the mirrored blog inside this image (build/marketing_mirror), not at redis.io — override the url to send readers to the public blog instead."
        url: "/blog/"
        enabled: true
      support:
        description: "Home page: 'Redis Knowledge Base' card"
        url: "https://support.redislabs.com/hc/en-us"
        enabled: true
      github:
        description: "Home page: 'Contribute on GitHub — View repository' link"
        url: "https://github.com/redis/docs/"
        enabled: true
      chatbot:
        description: "Home page: 'Improve our AI chatbot — Try the chatbot' link"
        url: "https://redis.io/chat"
        enabled: true

  # ───────────────────────────────────────────────────────────────────────
  # header — top sticky header (layouts/partials/header.html), present on every page
  # ───────────────────────────────────────────────────────────────────────
  header:
    description: "Top sticky header bar present on every page"
    enabled: true
    sub-families:

      main-nav:
        description: "Primary nav buttons in the top bar (Docs)"
        enabled: true
        links:
          nav-docs:
            description: "Top header: 'Docs' link (points to redis.io/docs/ — redundant in airgap since this site IS the docs)"
            url: "https://redis.io/docs/"
            enabled: true

      cta:
        description: "Right-side call-to-action buttons (Login, Sign up)"
        enabled: true
        links:
          nav-login:
            description: "Top header: 'Login' button (Redis Cloud login)"
            url: "https://cloud.redis.io/"
            enabled: true
          nav-try-redis:
            description: "Top header: 'Sign up' red CTA button (rendered twice — desktop top bar and mobile drawer)"
            url: "https://redis.io/try-free/"
            enabled: true

      search:
        description: "Top header: search button (works only when the chart's search service is deployed — see `search.enabled` in values.yaml; without it the button opens an empty modal)"
        enabled: true
        links:
          nav-search:
            description: "Search button (desktop and mobile share the same key). Setting search.enabled turns this on by default, since a deployment that answers searches wants the button; an explicit enabled on this override, the header family or the search sub-family still wins."
            enabled: true

  # ───────────────────────────────────────────────────────────────────────
  # footer — bottom site footer (layouts/partials/footer.html), present on every page
  #
  # The footer logo (top-left of footer) is NOT in the catalog: it always
  # points to "/" (the internal docs home), like the top-header logo, and
  # is not configurable per deployment.
  #
  # Note: the four `legal` links are rendered twice in footer.html — once
  # for desktop (top section) and once for mobile (bottom strip). Both
  # locations share the same key, so a single override controls both.
  # ───────────────────────────────────────────────────────────────────────
  footer:
    description: "Bottom site footer present on every page (social icons, legal, compare, company, cloud partners, services)"
    enabled: true
    sub-families:

      social:
        description: "Social media icon row (Facebook, YouTube, LinkedIn, Instagram, Twitter/X, GitHub)"
        enabled: true
        links:
          footer-social-facebook:
            description: "Footer social row: Facebook"
            url: "https://www.facebook.com/Redisinc"
            enabled: true
          footer-social-youtube:
            description: "Footer social row: YouTube"
            url: "https://www.youtube.com/c/redisinc"
            enabled: true
          footer-social-linkedin:
            description: "Footer social row: LinkedIn"
            url: "https://www.linkedin.com/company/redisinc/"
            enabled: true
          footer-social-instagram:
            description: "Footer social row: Instagram"
            url: "https://www.instagram.com/redisinc/"
            enabled: true
          footer-social-twitter:
            description: "Footer social row: Twitter / X"
            url: "https://twitter.com/Redisinc"
            enabled: true
          footer-social-github:
            description: "Footer social row: GitHub (redis org)"
            url: "https://github.com/redis/"
            enabled: true

      legal:
        description: "Legal links (Trust, Privacy, Terms of use, Legal notices) — rendered twice (desktop block + mobile strip), single key controls both copies"
        enabled: true
        links:
          footer-legal-trust:
            description: "Footer legal: 'Trust' (trust.redis.io)"
            url: "https://trust.redis.io/"
            enabled: true
          footer-legal-privacy:
            description: "Footer legal: 'Privacy'"
            url: "https://redis.io/legal/privacy-policy/"
            enabled: true
          footer-legal-terms:
            description: "Footer legal: 'Terms of use'"
            url: "https://redis.io/legal/redis-website-terms-of-use/"
            enabled: true
          footer-legal-notices:
            description: "Footer legal: 'Legal notices'"
            url: "https://redis.io/legal/"
            enabled: true

      compare:
        description: "'Compare' column — Redis-vs-X marketing comparison pages"
        enabled: true
        links:
          footer-compare-elasticache:
            description: "Footer Compare: 'Redis vs Elasticache'"
            url: "https://redis.io/compare/elasticache/"
            enabled: true
          footer-compare-memcached:
            description: "Footer Compare: 'Redis vs Memcached'"
            url: "https://redis.io/compare/memcached/"
            enabled: true
          footer-compare-memory-store:
            description: "Footer Compare: 'Redis vs Memory Store'"
            url: "https://redis.io/compare/memorystore/"
            enabled: true
          footer-compare-open-source:
            description: "Footer Compare: 'Redis vs. Open Source'"
            url: "https://redis.io/compare/open-source"
            enabled: true

      company:
        description: "'Company' column — about Redis Inc."
        enabled: true
        links:
          footer-company-mission:
            description: "Footer Company: 'Mission & values'"
            url: "https://redis.io/company/"
            enabled: true
          footer-company-leadership:
            description: "Footer Company: 'Leadership' (team page)"
            url: "https://redis.io/company/team/"
            enabled: true
          footer-company-careers:
            description: "Footer Company: 'Careers'"
            url: "https://redis.io/careers/"
            enabled: true

      cloud-partners:
        description: "'Partners' column — public cloud provider integrations"
        enabled: true
        links:
          footer-cloud-partners-aws:
            description: "Footer Partners: 'Amazon Web Services'"
            url: "https://redis.io/cloud-partners/aws/"
            enabled: true
          footer-cloud-partners-google:
            description: "Footer Partners: 'Google Cloud'"
            url: "https://redis.io/cloud-partners/google/"
            enabled: true
          footer-cloud-partners-azure:
            description: "Footer Partners: 'Microsoft Azure'"
            url: "https://redis.io/cloud-partners/azure/"
            enabled: true
          footer-cloud-partners-all:
            description: "Footer Partners: 'All partners' index"
            url: "https://redis.io/partners/"
            enabled: true

      services:
        description: "'Support' column — services + customer support entry points"
        enabled: true
        links:
          footer-services-professional:
            description: "Footer Support: 'Professional services'"
            url: "https://redis.io/services/professional-services/"
            enabled: true
          footer-services-support:
            description: "Footer Support: 'Support'"
            url: "https://redis.io/support/"
            enabled: true

  # ───────────────────────────────────────────────────────────────────────
  # marketing — the pages mirrored from redis.io's marketing site (the blog,
  # tutorials, customer stories and the rest; build/marketing_mirror)
  #
  # Those pages are redis.io's own build, so they carry no data-external-link
  # attributes. The mirror pod's handler (build/marketing_mirror/runtime/
  # marketing-links.js) classifies each of their links by where it leads, and
  # this one key decides what happens to the ones that leave the site: shown,
  # or hidden in menus and footers and reduced to plain text in prose.
  # ───────────────────────────────────────────────────────────────────────
  marketing:
    description: "Links on the mirrored redis.io pages that lead off this site"
    enabled: true
    links:
      marketing-offsite:
        description: "Mirrored pages: every link to redis.io outside the mirrored sections or to another host — menus, footer, share buttons, 'Try Redis', inline links"
        url: "https://redis.io/"
        enabled: true

# ───────────────────────────────────────────────────────────────────────────
# git-mirrors — send links to GitHub repositories to internal GitLab copies
#
# Every entry is one GitHub repository that the docs link to. `repo` is its
# current owner/name; `aliases` are older names that GitHub still redirects,
# so a link written with an old name lands on the same copy. Names match
# case-insensitively and must match the whole owner/name: an entry for
# redis/redis never catches redis/redis-py.
#
# A deployment turns an entry on in values.yaml with `enabled: true` and `to`,
# the GitLab project URL (nested groups are fine). files/git-mirrors.js then
# rewrites, in the browser, every <a href> that points at the repository:
#
#   github.com/<repo>                          → <to>
#   github.com/<repo>/blob/<ref>/<path>        → <to>/-/blob/<ref>/<path>
#   (also tree, raw, blame, commits, commit, tags, compare, branches)
#   github.com/<repo>/releases                 → <to>/-/releases
#   github.com/<repo>/releases/tag/<tag>       → <to>/-/tags/<tag>
#   github.com/<repo>/releases/latest          → <to>/-/releases/permalink/latest
#   github.com/<repo>/releases/download/<tag>/<file>
#                                              → <to>/-/releases/<tag>/downloads/<file>
#   raw.githubusercontent.com/<repo>/<ref>/<path> → <to>/-/raw/<ref>/<path>
#   #L10-L20 (line range)                      → #L10-20
#
# Pull requests, issues, discussions, security advisories, the wiki and
# Actions are not copied into GitLab, so links to them keep pointing at
# GitHub rather than at a page that does not exist.
#
# The entry names are also the repository names in the transfer tool,
# scripts/airgap-mirrors/config/*.toml.example. Keep the two lists the same.
# ───────────────────────────────────────────────────────────────────────────
git-mirrors:

  redis:
    description: "Redis itself: source files, redis.conf per version, release notes"
    repo: "redis/redis"
    aliases: []
    enabled: false
    to: ""

  RediSearch:
