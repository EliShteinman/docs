# ───────────────────────────────────────────────────────────────────────────
# git-mirrors — runtime-rewriting of inline `<a href>` URLs in markdown content
#
# Unlike `families` above (which targets layout elements with
# `data-external-link="<key>"` attributes), this catalog drives prefix-based
# rewriting of plain links rendered from markdown into the static HTML.
#
# How it works:
#   1. Browser loads any docs page → baseof.html sources `js/runtime-config.js`
#      from a ConfigMap (templates/configmap-runtime.yaml) — NO image rebuild.
#   2. The configmap injects `window.RUNTIME_CONFIG.gitMirrors` plus a
#      DOMContentLoaded handler that walks every <a href> on the page.
#   3. For each enabled mirror with a `to` URL set: every href that starts
#      with `from` is rewritten — its remainder is path-translated from
#      GitHub layout to GitLab layout, then prepended with `to`.
#
# Path translation (GitHub → GitLab):
#   /<org>/<repo>/blob/<ref>/<path>     →  /<group>/.../<proj>/-/blob/<ref>/<path>
#   /<org>/<repo>/tree/<ref>/<path>     →  /<group>/.../<proj>/-/tree/<ref>/<path>
#   /<org>/<repo>/releases/tag/<X>      →  /<group>/.../<proj>/-/tags/<X>
#   /<org>/<repo>/                       →  /<group>/.../<proj>/
#
# The handler inserts `/-/` for the GitLab path families: blob, tree, raw,
# blame, commits, commit, tags, releases, wiki, issues. GitLab nested groups
# (`url/group/subgroup/.../project`) are handled transparently because `to`
# is treated as an opaque prefix string — provide the full project URL.
#
# Special case: GitHub's per-tag release page `/releases/tag/<X>` is mapped
# to GitLab's `/-/tags/<X>` (not `/-/releases/<X>`) — `tags/<X>` always
# resolves for any existing tag, while `releases/<X>` requires a GitLab
# Release object to have been created explicitly.
#
# Precedence (highest wins) for the resolved entry:
#   1. values.externalLinks.gitMirrors.<name>.enabled / .to
#   2. catalog default below (enabled: false, to: "")
#
# Default state: every mirror is OFF (enabled: false, to: ""). A deployment
# opts-in by setting both `enabled: true` and a non-empty `to` URL in
# values.yaml — leaving either unset keeps the original GitHub URL intact.
# ───────────────────────────────────────────────────────────────────────────
git-mirrors:

  observability:
    description: |
      Mirror of redis-field-engineering/redis-enterprise-observability.
      Affects 36 inline links across:
        - content/embeds/rs-observability.md
        - content/embeds/rs-prometheus-grafana-quickstart.md
        - content/integrate/prometheus-with-redis-cloud/_index.md
      Set `to` in values.yaml to a GitLab project URL to redirect every
      occurrence (Grafana dashboards, Prometheus alerts, tests directories)
      to the internal mirror — including nested-group URLs like
      `https://gitlab.example.com/group/subgroup/redis-observability`.
    from: "https://github.com/redis-field-engineering/redis-enterprise-observability"
    to: ""
    enabled: false

  k8s-docs:
    description: |
      Mirror of RedisLabs/redis-enterprise-k8s-docs — the upstream source
      for installing the Redis Enterprise operator on Kubernetes /
      OpenShift. Affects ~179 inline links across ~89 files under
      `content/operate/kubernetes/` (current and historical versions),
      including:
        - operator releases / `RedisEnterpriseCluster` API reference
        - example manifests under `examples/`, `crds/`, `openshift/`
        - rack-awareness, vault, log-collector docs
      The runtime handler rewrites only `<a href>` URLs (clickable links).
      `curl` / `kubectl apply -f` commands inside fenced code blocks that
      reference `raw.githubusercontent.com/...` are NOT rewritten — those
      need a separate build-time substitution if required.
    from: "https://github.com/RedisLabs/redis-enterprise-k8s-docs"
    to: ""
    enabled: false

  redis:
    description: |
      Mirror of redis/redis — the upstream Redis source. Affects ~706
      inline links across the docs:
        - command reference pages linking to source / module sources
        - per-version `redis.conf` / `redis-full.conf` raw downloads
          (raw.githubusercontent.com auto-derived from this `from`)
        - release notes (`00-RELEASENOTES`)
      Case variants in the wild (`redis/redis` vs `Redis/Redis`) are all
      covered by a single entry — the handler matches case-insensitively.
    from: "https://github.com/redis/redis"
    to: ""
    enabled: false

  RediSearch:
    description: |
      Mirror of RediSearch/RediSearch (the search/query module).
      ~1,067 inline links — the most-referenced module repo. Catches both
      `RediSearch/RediSearch` and `redisearch/redisearch` casings via the
      handler's case-insensitive prefix match.
    from: "https://github.com/RediSearch/RediSearch"
    to: ""
    enabled: false

  RedisGraph:
    description: |
      Mirror of RedisGraph/RedisGraph (graph database module). ~578
      inline links. Catches both `RedisGraph/RedisGraph` and
      `redisgraph/redisgraph` casings.
    from: "https://github.com/RedisGraph/RedisGraph"
    to: ""
    enabled: false

  RedisInsight:
    description: |
      Mirror of RedisInsight/RedisInsight (the GUI client). ~430 inline
      links. Catches both `RedisInsight/RedisInsight` and the
      `redis/RedisInsight` redirect path.
    from: "https://github.com/RedisInsight/RedisInsight"
    to: ""
    enabled: false

  RedisTimeSeries:
    description: |
      Mirror of RedisTimeSeries/RedisTimeSeries (time-series module).
      ~221 inline links. Catches both `RedisTimeSeries/RedisTimeSeries`
      and `redistimeseries/redistimeseries` casings.
    from: "https://github.com/RedisTimeSeries/RedisTimeSeries"
    to: ""
    enabled: false

  RedisGears:
    description: |
      Mirror of RedisGears/RedisGears (server-side scripting module).
      ~152 inline links.
    from: "https://github.com/RedisGears/RedisGears"
    to: ""
    enabled: false

  RedisJSON:
    description: |
      Mirror of RedisJSON/RedisJSON (JSON document module). ~187 inline
      links. Catches both `RedisJSON/RedisJSON` and `redisjson/redisjson`
      casings.
    from: "https://github.com/RedisJSON/RedisJSON"
    to: ""
    enabled: false

  RedisBloom:
    description: |
      Mirror of RedisBloom/RedisBloom (probabilistic data structures
      module). ~164 inline links. Catches both `RedisBloom/RedisBloom`
      and `redisbloom/redisbloom` casings.
    from: "https://github.com/RedisBloom/RedisBloom"
    to: ""
    enabled: false

  redis-py:
    description: |
      Mirror of redis/redis-py (official Python client). ~100 inline
      links — the most-referenced single client library, used in many
      RedisVL and RAG examples.
    from: "https://github.com/redis/redis-py"
    to: ""
    enabled: false

  prometheus-operator:
    description: |
      Mirror of prometheus-operator/prometheus-operator (third-party
      dependency). ~44 inline links — referenced from the Kubernetes
      observability docs (ServiceMonitor, PodMonitor, alert rules).
    from: "https://github.com/prometheus-operator/prometheus-operator"
    to: ""
    enabled: false
