# External links — built-in defaults
#
# This file ships with the chart and contains every external link rendered by
# the docs site, together with its canonical (upstream) URL.
#
# DO NOT EDIT this file to customize a deployment. It is the upstream
# reference. Per-deployment customization is done from values.yaml under the
# `externalLinks` key:
#
#   externalLinks:
#     enabled: false                 # global kill-switch — see precedence below
#     overrides:
#       <key>:
#         enabled: true|false        # re-enable / force-disable a specific link
#         url: "<replacement-url>"   # replace the URL for a specific link
#
# Precedence (highest wins):
#   1. values.yaml `externalLinks.overrides.<key>` — per-link override
#   2. values.yaml `externalLinks.enabled: false`  — global kill-switch
#   3. this file's defaults                         — `enabled: true` per entry
#
# The `description` field is informational only — it documents what each link
# represents in the UI. It is not consumed by the runtime.
#
# Each key here corresponds to a `data-external-link="<key>"` attribute in the
# HTML layouts. The runtime JS reads window.RUNTIME_CONFIG.externalLinks[<key>]
# and either updates the element's href (if `url` is set) or hides it
# (if `enabled` is false).

links:
  # ──────────────────────────────────────────────────────────────────────
  # Home page — content cards and CTAs (layouts/home.html)
  # ──────────────────────────────────────────────────────────────────────
  sandbox:
    description: "Home page: 'Try Redis Sandbox' link in the Get Redis tools card"
    url: "https://redis.io/try/sandbox/"
    enabled: true
  tutorials:
    description: "Home page: 'Tutorials' card in Explore additional resources"
    url: "https://redis.io/tutorials/"
    enabled: true
  university:
    description: "Home page: 'Redis University' card"
    url: "https://university.redis.io/academy"
    enabled: true
  blog:
    description: "Home page: 'Blog' card"
    url: "https://redis.io/blog/"
    enabled: true
  support:
    description: "Home page: 'Redis Knowledge Base' card"
    url: "https://support.redislabs.com/hc/en-us"
    enabled: true
  github:
    description: "Home page: 'Contribute on GitHub — View repository' link"
    url: "https://github.com/redis/docs/"
    enabled: true
  chatbot:
    description: "Home page: 'Improve our AI chatbot — Try the chatbot' link"
    url: "https://redis.io/chat"
    enabled: true

  # ──────────────────────────────────────────────────────────────────────
  # Top header marketing nav (layouts/partials/header.html)
  # All keys use the `nav-` prefix.
  # ──────────────────────────────────────────────────────────────────────
  nav-redis-for-ai:
    description: "Top header: 'Redis for AI' button (with star animation)"
    url: "https://redis.io/redis-for-ai/"
    enabled: true
  nav-products-dropdown:
    description: "Top header: 'Products ▼' dropdown trigger and its menu"
    enabled: true
  nav-resources-dropdown:
    description: "Top header: 'Resources ▼' dropdown trigger and its menu"
    enabled: true
  nav-docs:
    description: "Top header: 'Docs' link (points to redis.io/docs/ — redundant in airgap since this site IS the docs)"
    url: "https://redis.io/docs/"
    enabled: true
  nav-pricing:
    description: "Top header: 'Pricing' link"
    url: "https://redis.io/pricing/"
    enabled: true
  nav-search:
    description: "Top header: search button (the search backend is not deployed in airgap mode — clicking the button opens an empty modal)"
    enabled: true
  nav-login:
    description: "Top header: 'Login' button (Redis Cloud login)"
    url: "https://cloud.redis.io/"
    enabled: true
  nav-meeting:
    description: "Top header: 'Book a meeting' link"
    url: "https://redis.io/meeting/"
    enabled: true
  nav-try-redis:
    description: "Top header: 'Try Redis' red CTA button"
    url: "https://redis.io/try-free/"
    enabled: true
  nav-mobile-menu:
    description: "Top header: mobile hamburger menu (the entire mobile <nav> drawer)"
    enabled: true
