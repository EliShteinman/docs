# The mirror pod: redis.io's marketing pages as captured by build.marketing_mirror.
#
# Reached through the site's own nginx, which routes the mirrored sections here
# (helm/redis-docs/templates/configmap.yaml).
#
# The Content-Security-Policy is what keeps these pages on this site. They are
# redis.io's own Next.js build, and its JS loads analytics, a consent banner and
# a chat widget by itself, whatever the HTML says. Same-origin only: nothing
# they reach for elsewhere is fetched, and nothing on the page depends on it.
# An author's slug arrives wrapped in encoded slashes: slug=%2Fitamarhaber%2F.
# A map rather than `set` inside an `if`: an `if` that sets a variable becomes a
# location of its own, where the try_files of the one around it never runs.
map $arg_slug $mirror_author {
    "~^(?:%2F)?(?<slug>[a-z0-9-]+)(?:%2F)?$" $slug;
    default "";
}

server {
    listen 8081;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript text/markdown application/json application/x-ndjson image/svg+xml;
    gzip_min_length 1024;
    # The site's nginx proxies here over HTTP/1.0, which nginx does not gzip
    # for by default: every page would cross localhost at 1.5 MB.
    gzip_http_version 1.0;

    # The pages are unpacked into /usr/share/nginx/pages when the container
    # starts (05-unpack-mirror-pages.sh); every other file is in the image, under
    # the server's root. HTML is gzipped as it is sent (gzip on, above).
    location / {
        root /usr/share/nginx/pages;
        try_files $uri $uri/index.html @image;
        expires -1;
    }

    location @image {
        try_files $uri $uri/index.html =404;
        expires -1;
    }

    # The search feed. nginx has no type for .ndjson, and without one it is
    # not on the gzip list: 27 MB went out uncompressed.
    location = /mirror.ndjson {
        default_type application/x-ndjson;
        expires -1;
    }

    # The blog index and category pages fetch their posts past the first 21
    # from redis.io's API as the reader scrolls. Each batch was captured as a
    # file named by its `start` (build/marketing_mirror/feeds.py); a batch that
    # was not captured is a 404, which the page reads as the end of the list.
    location ~ ^/api/blog/feed/?$ {
        if ($arg_start !~ "^[0-9]+$") { return 404; }
        default_type application/json;
        try_files /_feed/blog/$arg_start.json =404;
    }

    location ~ ^/api/blog/category/?$ {
        # Both go into a file path: nothing but digits, and a slug's letters.
        if ($arg_start !~ "^[0-9]+$") { return 404; }
        if ($arg_slug !~ "^[a-z0-9-]+$") { return 404; }
        default_type application/json;
        try_files /_feed/category/$arg_slug/$arg_start.json =404;
    }

    location ~ ^/api/blog/author/?$ {
        if ($arg_start !~ "^[0-9]+$") { return 404; }
        if ($mirror_author = "") { return 404; }
        default_type application/json;
        try_files /_feed/author/$mirror_author/$arg_start.json =404;
    }

    location ~* \.md$ {
        default_type text/markdown;
        charset utf-8;
    }

    # Content-hashed by Next.js: a new build of redis.io gets new names.
    location /_next/static/ {
        expires 1y;
    }

    location /sanity/ {
        expires 30d;
    }
}
